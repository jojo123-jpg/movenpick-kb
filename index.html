se the “less is more” approach, all carefully curated and full of character, individuality and curiosity. It should complement the feel of the design – comfort, style, playful and timeless. The individual pieces make the spaces interesting. But brought together they bring layer, texture and a richer fuller resident’s experience. Consider elements that don’t look “off the shelf ”. This will complement bespoke pieces like tables and lighting. It should never look or feel like a reproduction. Always look to source original, authentic pieces that feel part of the design. The brand’s sustainable approach should be reflected in the use of natural materials such as solid wood and sustainably produced local furnishings. Special attention should be paid to FF&E recycling and elements should be selected that have a potential second life. Additionally, a guided choice FF&E package will be curated as a purchasable option for owners who do not wish to furnish the residence themselves. This should be undertaken by an interior designer aligning with the Mövenpick brand identity. 15 < HOME > 3 DESIGN FOCUS Lighting The right use of lighting can transform a space, enhancing the resident’s experience, often at minimum cost. Think about how light can be used to create intimacy, warmth, drama and transform the mood of a space. Dimming systems are a great lighting feature. A flexible and often inexpensive way to “set scenes” throughout the day and evening. Look to achieve comfortable, eye-catching settings along the key guest journey spaces. The use of natural light and interesting lighting features should always be signature elements of Mövenpick if possible. It brings a different tone to a space whether in the lobby, social spaces, corridors or residences. Where non-natural lighting is required, remember they should be more than simply functional – they are a chance to make a statement. A stylish or oversized pendant or hand-crafted wall light can elevate a space and become a talking point of its own. It can complement or even provide a bold contrast, highlighting unique feature, a space, or a layout. A dimmable combination of atmospheric, decorative floor lamps and ceiling lighting is a must. Depending on the time of the day and weather outside, the mood and ambiance can be changed with a pre-set switch. For example, different arrival moods are applied in the morning and evening. Mövenpick will develop a guided choice lighting package as a purchasable option for owners who do not wish to furnish the residence themselves. This should be undertaken by an interior designer and specialist lighting consultant aligning with the brand identity. 16 < HOME > 3 DESIGN FOCUS Signage & wayfinding A professional branding and graphic designer should be appointed to work closely with the interior design team from the very earliest stages to ensure continuity of story and concept. It is important that signage, wayfinding, and graphic design is sympathetic to the Residences design, seamlessly merged into the over design philosophy and finishes. As with all previous design elements, signage should be timeless, elegant, contemporary, and even playful. It may be discretely visible, subtly styled. Or it could be bold, creating an interesting feature. Quirky, surprising, personal or even situated somewhere unexpected – bringing character to a Residences space. It is important that this team also co-ordinate all the different property logos and collateral graphics (amenities and facilities) to make sure that the presentation is cohesive and consistent. For static/ directional signage: materials should be solid (acrylic, metal, wood). Stickers should be avoided and not used. Brand logos should not be used on flooring, doormats, pool floors, elevator cars or vases. 17 < HOME > 3 DESIGN FOCUS Technology Technology and digital items should be integrated into the architecture and interior design. Efficient use should be incorporated into the design principles from the beginning of the project. Technology, whilst discreet, should be intuitive and feel personal to the owner; it is there to serve their needs whilst ensuring comfort and usability. Technology requirements may vary in each property, but is expected to be revolutionary, up to date, adapted and compatible with international requirements. Each residence should provide the owner with reliable and strong connectivity, enriching the lives of those who use it. Features should include a sound system, centralised remote control and induction charge plates. Future proofing residences by including new technologies such as electric vehicle charging ports and app compatible heating and lighting systems can ensure owners have everything they need whenever they are ready. Both designers and owners will be provided with a list of preferred suppliers and brands which are affiliated with or considered market favourites by Mövenpick to assist them during the design process. 18 < HOME > 3 DESIGN FOCUS Colour Whether it is the use of vibrant colours or muted palettes that reflect a natural quality, a signature colour palette helps fill the canvas for the designers’ own vision. It is a hugely important part of Mövenpick’s brand DNA, and a visual identity that connects the entire property. Designers should remember we are looking for individuality, uniqueness, and personality – all linked to the overall design vision. The combinations available within a colour palette are endless. Play with different levels of brightness and textures, avoiding anything easily lighter colours on areas easily stained or marked such as white fabrics on seating. Use colours that reflect warmth, timeless style and elegance. Avoid pop colours, as well as palettes that may be currently on trend. 19 < HOME > 3 DESIGN FOCUS Art Art takes centre stage in a Residence design. Paintings, photography, wall installations, sculpture, carpets, textiles, wallpaper and glass mosaics can be used to create surprising visual and sensory effects. They help create that unique identity that becomes part of the design. Leaving a lasting impression with owners. Designers are expected to establish a focal point – a signature sculpture, masterpiece, installation, in a strategic position within the residences communal space. All decorative items displayed throughout the shared spaces and circulation areas should represent an enriched layer of the property design, these include table pieces and books. Artful displays of inspired accessories will highlight and contribute to the design, creating rich layers, immersive, stimulating and curios. Designers are encouraged to create real stand alone, unique artwork, avoiding clichéd pieces when curating the artwork, installations and displays. 20 < HOME > 3 DESIGN FOCUS External hoarding Carefully considered, hoarding design and execution should be seen as more than a backdrop or a means of masking unsightly building works during the construction phase of a Mövenpick residential development. Like signage, hoardings artwork and execution will help position and elevate the Mövenpick brand. In many cases it will be one of the main brand engagements during times of construction. It is important that the design and messaging accurately reflects the brands style and values – bespoke, elegant, high quality and created to enhance the overall appearance of the construction site. The nature of hiding a site behind a hoarding naturally creates curiosity. Think carefully about the Mövenpick messaging as this will have the power to position and engage a consumer in a non-intrusive manner. Always use high quality interior renders to promote the high standards of the development. Messaging should help promote the aspects that make each Mövenpick Residences individual, sell the benefits of the residences and include a strong call to action. 21 < HOME > 3 DESIGN FOCUS Sustainable excellence At Mövenpick, we believe in living life well and caring for the people and the world around us. That’s why, through our commitment to sustainable management, we look for new ways and initiatives to make a difference - environmentally, economically, and socially. To us, there’s more to being sustainable than simply lip service. It is a commitment. One that we make every single day thanks to our sustainable management approach. After all, we believe that the future of the world and the future of hospitality are the same. Our initiatives, such as our commitment to global elimination of single-use plastics, not only help us reduce our environmental impact but also help us find new ways to enhance the guest experience by providing alternatives, such as incorporating water filtration stations into hotel and resort public areas and providing guests with Mövenpick branded sustainable water bottles to carry with them in and out of the hotel. As part of Accor’s sustainability programme, we innovate and work with our colleagues, partners and communities to make a positive impact on the world. For more information refer to; – Accor Plastic Operational Guide – Accor Sustainability In Action – Accor Eco-Design Rating Tool available on the Accor D&TS Library. 22 < HOME > 3 DESIGN FOCUS Eco-Friendly alternatives Accor has committed to eliminating all single use plastic from the guest journey, by 2022. Focus on eliminating single use plastic water bottles Mövenpick brand standards are now changing to reflect the mandatory use of eco-friendly products. Single-use plastic water bottles will be replaced by reusable or returnable glass bottles to be filled with tap or filtered water from either staff or guest operated water fountains. Where infrastructure can not accommodate plumbed water fountains or local water is not safe to consume, mineral water can be provided in pre-filled glass bottles or recyclable and biodegradable cardboard cartons made with very little, or preferably no plastic film. Aluminium cans have the largest environmental impact and should be avoided. Care should be taken to ensure that any proposed alternatives in these instances do not have a larger negative impact on the planet than those being replaced, such as containers without FSC or PEFC labels and products which have the least damaging effects on the environment are preferred. Assistance sourcing alternative products will be provided by our global and regional procurement teams. Each alternative, including the visual identity, should be validated by the Mövenpick brand team. Integration of water fountains should be planned at initial design stages for all new build hotels. Existing buildings can easily accommodate water fountains into current infrastructure by considering placement in areas with established water sources such as F&B, Spa, Fitness and Pool or near restrooms. Placement should also consider access to electrical sources for powered water systems if required. Raised flooring and suspended ceilings can be added to help conceal additional piping where necessary. For more information refer to Appendix. 23 < HOME > 3 DESIGN FOCUS Eco-Design method Mövenpick is committed to environmental protection with a focus on sustainable design and construction. As part of this commitment, we have established a set of mandatory standards that aim to build positive eco-friendly approach to the design process. Eco-design is a method that integrates environmental protection criteria into the design process, from the creation to the end of life. Mövenpick design must apply its method from the very beginning of each project, for all areas and products. Our aim is to create the best product and/or space, regarding its use, expected quality, and lifespan, while minimising its negative impacts on the environment. For example, it means favouring mobile furniture to carpentry, easier to reuse and recycle, or always favouring environmental-friendly, local materials. “ Our business is dependent on preserving and conserving the environments, cultures and communities in which we operate. Guests will find evidence of our commitment in the meaning ful details found within our bold, inspired design and genuine craftsmanship”. Mövenpick Brand Team 24 < HOME > 3 DESIGN FOCUS Eco-Design strategy Mandatory actions to implement within Mövenpick design. Good Practice Priorities 2021-2022 Practices to be Avoided Wood and products derived from wood certified FSC or PEFC. Oversized packaging not adapted to the size of the product which increases volumes transported. >20% of the materials (by weight) traced, certified and eco-labeled (GOTS, BCI, FSC, PEFC, GRS, GOLS, cradle to cradle). Products which cannot be maintained, repaired and refurbished. All textiles labelled Oeko-Tex® or equivalent. E1 compliant formaldehyde emission in wood derived products. Multi-materials packaging which cannot facilitate easy recycling. Products which cannot be sourced in regional area (=Hub) and require plane transport. Water or bio-based stains, paints, varnishes and oils. PVC materials in products. 25 < HOME > 3 DESIGN FOCUS Key Principles of eco-design Mandatory principles that must be applied in all Mövenpick design projects. Products Materials Suppliers 1. Always favour mobile furniture over carpentry, avoiding objects that are difficult to reuse and recycle. 2. Select solid furniture with an extended lifespan which is easy to clean, maintain, dismantle and reuse. 3. Limit the number of different materials in any one product, favouring mono-material objects to facilitate easy recycling. 4. Favour furniture with limited covering. 5. Electrical products must have an A+ energy efficiency rating as a minimum. LED is mandatory. 6. Limit the use of metal in furniture, Favour suppliers who: 10. Limit and value production loss. 11. Limit the use of energy for production, and if possible, use renewable energy. 12. Use eco-friendly transport such as co-trucking and eco-driving and implement a CO2 charter to reduce their carbon emissions. avoiding chrome finishes (except for bathroom equipment) and galvanized steel. Stainless steel is preferred but only if it is justified in its use by extending the objects lifespan or protecting frequently used mechanisms. 7. Always select materials with a view to extending the lifespan of the object. For example, plastic is not necessarily worse than metal if it prolongs the objects use. 8. Favour wood or materials derived from wood and plywood, using only water-based and natural glues. 9. Avoid materials that are not easily recycled such as PVC edges, fiberboards and inert materials that cannot be dismantled. 26 < HOME > 3 DESIGN FOCUS Ergonomics for health & well-being 1/2 Principles to facilitate accessible cleaning for our housekeeping colleagues and create the healthiest, most comfortable room for our guests. Layout Materials Less furniture and objects to move and clean. Curtains 1cm above floor to avoid lifting to vacuum. Washbasin countertop width 70cm or more, where possible, to allow enough space for guest’s belongings. Smooth materials and rounded edges that reduce dust collection. Anti-stain finishing on surfaces. Floor textiles in light colours or plain patterns that easily show marks or stains. Washbasin or shower tray in dark colours that reveal traces of limescale. Shelves easily accessible for both guests and housekeeping colleagues with top shelf height in a wardrobe less than 1m65cm from floor. If above 1m65cm, shelf should be made in tube or grid to avoid dust, and at a maximum height of 1m80cm to easily see objects. Heavy furniture that is difficult to move. Shower tray less than 90x100cm, with entry space less than 65cm. Narrow circulation spaces around objects, for example, less than 60cm clearance around each bed. Gaps between furniture/joinery that cannot be properly cleaned. 27 < HOME > 3 DESIGN FOCUS Ergonomics for health & well-being 2/2 Principles to facilitate accessible cleaning for our housekeeping colleagues and create the healthiest, most comfortable room for our guests. FF&E Power sockets between 40cm and 1m20cm from floor for easy access for both guests and housekeeping colleagues. Shower toiletries at back of shower or in wall niche that impedes easy cleaning. Power sockets at easily accessible heights for fixed devices such as TV, phone or minibar. Shelves that are too high (above 1m65cm) or too low (under sink). Power socket for vacuum at easily accessible height that prevents housekeeping staff from stooping. Mirrors that are too high or wide and require specialist cleaning tools. Power sockets with child safety shutters. Shower screens that are too high or wide and require specialist cleaning tools. Bed with adjustable height, where possible, to facilitate easy linen changes. Furniture and objects that are too low to facilitate easy cleaning, for example, minibar on the floor. Washbasin and countertop width above 70cm, where possible, to allow enough space for guest’s belongings. Wardrobe without doors and easily accessible shelves. 28 < HOME > 4. Services – Core services – À La Carte services 29 29 < HOME > < HOME > 4 SERVICES Core services Core Services are made available to all property owners and are included in the residence service charge. The final offering of core services will be customised around the needs of the target buyer and jointly agreed with the developer. Typical examples include: – Butler services (up to 30 minutes) – Residence concierge – Doormen – Valet parking – Security – Residents Lounge/Clubhouse staff – WI-FI internet within Residents Lounge/Clubhouse – Accor ownership benefits program* – Property insurance (base building/shared spaces) – Shared spaces maintenance – Shared spaces housekeeping – Shared spaces utilities – General and administrative services *Subject to annual membership fee. 30 < HOME > 4 SERVICES À La Carte services À La Carte Services are optional and subject to additional charges. When a Residence owner reserves a service, the resulting charge will typically be billed to their personal account. The Residence Concierge co-ordinates all À La Carte Services, providing a single point of contact to residents. À La Carte services are also customised around market needs. Typical examples include: – In-residence dining/personal chef – Butler services (more than 30 minutes) – Shopping services/personal assistant – In-residence well-being spa treatment – Childcare – Dog walking service – Dry cleaning and laundry – Private transportation/limousine services – In-residence housekeeping – In-residence maintenance – “While you were away” (turnkey in-residence maintenance solution for owners who frequently reside elsewhere) 31 < HOME > 5. Architecure – Adjacencies diagram – Indicative plan – Area sizes – Exterior & facade – Arrival lobby – Corridors & circulations 32 32 < HOME > < HOME > 5 ARCHITECTURE Adjacencies diagram Fitness & Spa Residents Lounge/ Clubhouse Heart of House Residences Private access to co-located Mövenpick hotel Private & discreet circulation Warm family welcome Arrival Lobby 33 Local & respectful Main entrance Sales Gallery < HOME > 5 ARCHITECTURE 1. DROP OFF 2. ARRIVAL LOBBY 3. LIFT LOBBY 4. CONCIERGE 5. WASH STATION 6. WELCOME 7. RETAIL 8. MAILBOXES 9. STAIR 10. HOH FRONT OFFICE 11. LOUNGE 12. FLEXIBLE FOOD DISPLAY 13. CO-WORKING/CAFE SEATING 14. LIBRARY 15. FEATURE BOOKCASE WALL 16. BAR 17. SHOW KITCHEN/WINE TASTING 18. PLAYGROUND 19. MEDIA HUB 20. ACTIVITY TABLE 21. LIBRARY WALL 22. THE EVENT ROOM 23. FEATURE GANTRY 24. PANTRY 25. LIFT LOBBY 26. DELIVERY ROOM 27. OUTDOOR PLAYGROUND 28. ORGANIC GARDEN 34 27 18 19 20 12 11 13 28 26 16 17 24 9 25 23 22 15 14 19 21 7 6 4 5 1 10 8 7 2 9 3 < HOME > 5 ARCHITECTURE 1 3 2 9 8 7 6 10 11 12 4 4 5 13 14 15 21 18 2 17 19 20 16 LIFT LOBBY 1. 2. STAIR 3. WAITING AREA 4. TREATMENT ROOM 5. GAMES ROOM 6. GYM 7. RESISTANCE 35 8. KINESIS WALL 9. FUNCTIONAL FITNESS 10. AMENITIES 11. CARDIO 12. FREE WEIGHTS 13. LADIES CHANGING 14. MENS CHANGING 15. 20M LAP POOL 16. LOUNGERS 17. THERMAL EXPERIENCE 18. VITALITY POOL 19. STEAM 20. SAUNA 21. EXPERIENCE SHOWERS < HOME > 5 ARCHITECTURE Area sizes Sizes are indicative and should be used as a guideline only. Residents lounge/clubhouse Arrival Lobby Welcome Retail Lounge Library Bar Indoor Outdoor Total 150m2 n/a 150m2 90m2 n/a 90m2 Varies n/a Varies 175m2 n/a 175m2 100m2 n/a 100m2 240m2 n/a 240m2 Organic Garden n/a 150m2 150m2 The Event Room 132m2 n/a 132m2 Playground 120m2 90m2 210m2 Fitness & Spa Apartments Gym Pool Thermal Experience Treatment Room 237m2 n/a 237m2 260m2 n/a 260m2 80m2 n/a 80m2 60m2 n/a 60m2 Studio 60m2 n/a 60m2 One Bedroom 80m2 n/a 80m2 Two Bedroom 120m2 n/a 120m2 Three Bedroom 160m2 n/a 160m2 Indoor Outdoor Total Indoor Outdoor Total NOTE: Based on a development of 100 - 150 Residences, the approximate size of facilities to be included are: – 800 - 1,200 m2 area of Residents Lounge/Clubhouse and Fitness facilities for Ultra-Luxury Residences. – 600 - 1,000 m2 area of Residents Lounge/Clubhouse and Fitness facilities for Luxury Residences. – 500 - 700 m2 area of Residents Lounge/Clubhouse and Fitness facilities for Premium Residences. – 250 - 500 m2 area of Residents Lounge/Clubhouse and Fitness facilities for Premium Residences. The exact facilities provided will be determined by location and requirements of the local market. In a situation where a smaller Residences is collocated with a hotel, some facilities such as Fitness may be shared within the hotel development. 36 < HOME > 5 ARCHITECTURE Exterior & facade A Urban Mövenpick Residences building should endeavour to be classic and contemporary in its programming yet not minimalist or trend-driven. In appearance, Mövenpick Residences are a champion of local design and convention. The architecture of the building will comfortably integrate within its surroundings and the local environment. Urban Residences will most often take the form of apartments and villas. They are found in some of the world's most compelling locations and should become an integral part of their surroundings, an alluring destination for second homes. Cultural influences should be evident throughout with strategically positioned organic relief in unexpected, artistic ways, such as floor patterns, balustrades, carpets and textiles. Include uniquely designed and sensory finishes. Mövenpick Residences should encompass all it means to be a Mövenpick property - honest, contemporary and visionary. The architecture should give residents the feeling they are entering a sophisticated and unrivalled personal sanctuary. Each building must facilitate a warm and personal welcome unique to the property and the location. 37 < HOME > 5 ARCHITECTURE Arrival lobby The Residences Arrival Lobby is the first, and some would argue, the most important impression of a Mövenpick property. A warm and genuine welcome is fundamental; owners should feel like they are coming home whenever they cross the threshold. Pleasant aromas and atmospheric lighting are honed to create an intuitive ambience, with each element blending intelligently. Views, sightlines and spatial awareness are crucial to making the Arrival lobby successful. A residential design style should be adopted in these areas to further heighten the sense of home, with comfortable furniture and well-considered objet d'art. Journey and experience should drive an assertive focus in the design strategy. By using design to champion the heritage of the surrounding community, Mövenpick Residences are a welcome addition to their surroundings; Each property celebrates the cultural significance of the area they belong to and becomes interwoven with the setting to support and champion the district. Aside from the design, helpful staff are in tune with each owner's needs and philosophies to provide unparalleled service and build long-lasting, professional relationships. Intuitive augmented technology solutions should be present in the Arrival Lobby and throughout all shared spaces to enhance unique experiences. 38 < HOME > 5 ARCHITECTURE Arrival lobby 150m2 (including Lift lobby) 39 HOH front office Mailboxes Stair Retail Wash station Lift lobby Concierge Arrival Lobby Drop off < HOME > 5 ARCHITECTURE Corridors & circulation Corridors and circulation spaces play a central role in the Mövenpick Residences experience. Facilitating seamless journeys, circulation routes should be thoughtfully considered and intuitive. Every element of all circulation spaces should be well designed with appropriate and comprehensive signage alongside decorative and functional lighting incorporated into the classic design aesthetic for which Mövenpick is renowned. Elevators and all vertical travel within a Mövenpick Residence property should be deemed a place of warmth, familiarity and contentedness that aims to strengthen the connection between owners and their homes. Elevators should be encouraged to recall the heritage of the location in unique and inspiring ways. 40 < HOME > 6. Residents Lounge /clubhouse – Adjacencies diagram – Overview My Mövenpick Marketplace – Welcome – Retail – Lounge – Library – Bar – Organic garden* – The Event room – Playground *Essential amenities 41 41 < HOME > < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Adjacencies diagram Access to outdoor facilities Residences Library Bar My Mövenpick Marketplace Organic Garden Playground Lounge Retail The Event Room Welcome Heart of House 42 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Residents Lounge /Clubhouse The Residents Lounge/Clubhouse within Mövenpick Residences is a series of shared spaces where all owners should feel cared for and encouraged to discover life's true rewards. It is at the heart of Mövenpick Residences, where quality and care are manifested; alongside premium location, this space is one of the principal reasons owners choose Mövenpick over all other Residences. The central portion of the Residents Lounge/Clubhouse is dominated by My Mövenpick Marketplace, a modular layout system that encompasses seven essential touch points of the Mövenpick service and experience. These touch points are Welcome, Shop, Eat, Relax, Work, Learn, Drink, and these touchpoints are the epitome of the Residents Lounge/Clubhouse offering. Despite being designed to differentiate spaces, the modular concept is multi-leveled, incorporating open transition spaces and retail components that allow views through into neighbouring areas. In the Residents Lounge/Clubhouse, openness must be emphasised successfully alongside places that provide privacy. Designers with developers, guided advice, and workshops should establish which facilities and touchpoints should be incorporated and how they should be positioned within the main Residents Lounge/Clubhouse space. Although Mövenpick Residences may not offer every service at all locations, the design philosophy for each should be standard. Indulgent, sophisticated, luxurious and comfortable. Each Residents Lounge/Clubhouse should be a pleasant space that reflects the residential nature of the Mövenpick brand with undeniable classic designs and functional furniture solutions that bring value to each area. Each Residents Lounge/Clubhouse space should be seen as fully adaptable and multi-functional, catering to the owners' individual tastes. 43 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE My Mövenpick Marketplace (MMM) Welcome A warm welcome is paramount in Mövenpick Residences and one of the first touchpoints to be addressed within My Mövenpick Marketplace (MMM). This is the starting point of the MMM journey, owners using this space should feel comfortable, relaxed and engaged in a space that reflects a sense of quality that is at the core of Mövenpick . The Welcome experience is anchored by four primary Mövenpick products which are coffee, chocolate, wine and, of course, the famous Mövenpick ice cream. Throughout the day roaming hosts will serve products encouraging the every day indulgence that Mövenpick aims to satisfy. Beautifully displayed retail items enhance the environment and guest interaction with the Mövenpick brand. Yet, while retail displays are present throughout the Welcome space, it's necessary to ensure that the Welcome area does not incline towards feeling like a store or become a transient area. Owners are encouraged to sit and spend time here, so various comfortable seating options are fundamental. 44 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Welcome 90m2 45 Retail Retail Ottoman Display Retail Wash station Concierge < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE My Mövenpick Marketplace (MMM) Retail Mövenpick has been making mouthwatering moments for over 70 years and, as a brand, has delighted the world with many delicious products since its inception. In a nod to the celebrated Swiss heritage and famous chocolate, ice cream, and indulgent treats of Mövenpick, each Residence's property should include a Retail area. Derived from an appetite for accessible indulgence, the Retail area allows owners a place to savour new ways of relishing life by providing an option to shop and purchase delicious Mövenpick products alongside health-promoting commodities. As part of the unique Mövenpick Residences offering, the Retail space becomes interwoven with the Residents Lounge/Clubhouse and My Mövenpick Marketplace. How items are displayed intelligently and in an appealing manner is a central challenge to the organisation of the Residents Lounge/Clubhouse. The requirements for shelving, refrigeration and display units will be established on a location-by-location basis. 46 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Retail N/A 47 Retail Retail Seating Retail Display Seating < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE My Mövenpick Marketplace (MMM) Lounge For Mövenpick Residences, the Lounge makes up the core of the Residents Lounge/Clubhouse, while MMM areas overlap to reinforce the facilities seamlessly. Adaptable counters designed to reflect the premium quality of Mövenpick are intelligently positioned to display food and beverage. The counters should comfortably support a transition of the required environmental conditions from day to night, providing options for grab-and-go, relaxing over morning coffee or enjoying a glass of wine. A mixture of multi-level seating divided and positioned into \"pods\" should be preferred over a distinctive or separated lounge space. The space should facilitate owners in building a personalised experience, coffee from one \"stall\" and baked goods from another. A unique chocolate display supports the famous Mövenpick Chocolate Hour alongside a well-curated retail offering to enrich every occasion. Functional and comfortable furniture promoting respite is vital for this location, as owners should feel encouraged to linger at the Lounge—savouring time with their friends and neighbours. As MMM is fluid in installation and in concept, so should any artwork that features in the space. Sculptural and ever-changing is preferred. While a connection to location, culture, season or event is encouraged. 48 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Lounge 175m2 49 Flexible food display Group table Co-working/ Cafe Table < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE My Mövenpick Marketplace (MMM) Library The Library within MMM is a seamlessly connected and flexible space that allows owners to sit with a laptop, meet and network over coffee or a cocktail. The design ethos and furniture selection should combine lounge, dining and co-working styles. Adaptability is essential, and the space should function successfully from day to night. As part of My Mövenpick Marketplace, the Library should feel comfortably integrated into other areas and create a sense of connectedness within the overall Residents Lounge/Clubhouse environment. Ultimately the Library should be a place of comfort for those who simply wish to immerse themselves in a book of their own or for those who choose to read one from the extensive curated display. The shelves should include titles relevant to the property's location and heritage. Lighting must be thoughtfully considered in the Library for practical use while additionally producing a calm atmosphere. 50 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Library 100m2 Feature bookcase Acoustic wall Work table 51 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE My Mövenpick Marketplace (MMM) Bar Food and beverage play a considerable role in the personality of Mövenpick properties. While Mövenpick Residences typically won't have a dedicated restaurant, an owner's Bar is a welcome addition to the Residents Lounge/Clubhouse. It should be considered as part of the My Mövenpick Marketplace layout. The design of the Bar should wholly encapsulate a sense of indulgence, comfort is a top priority, and owners should feel confident in whiling away hours in this space. Inspiring displays are paramount to showcasing the best of Mövenpick, while lighting, refrigeration, and originality play an integral role in the Bar's success. A multi-use serving counter adds an interactive element to the Bar area, providing an opportunity for various guest exchanges, including food and beverage-orientated workshops, demonstrations or classes. Chefs and mixologists will engage and interact with owners whilst serving premium food and drink. Such options enrich the Residences experience by offering \"Heart Warming Moments\". A balance choice of furniture typologies, including dining facilities, comfortable low-level seating, group tables and individual seating space, should all combine harmoniously to form a distinctive and inviting environment to enjoy delectable treats. 52 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Bar 240m2 53 Show kitchen/ wine tasting Bar Seating Acoustic wall < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE My Mövenpick Marketplace (MMM) Organic garden The Organic Garden is a highlight at Mövenpick Residences. Following the Mövenpick philosophy, it celebrates a love for spectacular food and the wonders of our natural environment. As a multi-functional space, the Organic Garden provides many options for private and social interactions, whether residents are looking for a place of peace and serenity, a venue to hold a memorable event, or a space to indulge in fantastic local and favoured cuisine. Private seating areas are well used in these spaces, while crisp lawns provide opportunities for games and picnics. Group tables are positioned for hosting unforgettable parties and social gatherings. An outdoor kitchen or barbecue area may be included in some markets to facilitate memorable experiences. In many cases, The Organic Garden may support the Residents Lounge/Clubhouse through the farm-to-fork growing of fruit, vegetables and herbs. The Mövenpick Residences team tends to the outdoor plot and works tirelessly to provide the highest quality fresh seasonal produce. A \"Harvest You're Own Meal\" option may be utilised in Mövenpick Residences to bring owners closer to the foods they consume. Consideration must be taken when planning to ensure easy and safe access to the farms, while sun and shade exposure must be adequate for the purposes of growing crops. 54 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Organic garden 150m2 55 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE The Event room Mövenpick Residences event spaces are developed with efficiency and adaptability at the heart of their concept. Derived from the changing habits of our daily lives and that of the overarching hospitality industry, The Event Room is determined to optimise space and provide ultimate adaptability. The Event Room uses its floorplate exceptionally well, incorporating complete multi-functionality through its layout options and furniture specification. The area should be flexible in its operation and exceptional at catering to every owner's unique needs. The adaptable private room provides the model environment for casual work meetings, exquisite intimate dining experiences and unforgettable entertaining with friends or family. The Event Room, although contemporary in form and function, should remain classic in its presentation to honour the Mövenpick brand strategy. A vibrant atmosphere should be achieved when The Event Room is chosen to host sparkling celebrations; therefore, intuitive augmented technology solutions are a must to achieve these goals. Soundproofing and intelligent acoustic strategies should be assumed to curate the best possible experiences for all owners in Mövenpick Residences. 56 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE The Event room 132m2 Feature gantry Feature gantry Media hub Group table 57 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Playground Mövenpick believes it's never too early to appreciate the finer things in life and its honour and privilege to nurture and educate the youngest of our residents. Mövenpick Residences Playground space is a dedicated, fun area designed to occupy and entertain children from a broad age spectrum. Within Mövenpick Residences properties, a specific area should be earmarked as a children's and young person's activities space. The Playground should be designed so young people can enjoy the space themselves without continuous supervision in a stimulating and inspiring environment. At the same time, parents can settle elsewhere in the Mövenpick Residents Lounge/ Clubhouse or use the facilities within the fitness areas. The design of the Playground space should not feel childish. It should maintain the strict values of the Mövenpick brand by striving for classic contemporary lifestyle design and encouraging sustainable practices. This is not a place for plastic toys and games. Where possible, the Playground should connect to a secure outdoor space to promote interaction with nature. A wide range of activities such as cooking classes, arts and crafts, reading and children's movies are vital to this area and should all strive to convey the brand's personality while challenging and developing the minds of the young people who reside here. 58 < HOME > 6 RESIDENTS LOUNGE/CLUBHOUSE Outdoor Playground Playground Indoor: 120m2 Outdoor: 85m2 59 Sink Indoor Playground Library wall Media hub Activity table < HOME > 7. Fitness & Spa – Adjacencies diagram – Overview – Gym – Pool – Thermal experience – Treatment rooms 60 60 < HOME > < HOME >"}, {"code": "DB-CN", "title": "瑞享设计简报（城市+公寓 · 中文版）", "en": "Mövenpick Design Brief (Urban + Living) CN", "cat": "cat_brand", "version": "V1.0", "date": "2026-04", "brand": "Mövenpick 瑞享", "file": "Mövenpick Design Brief V1.0-CN (1).pdf", "path": "C:\\Users\\JOZHOU\\Downloads\\Mövenpick Design Brief V1.0-CN (1).pdf", "pages": 68, "size_mb": 32.68, "desc": "中文版设计简报，面向筹建瑞享项目的设计师、项目经理、开发商、业主与投资者。阐述品牌概览、设计策略、设计实践、建筑场景、酒店区域与案例研究，对齐瑞享设计基因。Pre-HCSA 阶段文件。", "kw": ["设计简报", "Design Brief", "城市", "公寓", "Urban", "Living", "设计基因", "设计策略", "案例研究", "Pre-HCSA", "中文"], "reference": false, "refNote": "", "text": "设 计 简 报 城市 + 公寓 版本 1.0 2026 年 4 月 本文件适用于谁? 本文件面向参与 Mövenpick 项目筹建的所有人:设计师、项目经理、开发商、酒店业主 与投资者。 我们邀请您沉浸于 Mövenpick 品牌——本文件帮助您将项目与 Mövenpick 的设计基 因对齐,在我们的理念框架内激发灵感。 这是一份 Pre-HCSA 文件,阐述品牌的核心设计要素,呈现视觉与空间基因,并说明品牌如 何在不同场景中表达。 目 录 品牌概览 设计策略 设计实践 理解 Mövenpick 品牌:战略、宗旨、热情与定位。 熟悉位于所有 Mövenpick 酒店核心的基础设计基因与品牌概念。 设计哲学的实践——理念在哪些关键区域影响酒店的设计? 建筑场景 酒店区域 案例研究 理解 Mövenpick 酒店的不同类型与关键差异。 熟悉 Mövenpick 酒店内不同区域的关键考量与机会。 精选全球案例,各具特色地诠释独到的 Mövenpick 设计基因。 品 牌 概 览 品牌简介 品牌支柱 品 牌 简 介 品牌渊源 1948 年由餐饮人 Ueli Prager 创立于瑞士。Mövenpick 始于一家餐厅 而非酒店——以热情、开放、现代的氛围奉上高品质饮食。这一理念 品牌愿景 / 价值主张 奠定了 Mövenpick 精神:\"以非凡之道做寻常之事。\" 我们相信,最珍贵的时刻是当我们真正投入、真正在场的时刻。 以\"生活之趣\"的精神,通过非凡时刻让家人、朋友与团队重新相聚——这 是我们提供的愉悦重连。 品 牌 支 柱 重 连 欢 愉 慷 慨 让人重新回到最重要的事:与亲近之人真诚的瞬间。 以细微心意与分享精神,超越期待的款待文化。 以轻盈与喜悦庆祝生活中或大或小的时刻。 设 计 策 略 设计策略 ·设计哲学 设计支柱 设计策略四要点 设 计 策 略 独特且易于转化的品牌 易于落地实施的设计 以欢聚与餐饮为核心的宾客体验 聚焦投资 · 影响显著 Mövenpick 拥有鲜明的空间识别， 设计框架以敏捷应用为目标进行构 Mövenpick 的空间策划聚焦于宽敞且 投资被有策略地集中投向定义宾 能够灵活适配多种建筑形态。品牌 建。品牌表达依靠智慧的空间规划、 全日活跃的社交场域。灵活的布局、多 客空间旅程的高影响力区域。这 以温暖、欢聚的氛围与以餐饮为核 多层次的FF&E与照明，而非依赖 样的座位类型与通透的空间边界，自然 种有的放矢的设计策略，使得分 心的社交活力为基调，通过少量清 大规模的结构重塑。在大多数改造 支持休憩、轻办公与聚会等多元场景。 阶段改造成为可能，并通过可规 晰且易于辨识的设计标识， 便能确 项目中，仅需针对公共区域以及高 可见的烹饪舞台与以餐饮为主题的设计 模化、可复制的室内解决方案实 立其
