 the brand. The document introduces the visual and spatial DNA, articulating how the brand is expressed across environments. All rights reserved. No part of this document may be reproduced, stored in a retrieval system or transmitted, in any form or by any means, without the prior permission in writing from ACCOR. CONTENT 01 Brand Overview 02 Design Strategy 03 Design in Practice Understanding the Mövenpick brand: our brand stratergy, purpose, passions, and positioning. Getting familiar with our foundational design DNA and the core brand concept that is at the heart of all Mövenpick hotels. Applying the design philosophy in practice: what are the key areas where our philosophy can impact the design of our hotels? 04 Building Scenarios 05 Hotel Zones 06 Case Studies Understanding the different types of Mövenpick hotels: types and key differences. Getting familiar with the different areas within Mövenpick hotels: what are the key considerations and opportunities for each zone. A curated selection of our hotels worldwide, each uniquely embodying and interpreting the distinctive Mövenpick design DNA, inspired by their individual locations. K C I P N E V Ö M F E I R B N G I S E D 3 K C I P N E V Ö M F E I R B N G I S E D Brand Overview Brand Summary Brand Pillars 5 6 4 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES BRAND OVERVIEW Brand Summary K C I P N E V Ö M F E I R B N G I S E D Brand Heritage Brand Vision Founded in Switzerland in 1948 by restaurateur Ueli Prager, Mövenpick began not as a hotel, but as a new approach to dining. Mövenpick restaurants offered high-quality food in a welcoming, open, and modern setting. This philosophy became the foundation of the Movenpick spirit: \"We simply do ordinary things in an extraordinary way.\" We believe that the most precious moments are those when we are truly engaged, truly there. Value Proposition Offering Joyful Reconnection. Reconnecting families, friends and teams through extra- ordinary moments, with a spirit of ‘Joie de Vivre.’ 5 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D BRAND OVERVIEW BRAND OVERVIEW Brand Pillars Reconnection Joy Generosity The art of bringing people back to what matters most: authentic moments with close ones A culture of going beyond ​expectations through the little extras and a sharing spirit​ Celebrating life’s moments,​ big & small, with lightness​ and cheerfulness​ 6 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D Design Strategy Design Strategy Design Philosophy Design Pillars 8 9 10 7 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES BRAND OVERVIEW Design strategy K C I P N E V Ö M K O O B Y A L P A Distinctive, Conversion-Friendly Brand Designed for Easy Implementation A Convivial, Food & Beverage‑Led Guest Experience Focused Investment, Strong Impact Mövenpick’s strong spatial identity translates effectively across diverse building typologies. Defined by warm, convivial environments and food-led social energy, the brand’s physical presence is established through a through a small number of clear and recognisable design markers. This allows for consistent brand expression without requiring complex structural interventions. The design framework is engineered for agile application. Brand expression relies on intelligent spatial planning, layered finishes, FF&E, and lighting rather than heavy structural reconfiguration. In most conversion projects, targeted interior upgrades to public zones and high-visibility guest touchpoints are sufficient to physically anchor the brand. Mövenpick’s spatial programming centres on generous, day-to-night social volumes. Flexible layouts, varied seating typologies, and fluid boundaries seamlessly support lounging, informal work, and gathering. Visible culinary theatre and food-led design cues act as the primary spatial anchors, driving energy and interaction throughout the public areas. Investment is strategically directed toward high-impact zones that define the guest's spatial journey. This targeted design approach enables phased renovations and efficient delivery through scalable, repeatable interior solutions. 8 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D DESIGN STRATEGY Design Philosophy Designed for joyful interaction and generous comfort. Our design philosophy is rooted in reconnection, joy, and generosity. We design spaces for unforced encounters and a natural sense of belonging, where familiar rituals bring loved ones, friends, and colleagues together. Joy comes in small, unexpected delights, and generosity in choice, comfort, and thoughtful details. Every element is curated to inspire interaction and delight, with sustainability ensuring harmony and lasting impact. 9 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D DESIGN STRATEGY Design Pillars Social ease Emotional choreography A space caring for you Reconnection Joy Generosity Design to create a sense of gentle belonging. and reconnection through familiar ritual. Moments of delight, small unexpected experiences. Thriving in curiosity, uplifting surprise and connection. Providing choice and comfort. Quietly exceptional through thoughtful extras. 10 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D DESIGN STRATEGY Nesting seats Rituals Reconnection Digital Detox Analog moments A sense of togetherness 11 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D DESIGN STRATEGY Moments of delight Cheerful textures Joy Joy Joyful interaction Energetic patterns and scales 12 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D DESIGN STRATEGY Warm & Welcoming Thoughtful touches Generosity Caring details Gracious comfort 13 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M K O O B Y A L P 14 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Design in Practice Materials Furniture Lighting Sustainability Artwork Technology OS & E Signage 15 16 17 18 19 20 21 22 DESIGN IN PRACTICE Materials Material choices at Mövenpick translate into tactile, sustainable experiences: These quietly exceptional surfaces foster comfort through choice. Every surface and texture emphasizes playful yet high-quality detailing. Patterns and warm, textured materials are carefully chosen to evoke comfort and richness. Guests are invited to engage with their surroundings. This approach ensures the hotel feels both inviting and meticulously designed, blending creativity with comfort and timeless quality. Comfortable & Inviting Playful Patterns K C I P N E V Ö M F E I R B N G I S E D 15 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Specialist consultant to define design direction for each location. DESIGN IN PRACTICE Furniture Furniture becomes an invitation — to gather, to share, to linger. Designed for flexibility, pieces adapt to moments of togetherness, shifting easily to bring people closer. Playful elements spark curiosity and encourage interaction, while thoughtful details anticipate guests’ needs before they’re spoken. Layered, soft cushions and generous proportions create a cozy, residential feel. Here, furniture isn’t just functional, it’s the quiet host of connection and joy. Shared comfort & Closeness Anticipates guests’ needs Inclusive K C I P N E V Ö M F E I R B N G I S E D 16 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Specialist consultant to define design direction for each location. DESIGN IN PRACTICE Lighting Lighting becomes the heartbeat of the space — expressive, joyful, and alive. Each light is a feature that celebrates Mövenpick’s spirit, transforming atmospheres with a single glow. Functional yet emotional, illumination responds to every moment: a gentle glow beneath the bed guiding your first steps, a warm pool of light on the table inviting conversation. Layered and thoughtful, the lighting design shapes mood and connection, turning everyday gestures into experiences of comfort and delight. Sparks curiosity Embracing & Warm Cheerful K C I P N E V Ö M F E I R B N G I S E D 17 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Specialist consultant to define design direction for each location. DESIGN IN PRACTICE Sustainability Materials are chosen for their stories as much as their strength: recyclable, renewable, and meant to last. Each piece is designed with time in mind — durable, repairable, and easy to disassemble, so that renewal is always possible. Nothing is wasted, everything has purpose This design respects the cycle of use and care, where longevity becomes the truest form of beauty, and responsibility feels effortless and human. Recyclable Durable Designed for disassembly K C I P N E V Ö M F E I R B N G I S E D 18 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Specialist consultant to define design direction for each location. DESIGN IN PRACTICE Artwork Friendly, uplifting, and subtly present. Colour, forms, and textures spark delight, while thoughtfully placed art pieces create opportunities to connect — with others, with the space, and with the brand’s spirit. Art is not just decoration, it is a catalyst for connection and a quiet source of everyday joy. Textural Friendly Exploratory K C I P N E V Ö M F E I R B N G I S E D 19 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Specialist consultant to define design direction for each location. DESIGN IN PRACTICE Technology Technology is always present, quietly supporting the experience without ever being in the way. It is thoughtfully concealed, integrated into the space so that it doesn’t distract from the moments that matter. Concealed Quietly-present Seamlessly integrated K C I P N E V Ö M F E I R B N G I S E D 20 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Specialist consultant to define design direction for each location. DESIGN IN PRACTICE OS&E OS&E is more than functional, it is a catalyst for connection, play, and meaningful quality time. The presence of entertaining board games and purposefully places jars of chocolate, turn every day gestures - a snack, a game, a chat - into a joyful experience. Joyful Details Analog Games Indulgent Moments K C I P N E V Ö M F E I R B N G I S E D 21 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Specialist consultant to define design direction for each location. DESIGN IN PRACTICE Signage Signage becomes a friendly guide, welcoming everyone with clarity and warmth. Pictorial elements ensure that children and adults alike can navigate the space effortlessly. Thoughtful, inclusive, and approachable, the signage subtly supports exploration, helping guests feel confident, cared for, and free to enjoy the experience together. Clarity Inclusive Playful K C I P N E V Ö M F E I R B N G I S E D 22 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Specialist consultant to define design direction for each location. K C I P N E V Ö M F E I R B N G I S E D Building Scenarios Building Typologies Spaces Key Touchpoints Key Concept Areas 24 25 26 27 23 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES BUILDING SCENARIOS Building Typologies K C I P N E V Ö M F E I R B N G I S E D From soft conversions to renovations, this adaptable framework identifies mandatory and optional design elements that work across all regions, spaces, and hotel clusters (urban, living). The concept is scalable across future Mövenpick development needs, network expansion, and management models, while maintaining a clear and consistent brand identity. New Builds Renovations Conversions Enhancement Flagship Quick Wins 24 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES BUILDING SCENARIOS Spaces Outdoor Spaces Relax - Dine - Entertain - Meet Meeting & Events Connect - Work - Celebrate Guestrooms Sleep - Work - Reconnect K C I P N E V Ö M F E I R B N G I S E D Our spaces are designed as flexible, ever-evolving environments that invite guests to gather, pause, and reconnect—together. They support a wide range of moods and moments, where conversations flow naturally, collaboration sparks easily, and there’s always something interesting to discover. ​ ​ Shared areas balance openness with comfort, welcoming colleagues, friends, and families in the same place. Subtle cues and thoughtful planning create an easy sense of ease—so business guests can focus, meet, or unwind without friction, while families can relax and enjoy time together. This allows for joyful, unforced interactions that turn simple encounters into meaningful experiences.​ Reconnection Joy Generosity Market-Inspired Lobby Meet - Shop - Discover Food, Beverage and Entertainment Dine - Share - Celebrate Leisure & Well-being Entertain - Reconnect - Relax 25 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D BUILDING SCENARIOS Key Touchpoints Market Inspired Lobby Reception Lounge Café Bar Experiential & Chocolate Zone Retail Collab Corner Stay Guestrooms Club Lounge Leisure & Well-being Fitness Spa Outdoor activities Arrival Food & Beverage Venues All Day Dining Signature Restaurant Outdoor Venues Meeting & Events Events Foyer Meeting & Function Rooms Ballroom Outdoor Venues Heart of House Heartist Hub & Café Heartists & Facilities Working Spaces 26 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D BUILDING SCENARIOS Key Concept Areas The hotel public spaces are designed to be fluid and transformative, shifting effortlessly from relaxed lounges to vibrant social hubs. Open layouts and multifunctional areas create a dynamic atmosphere that evolves with guests’ needs throughout the day. Market Inspired Lobby 01 02 03 04 05 06 07 Entrance Reception Lounge Café Bar Experiential Zone - Chocolate Hour Workshops Retail - F&B Grab & Go / Chocolate / Selection of retail range Collab Corner Food, Beverage and Entertainment 01 02 03 Signature Restaurant The Gathering Table (ADD) Outdoor Venues Meeting & Events 01 02 03 04 Events Foyer The Commons Ballroom Outdoor Venues Meeting & Events 03 Back of House 04 02 01 02 03 Food, Beverage and Entertainment 07 07 06 04 05 06 06 06 02 03 Back of House 03 01 Food, Beverage and Entertainment 01 04 06 02 03 Back of House Market Inspired Lobby 27 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D Hotel Zones Arrival Market Inspired Lobby Food & Beverage Venues Guestrooms Meeting & Events Leisure & Well-being Heart of House 29 31 39 44 47 53 58 28 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Arrival K C I P N E V Ö M F E I R B N G I S E D 29 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Arrival K C I P N E V Ö M F E I R B N G I S E D The Arrival sets the tone for the lobby experience, incorporating elements that create a sense of being cared for from the very first moment of arrival. Here, arrivals are shared moments: friends gathering, children pausing to rest before adventure resumes. Generous gestures — a stand of umbrellas to borrow, seats thoughtfully placed for weary travellers — turn waiting into a gentle, graceful landing. 30 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Market Inspired Lobby K C I P N E V Ö M F E I R B N G I S E D 31 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES Market Inspired Lobby MEETING & EVENTS COLLAB CORNER K C I P N E V Ö M F E I R B N G I S E D Reception Lounge Café Bar Experiential & Chocolate Zone Retail Collab Corner The Market-Inspired Lobby is the social heart of the hotel, capturing the energy and variety of a local market rather than serving as a simple transition space. Open and inviting, it blends cosy lounge seating, communal tables, and flexible café-style layouts. Experiential zones and curated retail pockets add moments of discovery—scalable from a mobile stand to a fully activated market setting—while a Collab corner supports focused interactions. Anchored by a central Café Bar, the lobby becomes a welcoming, multifunctional space to gather, relax, work, shop, and dine. 32 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES F&B VENUE All Day Dining COLLAB CORNER LOUNGE Reconnection Rituals LOUNGE CAFÉ BAR EXPERIENTIAL ZONE Chocolate Hour Workshops RETAIL LOUNGE Entrance F&B VENUE Signature Restaurant RETAIL LIFT LOBBY RECEPTION K C I P N E V Ö M K O O B Y A L P HOTEL ZONES Market Inspired Lobby Reception Lounge Café Bar Experiential & Chocolate Zone Retail Collab Corner The reception area in the hotel lobby is designed as an inviting and inclusive welcome point. The reception desk features different counter heights, including lowered sections with integrated seating, ensuring accessibility and comfort for every guest as well as Heartists. From reception, guests enjoy an open view across the lobby, with the Experiential Zone, nearby lounge seating, and the option of small retail elements for impulse or last-minute purchases. Throughout the space, tactile artworks add a sensory layer to the experience. 33 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M K O O B Y A L P HOTEL ZONES Market Inspired Lobby Reception Lounge Café Bar Experiential & Chocolate Zone Retail Collab Corner Thoughtfully arranged clusters of low-level, comfortable seating surround coffee tables, fostering reconnection among co- travelers and families through analogue activities that encourage conversation and bonding. Playful furniture keeps guests of all ages engaged. The lounge offers distinct zones for waiting, unwinding, or enjoying light entertainment, complemented by service from the Café Bar with convenient digital F&B ordering. 34 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M K O O B Y A L P HOTEL ZONES Market Inspired Lobby Reception Lounge Café Bar Experiential & Chocolate Zone Retail Collab Corner The café bar offers informal countertop dining for quick bites and casual conversations, serving breakfast in the morning and apéritif options in the evening. Adjacent to the café, an experiential zone serves as a workshop space, visible from the entrance, reception, and lounge. The area is supported by modular, flexible units that can easily shift from workshop counters to product or food displays. It features eye-catching staging and evolving activations throughout the day and season, including Chocolate Hour and pop-up culinary workshops. When not hosting events, the space complements the café bar with offerings such as morning pastries or evening wines and craft beers, creating a dynamic, flexible hub for socializing, tasting, and gathering. 35 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M K O O B Y A L P HOTEL ZONES Market Inspired Lobby Reception Lounge Café Bar Experiential & Chocolate Zone Retail Collab Corner A curated lobby retail space featuring premium chocolate, gourmet grab-and-go food, and select lifestyle items. Refrigerated and heated display cases showcase freshly prepared meals, while merchandising units present thoughtfully curated products designed to delight, encourage connection, and create memorable moments—on property, at home, or as gifts. 36 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M K O O B Y A L P HOTEL ZONES Market Inspired Lobby Reception Lounge Café Bar Experiential & Chocolate Zone Retail Collab Corner A calm, task-focused area within the lobby offers a quiet retreat from distractions while remaining connected to the primary circulation. It features a mix of lounge seating, communal tables, and, for smaller groups, cocoons and booth-style spaces at varying heights suitable for both work and more intentional dining. Flexible seating encourages spontaneous interactions, creating a versatile and inviting setting for both collaboration and concentration. 37 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Market Inspired Lobby Concepts and experiences designed to accommodate different levels of investment Below are examples of potential interventions across different levels of investment. These are intended as inspiration rather than prescriptive solutions, allowing flexibility to respond to the specific context and character of the building. Level 1 - ENHANCEMENT A retail opportunity focusing on F&B in the lobby with adjacent seating area, offering specialty food items and beverages - creating a pleasant space throughout the day. Level 2 - RENOVATION Permanent area with several distinct stations (barista counter, retail corner, treats display) plus a staffed gift station offering personalized wrapping services. The ideal opportunity for rejuvenating underused areas of the lobby and optimize space. Level 3 - NEW BUILD Entire lobby designed as immersive marketplace with multiple specialized zones, communal seating used for check-in, rotating partnerships creating a dynamic heart of the hotel. K C I P N E V Ö M K O O B Y A L P 38 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Food & Beverage Venues K C I P N E V Ö M F E I R B N G I S E D 39 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Food & Beverage Venues K C I P N E V Ö M F E I R B N G I S E D Food, Beverage and Entertainment 01 02 03 Signature Restaurant The Gathering Table (ADD) Outdoor Venues 40 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES 03 02 Food, Beverage and Entertainment 04 0 4 01 Food, Beverage and Entertainment HOTEL ZONES Food & Beverage Venues All Day Dining Signature Restaurant Outdoor Venues K C I P N E V Ö M F E I R B N G I S E D The Gathering Table The All-Day Dining restaurant is a joyful, welcoming gathering place designed around generosity, variety, and shared moments. Conceived as an open, social environment rather than a formal dining room, it encourages guests to linger and return throughout the day, offering an international culinary experience that feels familiar yet engaging. Distinct seating zones support café-style dining, intimate booths, family tables, and solo guests, with a flexible mix of movable and fixed seating. Daylight and adaptable layered lighting carry the space from morning to evening, while lowered, accessible buffets and open kitchens creates a sense of theatre and visual interest. 41 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Food & Beverage Venues All Day Dining Signature Restaurant Outdoor Venues K C I P N E V Ö M F E I R B N G I S E D The Signature Restaurant responds to local market demand, with concepts that vary by location while remaining approachable, lively, and rooted in convivial dining. The design creates a social atmosphere that invites guests to linger and share. Spaces balance energy and intimacy through a clear spatial hierarchy—mixing communal tables with booths and semi-private rooms, using subtle partitions to define zones without blocking sightlines, and layered lighting to create warmth, focus, and character. The result is a flexible, human-centered experience that is unmistakably Mövenpick. 42 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Food & Beverage Venues All Day Dining Signature Restaurant Outdoor Venues K C I P N E V Ö M F E I R B N G I S E D Outdoor venues should feel effortless, playful, and premium, blending thoughtful design with nature to create relaxed, sociable spaces. Flexible furniture groupings, varied heights and textures, define lounging, dining, and family-friendly zones while preserving comfort and ease. The use of durable materials, integrated playful elements, layered lighting, and subtle landscaping create an elevated outdoor experience. 43 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Guestrooms K C I P N E V Ö M F E I R B N G I S E D 44 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES K C I P N E V Ö M F E I R B N G I S E D HOTEL ZONES Guestrooms Guestrooms Club Lounge The guestrooms are designed to feel intentional and harmonious, with clearly defined zones that support different mental modes—from focused activity to relaxed unwinding. Soft partitions create gentle separation, reinforcing each mindset while enveloping guests in a cocoon-like atmosphere. Spaces are organized around key moments supported by adaptable furniture such as loose chairs, poufs, and multifunctional side tables that encourage shared use and communal activities like boardgames. Furniture carries the brand’s story of warmth and connection, allowing the architectural shell to remain a quiet backdrop. Designed for both function and delight, the rooms include a practical but joyful entrance mirror, a family-friendly bathroom bench, and a distinctive joinery mini-bar. Subtle F&B cues and thoughtful details bring the brand’s “Joy” pillar to life through small, memorable moments. 45 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Club Lounge Guestrooms Club Lounge K C I P N E V Ö M F E I R B N G I S E D The club lounge offers an elevated, relaxed environment where guests can unwind, socialize, or work in comfort. With a blend of stylish seating, curated refreshments, and thoughtful amenities, it provides a sense of exclusivity while remaining welcoming. Natural light, ambient lighting, and versatile spaces create a calm yet vibrant atmosphere, perfect for informal meetings, quiet reflection, or enjoying a drink with friends. The lounge is designed to balance privacy and connectivity, making it a hub for both relaxation and subtle networking. 46 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Meeting & Events K C I P N E V Ö M F E I R B N G I S E D 47 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Meeting & Events K C I P N E V Ö M F E I R B N G I S E D Meeting & Events 01 02 03 04 Events Foyer The Commons Ballroom Outdoor Venues Meeting & Events 03 04 04 04 02 01 48 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Meeting & Events Events Foyer Meeting & Function Rooms Ballroom Outdoor Venues K C I P N E V Ö M F E I R B N G I S E D The events foyer offers a warm welcome. Built-in wall seating encourages an easy flow through the space, providing comfortable spots to pause without interrupting movement. Casual clusters of chairs and small tables invite quick conversations and spontaneous meet-ups. Decorative elements introduce gentle colour and warmth, adding a simple, thoughtful touch that makes the arrival experience feel genuinely inviting. 49 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Meeting & Events Events Foyer Meeting & Function Rooms Ballroom Outdoor Venues K C I P N E V Ö M F E I R B N G I S E D The Meeting Rooms are playful, flexible spaces designed for quick brainstorms, focused meetings, and social gatherings. Bringing personality into business settings, they can also transform into private dining rooms or venues for social events such as birthday celebrations. A mix of loungy seating, stools, and cozy nooks supports both collaboration and quiet thinking, while whimsical art and subtle residential details create a calm, welcoming atmosphere. Reconfigurable layouts allow the rooms to shift from traditional meetings to kids’ events or moments of play—highlighted by a versatile boardroom table that can even transform into a ping-pong table for fun and reset. Generous daylight, warm materials, and thoughtful lighting keep the spaces practical, energized, and pleasantly uplifting. 50 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Meeting & Events Events Foyer Meeting & Function Rooms Ballroom Outdoor Venues K C I P N E V Ö M F E I R B N G I S E D The Ballroom is envisioned as an elegant, highly adaptable space that can shift easily between formal events, performances, and celebrations. Designers are encouraged to consider a ceiling- mounted focal element—such as a sculptural light or other art installation—to add presence from above while keeping the floor fully open and flexible. Warm materials, clean lines, and adjustable lighting help set the tone for a wide range of gatherings, with discreet technology supporting smooth transitions. The result is a spacious, uplifting room ready to be shaped to any occasion. 51 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Meeting & Events Events Foyer Meeting & Function Rooms Ballroom Outdoor Venues K C I P N E V Ö M F E I R B N G I S E D The outdoor space adjacent to the meeting and event indoor areas serves as a versatile extension, supporting and enhancing indoor functions. It is designed to be multifunctional and adaptable, capable of hosting a variety of events and gatherings. The space accommodates movable counters and serving stations, allowing flexible setups for catering, refreshments, or interactive experiences. 52 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Leisure & Well-being K C I P N E V Ö M F E I R B N G I S E D 53 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES WELL - BEING Leisure & Well-being Philosophy K C I P N E V Ö M F E I R B N G I S E D Wellbeing at Mövenpick is rooted in positive energy, presence, and reconnection—creating experiences that encourage guests to be truly together. Beyond fitness and spa, Mövenpick brings this to life through programming that replaces digital distraction with shared, authentic moments: cooking classes, analogue games, chocolate workshops, outdoor play, and multi-generational activities for all ages. This philosophy goes beyond entertainment; it’s about unhurried routines, feel-good rituals, and simple choices that help guests reconnect with what matters most.​ 54 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Leisure & Well-being Fitness Spa Outdoor activities K C I P N E V Ö M F E I R B N G I S E D A welcoming, flexible fitness space designed for focused training while remaining inclusive for all guests. The open, airy layout features a line-up of cardio and strength equipment for dedicated workouts, alongside adaptable zones for yoga, stretching, and functional training. Clear sightlines and an intuitive plan make the space easy to use, while natural light and tactile, honest materials create a calm yet uplifting atmosphere. A thoughtful selection of sports equipment supports a broader range of users and abilities. Thoughtful acoustic and zoning strategies ensure high energy and concentrated training can comfortably coexist, supporting wellbeing, movement, and enjoyment throughout the day.​ 55 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Leisure & Well-being Fitness Spa Outdoor activities K C I P N E V Ö M F E I R B N G I S E D A serene retreat designed to foster joyful reconnection—to self and to others. The space balances tranquility with warmth, using curved forms, tactile materials, and generous seating to encourage ease and togetherness. Gentle scents, soft lighting, and subtle water features create moments of quiet delight, supporting restoration, wellbeing, and meaningful pause.​ 56 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Leisure & Well-being Fitness Spa Outdoor activities K C I P N E V Ö M F E I R B N G I S E D Outdoor activities add an uplifting dimension to the hotel experience. Looking out onto the city brings a sense of energy, authenticity, and openness. Outdoor play or game areas strengthen the connection, offering fresh air, real horizons, and a playful sense of discovery, blending relaxation with the rhythm of the city. 57 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Heart of House K C I P N E V Ö M F E I R B N G I S E D 58 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Heart of House Heartist Hub & Café Heartists & Facilities Working Spaces K C I P N E V Ö M F E I R B N G I S E D The Heartist Hub & Café is a space for connection, refreshment, and creative pause. Here, Heartists can gather, unwind, and recharge between shifts, surrounded by a warm and inviting atmosphere. Comfortable seating, easy access to refreshments, and thoughtful design encourage informal conversations, quiet moments, or collaborative joy. 59 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES HOTEL ZONES Heart of House Heartist Hub & Café Heartists & Facilities Working Spaces K C I P N E V Ö M F E I R B N G I S E D The Heart of House is more than a functional area—it’s the pulse behind the service. Every corner should support staff with effortless efficiency, guiding them through arrival, preparation, and rest. A clear entrance welcomes them in, large locker spaces and changing rooms, maybe even a quick shower, provide security and order, and a calm break area offers a moment to recharge. Every detail—from layout to finishes—should be intuitive, durable, and uncluttered, creating an environment where Heartists can thrive. 60 BRAND OVERVIEW DESIGN STRATEGY DESIGN IN PRACTICE BUILDING SCENARIOS HOTEL ZONES CASE STUDIES"}, {"code": "1.06", "title": "SPA 概念简报（金巴兰湾巴厘岛）", "en": "Spa Concept Brief – Jimbaran Bali", "cat": "cat_concept", "version": "Brief", "date": "2014", "brand": "Mövenpick 瑞享", "file": "1.06 Spa Concept Brief_Movenpick Jimbaran Bali_20142701.pdf", "path": "C:\\Users\\JOZHOU\\Downloads\\1.06 Spa Concept Brief_Movenpick Jimbaran Bali_20142701.pdf", "pages": 10, "size_mb": 0.33, "desc": "瑞享金巴兰湾巴厘岛度假村 SPA 概念简报： grooming/spa/养生服务、JK7 死海漂浮体验与死海疗愈（盐磨砂、泥裹）等标志性设施，含接待、理疗室等功能配置指引。", "kw": ["SPA", "养生", "金巴兰", "巴厘岛", "JK7", "死海", "漂浮体验", "理疗室", "概念简报"], "reference": false, "refNote": "", "text": "SPA CONCEPT BRIEF Spa Concept Brief Mövenpick Resort & Spa Jimbaran Bay, Bali, Indonesia SPA CONCEPT BRIEF SPA OVERVIEW - The Spa will offer a variety of grooming, spa and other pampering and wellbeing services in private areas, for both males and females. The signature features of the spa will be a JK7 (replicating the Dead Sea floating experience) and traditional Dead Sea treatments such as salt scrubs and mud wraps. The following facilities need to be provided (guide only). Reception – This is the only entrance and access point to the facility - arrival welcome, spa retail, relaxation zone and the spa treatment rooms are all located off the reception area. The reception area is to have two separated entry points, one from the hotel guest room corridor and the other directly from the Lifestyle Village through a Mövenpick Cafe outlet and up internal staircase to reception. A security point to be provided by keycard by Spa staff for the guest return access to the room corridor. A relaxation lounge space should be provided as part of the reception area. Floor plans should provide two separate reception desks facing the guest entry point. These desks could be located further away from the entrance, but facing the entrance, with a circulation space/gap between the two desks, the remaining space (front occupying), within the reception area, to be relaxed seating. Suggest a soothing water wall feature be included as the guests enter the spa treatment facility. The reception is also an area where there will be a display of retail spa products. In addition to the sales counter, tester bars are located in this area to offer the guest an opportunity to play and have fun with the products. A designated member of the reception team will be available to assist the guests and promote the products. The retail space would benefit from being open plan, please try to keep this space fully viewable and inviting, to capture guest interest and foot fall. Spa Beauty Zone – There will be a beauty zone offering hairdressing services, men's and ladies salon and express services located off the lobby area. Current salon design does not indicate hair wash basins, suggest two hair styling stations and two wash basins – to cater for all guests (male, female and children), and two multi-functional manicure/pedicure stations/thrones. The treatments to be considered are as follows: • Hand and foot therapies. • Male Grooming services – (manicure, pedicure, facials, shaving). • Female beauty services – (manicure, pedicure, facials, nails, threading, waxing). Express Zone - This section of the spa is to be designed for multiple 'in chair' treatments. Spa Treatment Rooms - This is where the main spa therapies take place and where the spa treatment rooms are. The spa area must be designed to ensure complete peace and tranquility (no external noise or visual pollution). A minimum of 9 treatment rooms is required; 1 double suite type room with private whirlpool, 2 double rooms, each with its own change/waiting room (separate whirlpool not essential in all), 5 single treatment rooms without ensuite and a specialized JK7 treatment room (refer signature treatments page 9). With the single rooms and the JK7 tank treatment the spa needs to include common shower/steam, and toilets within the change area. Change areas must have lockers that are fitted with a digilock system for the guest to use with ease and efficiency. SPA CONCEPT BRIEF Room Mix Matrix - recommended Double Suite w/ensuite Double Room w/ensuite Single Room without ensuite JK7 Sensator 1 2 5 Yes x 1 Total Room Count 9 Change room & other Common Facilities – This section of the spa includes a separated male and female change room, each with private shower/toilet. Then Common facilities off the JK7 flotation unit consisting of a separate set of shower and steam rooms for use with the JK7 and for other various treatments in those single rooms without ensuite. Staff Support Area – This section of the spa covers a separate staff entry from the guest corridor, a small office for the spa manager, a waiting area for the therapists, a small storeroom (can be part of the waiting area), and a small unisex toilet for staff. CONCEPT AND STRATEGY The following concept design document ensures bringing to life the vision and essence of the Spa and ensuring a seamless flow from the beginning to the end of the project. LOOK AND FEEL OVERVIEW Mövenpick recommends that the interior design direction reflects the Middle Eastern influences of the Dead Sea and be aligned with the overall spa concept and its values. Influences from the Middle East should be reflected in the treatment rooms, reception/relaxation spaces, and changing areas in a modern format. (for examples refer Spa in Chedi Muscat, Four Seasons Doha) Respect for the Balinese culture and local customs. Balance of male and female space is maintained through the offering of a female nail salon and a male grooming facility which each express design philosophy’s inherent in feminine and masculine qualities. Simplicity, Tranquility and Neutrality is expressed via a warm, neutral color palet and uncomplicated natural interior finishes. Welcoming and Communal space offered off the express zone area to encourage a friendly atmosphere where different types of guests can intermingle. SPA CONCEPT BRIEF OVERVIEW SPA MENU AND SERVICES Introduction One of the single most important entities that a spa offers is the treatment menu that acts as the first invitation to potential spa users. At this stage of the spa concept development for Mövenpick Resort & Spa Jimbaran Bay Bali, an outline of the menu philosophy is provided to show the strategy and direction that the menu concept will take. Mövenpick Service Values Mövenpick promises to deliver ‘Swiss Hospitality’ and is a byword for enjoyable luxury. Key values of the Mövenpick brand include: Quality achieve higher levels of excellence. We are passionate about what we do. We continually strive to improve in order to ‐ ‐ ‐ Reliability We are accountable for our actions and deliver on our promises. We are devoted to nurturing genuine relationships with one another. We embrace our Care communities, the environment, our partners and guests. Personal Touch acting on our intuition and daring to be ourselves. Just like our guests, we are unique individuals. We make a difference by ‐ Mövenpick is committed to the brand values. “Our values are the fibres that weave us together as a company. We embrace these values to shape our decisions and actions.” When combining this with the values resonant within the owner company’s, Mövenpick then is able to create spa “service values” that are used to bind the spa philosophy and create the framework for delivery. Menu Service Value Statements Respect Value Balance Simplicity Tranquility Neutrality Welcoming Communal ‐ ‐ ‐ ‐ ‐ ‐ ‐ SPA CONCEPT BRIEF Consumer Groups and Market Trends Hotel Guests External Guests Being closely linked to the lifestyle village, the hotel spa will receive numerous external spa guests who will require a place to rest and be pampered. The spa and hotel should be marketed in key areas in the general locality as well as in the car parking of the Lifestyle Village. Conference Business With a significant focus on business meetings and conference events, the property will attract a large number of business people to the property. Lunch breaks and post conferences are a perfect time for these busy executives to indulge in an express reflexology session or back, neck and shoulder massage to bring their energy levels back into balance. Conference guests will require express treatments (can be undertaken outside the main spa also), extended opening hours and the opportunity to make group reservations. Banqueting, rooms and spa should look to bundle express spa services into conference packages. International Trends Spa consumers are beginning to move away from trendy and ‘gimmicky’ spa therapies that do not provide immediate results and seek treatments that are based on empirical evidence and proven data. Similarly, as the industry becomes more widely understood, an educated and ‘savvy’ consumer is purchasing traditional treatments and services that are safe, reliable and offer tangible results. Three key trends are coming to the forefront that require clear recognition when developing a menu of services: SPA CONCEPT BRIEF Concept Values It is necessary to identify conceptual values that act as a guide for the spa in terms of design, orientation, treatment services, and guest engagement. Mövenpick recommends embracing the following values in order to create a fluid spa concept that seamlessly blends with the Mövenpick philosophy and property’s interior design direction. Respect Acknowledgement of sense-of-place through using indigenous design touches Value Uncomplicated and transparent pricing and value for money Balance Masculine, feminine, equilibrium, asian ingredients, asian techniques Simplicity Uncomplicated, straightforward, essential, comprehensible Tranquility Relaxing, peaceful, serene, restorative Neutrality Neutral tones, warm, natural Welcoming Inviting, understated, unintimidating, pleasant Communal Friendly, relaxed, open, social Mövenpick Resort & Spa Jimbaran Bay, Bali requires a spa that offers guests calm, ‘balance’ and embraces local heritage. Mövenpick believes this should be reflected through simple, neutral, welcoming and warm design. MENU & SERVICE OPPORTUNITIES Treatment Menu Mix The spa treatment menu will showcase signature Dead Sea treatments appealing to both local and international travelers, as well as natural remedies adapted to reflect a balance between ancient rituals and modern lifestyles. Massage treatments are also selected from Balinese therapies and the wider SE Asia region. The menu selection will need to incorporate services, that neither intimidate beginners, nor dulls regular spa goers. This can be achieved through a precise selection and variety of desirable treatments coupled with transparent pricing. ‐ Spa Menu Overview To develop a profitable spa the facility design needs to pay great attention to the clientele. Mövenpick recommends that the following components be highlighted within the spa menu: Treatment Modalities SPA CONCEPT BRIEF Menu Structure Mövenpick, Spa The menu will consist of a core set of signature services from the Dead Sea drawn from the expertise of the Mövenpick Resorts in Jordan. These Dead Sea treatments can be customized to create different packages that combined with the JK7 feature can mimic the floating experience actually experienced in the Dead Sea. The spa will also offer a breadth of choice, clearly acknowledging in its design that men and women have both common as well as individual needs. This will be reflective in specific male and female grooming services and treatments. Lastly the menu celebrates massage modalities of Bali and SE Asia giving a sense of place for the spa, and through the development of signature rituals will showcase Bali’s wellness modalities. Duration of Treatments • Massages will be available to guests with 50 / 80 minute timings, and will be reserved on the booking system for 60 / 90 minutes to allow for guest arrival, consultation and retail recommendation. • The express zone will offer treatments in multiples: Each treatment would be sold in 15 minute blocks (15 / 30 or 45 minutes) allowing for a greater degree of flexibility and price point. • Certain peak periods (i.e. during conferences) could allow for a ‘first come first serve’ and spontaneous reservation by guests allowing for easier capture of walk in/walk by traffic. • By using technology such as 'JK7 Senator Plus' (refer option page 9) the staff efficiency and productivity of the treatment room can be increased significantly. With a floatation tank system there can be up to 4 users, treatment times can be varied and these users can start/finish at different times without the need for individual spa staff in attendance (computer program operated). SPA CONCEPT BRIEF CORE TREATMENTS & NUMBER OF SERVICES - INITIAL RECOMMENDATIONS Core Menu of Spa Services • Dead Sea Wraps (two/three product choices) & Dead Sea Scrubs (two / three product choices) • 6 Massages (Signature Dead Sea Treatments, Asian/Balinese Traditions focused on Wellbeing) • 3 Facial Treatments (Classic/Enhanced + Natural Age Reversal) • 2 Manicures (express & classical) • 1 Pedicure (classical) • 4 / 5 Male grooming treatments (Time Sensitive/Energy and Revival) • 5 Express Treatment at 15 / 30 / 45 Minute durations (In Chair) Massage Traditionally massage represents 75% of all treatments delivered within a spa, and a focus to ensure delivery ‘excellence’ will be a mainstay of the Mövenpick Spa philosophy. A prescriptive approach will be adopted in both the classic and express zone, with concentration on exceptional techniques and execution. The guest needs will be evaluated at reservation via consultation focusing on their current physical and emotional state plus their desired result. Clear recommendations are then made to ensure the massage modality suits the requested outcome. Therapists should be trained to ensure a greater level of ‘hand’s on’ physical assessment prior to treatments commencing, adding specificity and variety of technique to tailor the massage to the individual. MASSAGE EXAMPLES: Signature Dead Sea Treatments (80 M in s) Exclusive to the Mövenpick Resort & Spa Jimbaran Bay, Bali, this unique massage combines strong pressures and special techniques with Dead Sea ingredients and Aromatherapy influences for the ultimate soothing and pampering experience. Local Treatments (50 / 80 M in s) This massage is a therapeutic massage from head to toe. The massage combines stretching, stepping, long kneading strokes and pressure applied to various part of the body. For the massage, unique oils are used which are created from warm palm oil with various herbs and spices. SPA CONCEPT BRIEF Herbal Compress with Oriental Stretching (50 / 80 Mins) Stretching, acupressure and hot herbal compresses are combined to provide the utmost in muscular and mental relaxation. Infusing elements of Thai massage such as cobra bends (upper body) and leg manipulation this treatment is an excellent remedy for travelers or those suffering the effects of jet lag. Classical Shiatsu (80 Mins) A Japanese form of massage based on Yin Yang & the five elements theory. Finger pressure is applied to the acupressure points of the body along the meridians. It encourages a deep relaxation, total wellbeing & the flow of ‘Chi’. Detox (50 / 80 Mins) A Detox Massage using lymph massage techniques as well invigorative and stimulating techniques for cellulite. This massage will concentrate only on legs, hip, stomach and upper arm and would be a popular choice for travelers and those seeking physical rejuvenation. Deep Tissue (50 / 80 Mins) In deep tissue massage, a massage therapist uses manual techniques that target specific areas of tension in deep muscle tissues. Specifically, therapists work to release adhesions, which are rigid bands of tissue that can cause pain and chronic tension and restrict motion. Types of strokes that the therapist may use include: kneading; grabbing or rolling the muscles; effleurage or stroking, gliding strokes that use the entire hand surface. BEAUTY TREATMENTS Facials - Quality facials are an integral part of a well formulated spa menu and the spa at Mövenpick Resort Jimbaran Bay, Bali will focus on classical techniques, natural remedies and advanced beauty. This will be reflected through three facials namely: Classical, Anti Ageing and Express. Classical (50 Mins) Facial incorporating cleanse, tone, scrub and mask. This may be adapted to add additional extraction using a facial steamer. Anti Ageing (80 Mins) Following similar steps to the standard facial, this would use natural peeling agents and products containing high levels of vitamin C. Longer in duration this facial experience would also contain a foot acupressure massage. SPA CONCEPT BRIEF Express (25 M in s) Facial cleanse and tone actively performed in chair (express area) appealing to male and female clientele. Dead Sea Scrubs & Wraps (50 Mins) Body therapies are proven to remove the natural build up of dead skin cells that lead to dull and tired looking skin. Body masks/wraps work beneath the surface and have a lasting effect. The spa will offer one of each variety but with varied product choices, and will look to source local and natural ingredients to create signature experiences with a sense of place. Manicure and Pedicure - A nurturing session for the nails, hands and feet which focuses on filing, shaping of the nail, massage of the hand or foot and the application of nail polish. Manicures and Pedicures would be priced competitively and the menu offering would include one express manicure, one deluxe manicure and one 50 minute pedicure. Signature Dead Sea Rituals - Signature rituals will be designed in accordance with the selected professional product company and with the assistance of the award-winning Zara Spa, Jordan. They will be combinations of popular treatments including elements of treatment modalities that do not normally appear on the menu. JK7 Senator Plus Treatments - One of the primary objective for the spa design is to create a point of difference between the Mövenpick Spa and other spa facilities in Jimbaran Bay area. In order to create a 'buzz' and be truly different it is recommended that a JK7 Senator Plus system and skin care product range are featured. This would provide a unique treatment option and as noted earlier result in high productivity and improved staff efficiency as additional benefits. For further information refer - www.jkspawellness.com Engineering Design Guides For further detail of Acoustic requirements, HVAC requirements, Sound System requirements, Lighting requirements, Plumbing and Mechanical requirements, Electrical requirements refer to late  THE PROTOTYPE 25 29 30 33 57 60 75 84 MOVENPICK.COMJULY 2019 F O U N D I N G P H I L O S O P H Y | S E C T I O N A 2 . 0 “We aren’t doing anything extraordinary. We are successful because we are doing normal things in an extraordinary manner.” – Ueli Prager MOVENPICK FOUNDER Mövenpick hotels all have a unique personality and attitude that is rooted in their surroundings. For us, hotels are less about star ratings, and more about creating the right synthesis between comfort and sense of place. To that, we add our Mövenpick pedigree and our Swiss heritage. Our legacy allows us to build on the strength of the Mövenpick name by insisting on high standards and innovation when it comes not only to our guests’ welcome, in-room and de- parture experiences, but also on provid- ing the right public space for enjoyment and interaction. Mövenpick’s vision is we make moments. We recognise that it is about the small things in life, that do- ing ordinary things in an extraordinary way has a big impact on our guests, our owners and our people. The interiors of our hotels should provide an environ- ment where unique experiences and unforgettable memories can be created. These Standard Design & Operational Planning Guidelines were developed to ensure that we create the Mövenpick Hotels & Resorts experience for future properties, right from the outset. A Möv- enpick hotel is more than just a hotel and this manual should be a source of inspiration as much as a practical guide. It is designed to provide sensible mini- mum requirements for building and operating a Mövenpick property, and to communicate these in an understand- able manner and format. Planning con- sultants must use the manual as the first step while preparing for and develop- ing a lasting working relationship with Mövenpick Hotels & Resorts. Thank you in advance for your commitment and enthusiasm as we further develop the brand together, and create hotels where true moments can be made. 1 MOVENPICK.COMJULY 2019 M I S S ured form and in its eventual state of disarray during the course of its use. The width of this zone should also accomodate the human dimension and body positions assumed during the eating process. Etiquette aside, it should be generous enough to allow for the inevitable projection of the elbows. Anthropometrically, the maximum body breadth measurement of the larger person should be considered. Accordingly, the optimal width suggested for this zone, allowing for elbow projection, is about 30 in, or 76.2 cm, and the minimal depths suggested for this zone are 18 and 16 in, or 45.7 and 40.6 cm, respectively. The optimal place setting zone can be viewed as a rectangle, 30 by 18 in, or 76.2 by 45.7 cm, and the minimal zone, 24 by 16 in, or 61 by 40.6 cm. in 27 18 9 30 21 16 5 24 90 72 A B C D E F G H I J cm 68.6 45.7 22.9 76.2 53.3 40.6 12.7 61.0 228.6 182.9 43 COFFEE SETTING MOVENPICK.COMJULY 2019 L O B B Y L O U N G E C O N C E P T | 2 . 1 0 SECTION A E R G O N O M I C S T A N D A R D S COFFEE TABLE SPACE The shared access zone represents the table space opposite the place setting zones necessary to accommodate serving dishes and platter, related silverware, glasses, decorative centerpieces, candelbras, etc. the size of this zone varies greatly and is a function of lifestyle, type of meal, available, nature of serving operation, occasion, and number of people. The optimal depth suggested if relatively formal and frequent dinner parties are involved is 18 in, or 45.7 cm, The minimal depth is about 10 in, or 25.4 cm. 44 COFFEE TABLE SPACE MOVENPICK.COMJULY 2019 L O B B Y L O U N G E C O N C E P T | 2 . 1 0 SECTION A E R G O N O M I C S T A N D A R D S COFFEE & LIVING ROOM TABLE SETTING The drawing shown on the left illustrates a 36-in, or 91.4- cm, diameter round table seating four people and shows the necessary clearances around the perimeter. Four people canot function comfortably around such a small table for anything but the lightest snacks. The individual place-setting zones are extremely restricted and the shared access zone at the center is too small to accommodate much in the way of serving dishes, platters, or decorative elements. A 48-in, or 121.9- cm, clearance between the perimeter of the table and the wall or nearest physical obstruction is the minimal clearance necessary to allow circulation behind a seated person. A distance of 30 to 36 in, or 76.2 to 91.4 cm, between the table perimeter and the wall is the minimal clearance necessary to permit access to and adjustment of the chair. in cm 30 min. 76.2 min. 6 24 15.2 61 18-24 45.7-61.0 12 30.5 48-54 121.9-137.2 36 91.4 30-36 76.2-91.4 114-126 289.6-320.0 84-96 213.4-243.8 48 121.9 A B C D E F G H I J K 45 COFFEE & LIVING ROOM TABLE SETTING MOVENPICK.COMJULY 2019 L O B B Y L O U N G E C O N C E P T | 2 . 1 0 SECTION A E R G O N O M I C S T A N D A R D S COFFEE & LIVING ROOM SEATING The 48-in, or 121.9-cm, diameter table shown on the left, however, can function well as the area of the shared access zone. To allow clearance for the chair and head-on circulation behind the chair, a minimum distance of 48-in, or 121.9cm, must be maintained between the edge of the table and the wall or nearest physical obstruction. A clearance of 26 to 42 in, or 91.4 to 106.7cm, can be provided to allow restricted circulation. This will require a person to sidestep or the seated person to adjust the chair to allow passage. 46 COFFEE & LIVING ROOM SEATING MOVENPICK.COMJULY 2019 L O B B Y L O U N G E C O N C E P T | 2 . 1 0 SECTION A E R G O N O M I C S T A N D A R D S COFFEE& LIVING ROOM SEATING 47 MOVENPICK.COMJULY 2019 L O B B Y L O U N G E C O N C E P T | 2 . 1 0 SECTION A E R G O N O M I C S T A N D A R D S COFFEE & WINE SEATING The proper height of a chandelier or other type of pendant lighting fixture above a dining table should be based on human dimension to ensure that it does not obstruct vision. The drawing above shows the relationship of fixture height above the table surface to a od & Community. positioned as a thoughtfully design approach that can be curated showcase of scalable, modular. food and drink aligned to Mövenpick products. Building blocks / A kit of parts. INTRO OV E RV I E W DES IGN AP PROACH TOUCH-POINTS DESIGN FO C US A P P EN DI X 7 Blurring Boundaries A seamless merging of hotel lobby space driven by the food, beverage and retail experience. Hotel Lobby Arrival Check-in Coffee Bar Relax Socialise Remote working Meet-ups Welcome Shop Eat Drink Work Learn Relax Marketplace Exploring Taste Local food Takeaway Shopping Meet friends Coffee Breakfast / Lunch Bustling hub INTRO OV E RV I E W DESIGN APP ROACH TOUCH-POINTS DESIGN FOC U S A PP E NDI X 8 Heartfelt Moments The 7 experiential touch-points are key to making this concept cohesive and true to the vision. Focus on the experience and curation of the guest journey. Welcome Eat, Drink & Shop Relax Learn The Mövenpick Host: Generous, Creative & Knowledgeable The guest builds their own Wine tasting includes retail Mixture of multi-level seating Experience / Partake personalised experience eg.) Coffee from one ‘stall’, baked goods from another Transitional: eg.) Bakery by day No set lounge area, but pods Learning, doing, engaging - Mezze by night - Smoothie of seating dotted throughout and being Focus on the experience - Bar into Prosecco Bar the space curating the guest journey Chocolate display & retail Dynamic and engaging sight lines Wow factor Safety / Comfort (diligent hygiene protocols) which includes “chocolate hour” / sells recipe books Inspiring retail / “window displays” / Seasonality Local Dishes - takeaway, buy, demonstration, book a class, recipe book, buy oils and sauces etc Mövenpick products alongside local suppliers Chocolate Hour & Demonstrations Transitional: eg.) Chocolate Hour into wine tasting Work Seamless Connected Technology QR codes App delivery to seat INTRO OV E RV I E W DES IGN AP PROACH TOUCH-POINTS DESIGN FO C US A P P EN DI X 9 DESIGN APPROACH 10 Concept/ Diagram The Core Heart / Passion / Focus / Theatre The Core represents the heart of the scheme that intersects the ribbon creating desire lines within the space. The Ribbon Integrated / Explore / Flow The Ribbon is a structural element that flows through the space creating a range of food & drink focused areas. Blurred Boundaries Scalable Modular Transitional Multi-functional INTRO OVERVIEW D E S I G N A P P R OAC H TOUCH-POINTS DESIGN FOC U S A PP E NDI X 11 Experience The design concept is brought to life through engaging and inspiring brand philosophies, service and experience. Flexible Transitional Holistic sustainability Seasonality Local materials Curious Characterful Cultivating connection Wine Ice cream Lifes little pleasures with a healthy attitude Generous Primary Food for good Coffee Local makers, growers and suppliers Dedicated F&B Creative Chocolate Premium Regionally inspired artwork Secondary Jams Tertiary Primary The brand experience pillars Secondary The brand personality and values. Tertiary Elements which are important in delivering a holistic brand experience and may be influenced by the local culture / food & drink. Product Showcasing Mövenpick products is a key part of the concept and the space. Certain products are more central to the experience than others. Primary Mövenpick coffee, wine bar and Ice cream must feature in any iteration of this concept, there should also be a place to showcase chocolate. Secondary Other Mövenpick products and supporting local suppliers. Tertiary Important as part of the brand but not the over-riding focus. INTRO OVERVIEW D E S I G N A P P R OAC H TOUCH-POINTS DESIGN FOC U S A PP E NDI X 12 Day Curious Characterful Generous Creative We enable guests to explore and delight in their relationship with food. We conduct and amplify the rituals & experiences that create memories, break barriers and connect us as humans. INTRO OVERVIEW D E S I G N A P P R OAC H TOUCH-POINTS DESIGN FOC U S A PP E NDI X 13 Night Transitional Welcoming Premium The experience evolves throughout the day, and takes on different guises, but uses the same spaces in a flexible way. INTRO OVERVIEW D E S I G N A P P R OAC H TOUCH-POINTS DESIGN FOC U S A PP E NDI X 14 Scalability The 7 experiential touch-points are scalable to work across varying size and types of lobby space. Mini Small Insertion Medium Takeover / Instant Noodle Major Flagship / Signature The Mini experience omits Work for a better overall experience. Potential Mezzanine / Double Height Space Welcome Shop Eat Drink Work Learn Relax INTRO OVERVIEW D E S I G N A P P R OAC H TOUCH-POINTS DESIGN FOC U S A PP E NDI X 15 Illustrating The Concept The following pages include plans and sketches to illustrate this concept. (These are not based on an existing site and are indictive of the design approach.) The design team selected to implement Mövenpick’s market inspired lobby concept will use this presentation to guide their design but it requires development and interpretation considering materiality, site condtions and localisation demands. INTRO OVERVIEW D E S I G N A P P R OAC H TOUCH-POINTS DESIGN FOC U S A PP E NDI X 16 Concept Essence Concept Essence The ambition is to create a seamless flow between The Ribbon and The Core. The combination of these two elements form the key lobby spaces focused around a premium F&B ‘marketplace’. Shop / Relax The Ribbon The Core Welcome Work & Learn Eat & Drink INTRO OVERVIEW D E S I G N A P P R OAC H TOUCH-POINTS DESIGN FOC U S A PP E NDI X 17 Concept Plan Flagship (Major) The Ribbon is made up of Mövenpick specific products presented as either a retail display or dispensing F&B stall. Even though it is designed to divide the space, The Ribbon is multi-leveled with open transition spaces and retail components allowing for views through into the neighbouring areas. Seating density will adjust as needed, dependent on site specific demands and local legislation. Satellite Lounge Flexible Seating Transition Retail Transition Bar Show Kitchen Transition Lounge Dining Space Retail Multi-Use* Chocolate Display *Multi-Use: Chocolate Hour/ Co-Working/ Dining Ottoman Wash Station Retail Co-Working / Flexible Seating INTRO OVERVIEW D E S I G N A P P R OAC H TOUCH-POINTS DESIGN FOC U S A PP E NDI X 18 CONCEPT TOUCH-POINTS 19 Concept Plan Touch-points Welcome Shop Eat Drink Work Learn Relax INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 20 Views through Retail Welcome Desire This is the starting point of the Mövenpick’s market inspired lobby concept experience, the guests should feel comfortable, relaxed and engaged. A roaming host greets the guest on arrival checking them into the hotel whilst also making them a coffee. The Welcome experience is anchored by the 4 primary Mövenpick products: coffee, chocolate, wine & ice cream. These products are served or displayed as retail items. Mini Hydration Station Safety / Peace of mind (Covid - sanitation). INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 21 Shop Integrated Mövenpick products are curated within the feature “window displays” . Satellite retail units showcase local products that can be rotated according to season, stock or supplier. Mövenpick Product Retail “Window Display” All transactions will use roaming Engaging visual merchandising contactless payment, with no fixed payment point. Mövenpick Ice Cream Mini Satellite / Retail Seasonal / Rotating INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 22 Shop Integrated As part of the Welcome experience the guest will discover the Mövenpick chocolate showcase. This area can be used to host the ‘Chocolate Hour’ and, for larger hotels, adapted to include coffee bar. Retail Mini Multi-Use Chocolate Hour Co-Working INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 23 Eat Nourish & Inspire The Core is designed to elevate the F&B experience. Multi-use counters display food in a premium and enticing manner for breakfast and throughout the day, allowing the guest to either grab-&-go, or relax over their morning coffee, served using crockery and glassware that is “on brand” . Transitional Cafe Space Retail Mövenpick product Medium Multi Use Co-Work / Cafe Seating Flexible Food Display or Retail INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 24 Work Seamless For larger hotels The Ribbon can be extended creating a flexible space that can be used by guests and locals. This includes the ability to sit with your laptop, meet and network over coffee or cocktails. Seamlessly connected. Integrated technology (QR codes / App delivery to seat / free Wi-Fi / charging points). Flexible Whether working on laptop or having a meeting Desire Lines Medium INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 25 Relax Feel at home The guest has a choice of multiple seating types to relax and feel at home in the space. This includes dining height, seating for groups and singles, or low level lounge clusters. Intimate Casual Solo Traveller Dinner for two Relaxed low seating Bar Seating: Drink or Co-Work Medium Dinner Party Group Dining Catch Up Networking coffee or cocktail INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 26 Drink Day to Night Where possible, in order to fully immerse the guest within the premium F&B led lobby space, the core includes a greater emphasis on the display and delivery of food and drink. The Core Major Transitional The Bar INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 27 Eat Nourish & Inspire In the flagship (Major) concept the kitchen is brought to the forefront of the marketplace experience. Chefs and mixologists engage and interact with the guests whilst serving premium food and drink. Explore The Ribbon Major Serving Counter Domestic styling INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 28 Learn Altruistic The same space can be utilised for multiple guest interactions, including food & drink orientated group workshops and demonstrations. Enriching the guest experience by enabling guests to connect to themselves & others through food & drink. Chocolate Hour An icon of Mövenpick Workshops Wine Tasting Coffee of the Week Pop-ups Demonstrations Sharing of knowledge Selection of Free samples Local F&B Inspire & Engage. Mövenpick of Mövenpick retailers & Show skill & experience & local wines or local coffee experiences & knowledge. INTRO OVERVIEW DESIGN APP ROAC H T O U C H - P O I N T S DESIGN FO CU S A PP E NDI X 29 DESIGN FOCUS 30 Material & Colour Style Guide 1 2 Rich and dynamic materials should combine to ensure design boldness whilst conveying comfort and warmth to reflect the brand DNA and style. The primary materials used within the space should have natural and warm characteristics. This can include timber and stone. Accent the primary material palette with contrasting colours and finishes detailing. Primary Material Palette Supporting Material Palette • Premium • Natural • Textured • Contrasting • Rich • Dynamic NOTE: For takeover projects, a sympathetic design approach should be taken incorporating the signature materials as well as working the existing base palette. 5 1 2 3 4 5 6 Textured Pattern through tile application Contrasting Bold feature colours, patterns and textures to offset the warm, natural palette Warm Colour & material Rich & Dynamic Light concrete, contrasting dark wood Premium Brass detailing Natural Warm wood 3 4 6 INTRO OVERVIEW DESIGN APP ROAC H TOUCH-POINTS D E S I G N F O C U S AP P EN DIX 31 FF&E Flexibility Detail Lounge The furniture mixes lounge, dining and co-working styles that can flex between all uses easily across day & night. This helps to make the space feel connected throughout the different offers, making them feel as one. Inspiration is taken from urban landscaping by introducing more solid elements that can be used for both casual seating and display, as well as a strong use of planting throughout. Food can be consumed and ordered throughout the space and the furniture needs to reflect the differing offers. The brand’s sustainable approach should be reflected in the use of natural materials such as solid wood and sustainably produced local furnishings. Special attention should be paid to FF&E recycling and elements should be selected that have a potential second life. INTRO OVERVIEW DESIGN APP ROAC H TOUCH-POINTS D E S I G N F O C U S AP P EN DIX 32 Lighting Lighting Pendants Feature Low & glow The lighting design for Mövenpick consists of 3 distinct approaches. Firstly feature lighting that works to highlight the ribbon and accentuate the flow through the space. Drawing guests to key locations. The second incorporates pendants or clusters focused over the satellite elements in the scheme, to elevate their importance. Finally low level and integrated lighting is used to add drama in the evening and bring a level of comfort in the day. INTRO OVERVIEW DESIGN APP ROAC H TOUCH-POINTS D E S I G N F O C U S AP P EN DIX 33 Lighting Technology Seamlessly Connected Creating a ‘smart’ hotel lobby to enhance the guest interaction and experience. 100% Wi-Fi coverage provided throughout the hotel, including all public areas and exterior spaces. High speed internet and easily accessible charging points for portable devices must be available in all public areas and guestrooms. Media technology to be state of the art, including electronic display and audio systems. Lighting and temperature control must be functional and easy to use. Lighting in public areas and guestrooms should be designed to enhance the atmosphere. INTRO OVERVIEW DESIGN APP ROAC H TOUCH-POINTS D E S I G N F O C U S AP P EN DIX 34 Art Installations Sculpture Food Artists As ‘The Ribbon’ is fluid and installational in its concept, so should the art be. Sculptural and ever-changing. Connected to location, culture, season or event. For example, a podium featuring a local food artist or a display of curated objects that form an art/food/drink installation piece. INTRO OVERVIEW DESIGN APP ROAC H TOUCH-POINTS D E S I G N F O C U S AP P EN DIX 35 Mövenpick Product Range Overview Coffee Wine Delicatessen Dairy Spreads Bean, filter, capsule, pad & instant coffee. Chocolate Ice Cream Mövenpick Swiss chocolate Fruit spreads Hazelnut creams *Consult Accor Procurement for availability of products within the destination INTRO OVERVIEW DESIGN APP ROAC H TOUCH-POINTS D E S I G N F O C U S AP P EN DIX 36 Compliance Requirements Each design project has to be compliant with: • Local Requirements Risk Prevention • • Sustainable Development/Green Globe Criteria “Responsible Luxury” & Indigenous Design • Energy, water and waste consumption and costs recommendations • Equality & accessibility: The hotel must meet all local disability requirements and any brand specific requirements • Accor Fire Safety Policy • Acoustic Comfort • Building Technical Services • Brand Identity Trademarks and Logos • Colleague and Guest Policy • Up to date hygiene, maintenance, safety regulation. INTRO OVERVIEW DESIGN APP ROAC H TOUCH-POINTS D E S I G N F O C U S AP P EN DIX 37 Eco-Design Method Eco-design integrates environmental protection criteria into the design process, from start to finish. This method must be the basis of all Mövenpick design projects and applies to all areas and products. The idea is to minimise negative impact on the environment whilst creating the best product and/or space. For example, it means favouring mobile furniture to carpentry, materials and items that are easier to reuse and recycle, or always favouring environmental-friendly, local, materials. • Eco Design Method Download documents here INTRO OVERVIEW DESIGN APP ROAC H TOUCH-POINTS D E S I G N F O C U S AP P EN DIX 38 APPENDIX 39 Linked Documents The fo  1 SUMMARY SMART ROOM 31. Overview 32. Product List GREET 33. Overview 34. Design Elements IBIS BUDGET 36. Overview 37. Design Elements JO&JOE 39. Overview 40. Design Elements IBIS 42. Overview 43. Design Elements IBIS STYLES 45. Overview 46. Design Elements 03. Executive Summary 05. Objective of the Guidelines 01. SMART ROOM – DESIGNED FOR ALL 05. What is a Smart Room? 07. How do we create a Smart Room 08. Smart Room Benefits 09. Inclusive Design 02. SMART ROOM KEY FEATURES 11. Bedroom/Lounge 12. Bathroom 13. Technology 14. Sensory 15. Master Product List 03. CASE STUDY: PILOT PROJECT 19. Overview 20. Design Approach 22. Floorplans 04. ECO APPROACH 25. Sustainable Excellence 26. Eco-Design Strategy 27. Key Principles Of Eco-Design 28. Ergonomics for Health & Well-being 05. ECONOMY 06. MIDSCALE SMART ROOM 49. Overview 50. Product List 07. PREMIUM SMART ROOM 61. Overview 62. Product List 08. LUXURY SMART ROOM 76. Overview 77. Product List MERCURE MGALLERY 51. Overview 52. Design Elements NOVOTEL 54. Overview 55. Design Elements TRIBE 57. Overview 58. Design Elements 63. Overview 64. Design Elements MÖVENPICK 66. Overview 67. Design Elements SWISSÔTEL 69. Overview 70. Design Elements PULLMAN 72. Overview 73. Design Elements SO/ 78. Overview 79. Design Elements SOFITEL 81. Overview 82. Design Elements RIXOS 84. Overview 85. Design Elements FAIRMONT 87. Overview 88. Design Elements RAFFLES 90. Overview 91. Design Elements ORIENT EXPRESS 93. Overview 94. Design Elements 09. APPENDIX 97. References 98. Manual Disclaimer SMART ROOM - KEY POINTS • A normal special needs room specially transformed through design and technology. • Intuitive and stylish, making accessible rooms desirable to every type of guest. • Flawlessly blends function and design across all Accor categories and brands. • Proven to increase demand for under-utilised rooms, making better use of assets. • Offers larger rooms sizes, also perfect for families. • Adjustable and flexible to accommodate every type of guest. • Same investment cost as a special needs room. • Ensures equal guestroom experience for guests with reduced mobility. • Positions Accor brands and stakeholders as inclusive leaders and innovators in the sector. 3 01 / SMART ROOM - DESIGNED FOR ALL 4 4 01. SMART ROOM – DESIGNED FOR ALL INTUITIVE, STYLISH ACCESSIBLE TO ALL - WELCOME TO SMART ROOM These guidelines have been created to provide guidance, inspiration and understanding of the Smart Room concept. Carefully considered with thought given to the wide range of Accor brands, properties and guests, it is an invaluable tool in understanding the many benefits of a Smart Room, its over-riding philosophy and its design principles. It also highlights the results of our pilot projects, which demonstrate that reservations for these underutilised spaces increase significantly, especially from guests who don’t require accessible facilities but choose a Smart Room because of its increased size, style and smart design features. 5 E M O C L E W “We have envisioned a room for everyone, with design and creativity adhering to accessible standards and practices to the point that they disappear to the benefit of emotional and sensorial experience.” Damien Perrot, Senior VP, Design Solutions, AccorHotels 01. SMART ROOM – DESIGNED FOR ALL WHAT IS A SMART ROOM? A unique concept that turns under utilised accessible rooms into highly desirable spaces for all. A Smart Room turns an standard accessible room into a universal Smart Room that fulfils the needs of every guest, from the wheelchair user who requires accessible doors, the family who are looking for additional space, the visually impaired guest who requires larger print room service menus to the elderly traveller who prefers a walk-in shower. Why should we adopt Smart Room designs? On the basis that many accessible hotels aren’t that accessible, are under used, poorly fitted, and have overly clinical designs, Accor have collaborated with designers and specialists to
