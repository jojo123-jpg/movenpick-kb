ic Design & Our Brands Mandatories These mandatory design considerations are encouraged for all stages of a brands design process. Visual Connection Non-Visual Thermal Orientate seating/bed towards the best view Engage the senses through furniture and upholstery choices. Local artists and local scenes/content within artwork. If thinking of a “green wall” think of a variety of local plants to create a unique, wild local version. Consider the brands signature scent, particularly in Lobby areas. Consider not just the view of water, but also sound, touch taste. Allow outdoor space for wellness and exercise activities. Variation in thermal rooms in Spa settings is crucial—hammam, sauna, tepidarium, ice bath, showers, lounge. Allow for variation in thermal flow in public and private rooms. Include at least one living plant when a balcony or views to nature is not available. Outdoor herb gardens are a great way to bring a taste and tactile experience from nature into the hotel. Consider fireplaces within lobby, restaurants, and outdoor areas. Water Lighting Forms, Patterns, Materials Use the sound or view of water to draw people through a space. Filtered water with drinking vessels made of glass or other environmentally friendly models, such as BRITA® systems. Use of natural daylight in all public and private spaces, where possible. Simple, intuitive lighting controls with dimming systems. Consideration of shower setting variations in guest bathrooms. Variation in lighting in spa and wellness settings is crucial. Choose local materials that welcome patina over time Use patterns and materials with inspiration from local nature. Use Natural anti bacterial materials that promote sanitisation, especially in spa and wellness areas. Outdoor areas should include a water feature for tranquility. Diffused lighting options within guestrooms, especially between bathroom and bed. Colours and materials can be designed to direct occupants to a calming or energising view. 17 Novotel For additional information view: Novotel Design Brief Novotel Concept Guidelines RF STUDIO Social Hub Novotel Concept Guidelines METRO Social Hub Novotel Concept Guidelines HYPOTHESIS Guestroom Novotel Concept Guidelines SUNDUKOVY Meeting Rooms 3. Biophilic Design & Our Brands Lobby Forms, Patterns, Materials Achieve the feeling of nature through natural shades & colours, simple & elegant lines, and the use of raw, noble materials. Water Lighting Introduce a water feature where possible and when not possible utilise water sounds. Pace lighting to ensure variation within the space, encouraging multiple usages. Visual Connection Democratise best views as a shared corner seating area and library rather than private/individual space. Guest Rooms Forms, Patterns, Materials Utilise rounded shapes and forms to bring nature into the room. Non-Visual Thermal Lighting Deploy natural scents, such as cedar wood, in cleaning products. Include air purifiers to clean and measure air quality, giving peace of mind and benefit sleep quality. Achieve lighting variation through the use of ‘smart bulbs’. Blue tone lighting is better for productivity, Yellow for relaxation. 19 Novotel3. Biophilic Design & Our Brands F&B Thermal Lighting Open doorways to bring the outside in, integrating indoor and outdoor environments: Social Hub, Grab & Go, tea station, restaurant. Adjust seating to capitilise on variable daylight conditions, to provide an always changing, inviting light. Forms, Patterns, Materials Communal tables made from native recycled timber. Non-Visual Elixir bar with handcrafted, nature‒inspired beverages. Spa & Wellness Lighting Variable lighting conditions to provide comforting or energizing tones in spa or fitness areas. Visual Connection Oversized artworks of local flora, made from natural materials that welcome patina. Water Themal Water soundscape treatments, making water a full sensory experience. Variation in thermal journey, considering massage rooms, sauna, and hammam—depending on location and clientele. 20 Novotel3. Biophilic Design & Our Brands Outdoor Visual Connection Create an urban haven using curves, greenery, natural materials and moveable furniture. Novotel Novotel Paris Les Halles Novotel Sydney Darling Square Circulation Lighting Adjustable ambient lighting will be used to create various moods and experiences; well lit and bright in the daytime, calm and intimate in the evening. 21 MICE Visual Connection Movable furniture elements can be configured to create different moods. Integrating greenery and swing elements, for example, sets a green and playful mood for the meeting. 3. Biophilic Design & Our Brands Pullman For additional information view: Pullman Design Brief Pullman Brand Presentation Pullman Brand Core Essentials Pullman Guidebook Junction Pullman Power Fitness Concept 3. Biophilic Design & Our Brands Lobby Pullman Visual Connection Bold statement architecture that lead guests’ through the space, inspired by nature and local materials and patterns. Lighting As with successful train station design, provide diffused light with a view to nature, encouraging restoration after a long journey or experience. Forms, Patterns, Materials Bold and iconic furniture that inherits natural, tactile patterns and materials. Non-Visual Diffuse an invigorating scent, based on natural elements and ingredients, to prepare for the day, or restore from a journey. Guest Rooms Forms, Patterns, Materials Orientate furniture towards view of nature, mimicking natural colours within materials to bring the outside view in. Visual Connection When a view to nature is not possible, employ art with a bold, expressive, energetic take on nature. Water Lighting Hot and cold rain showers to provide high intensity hot and cold water therapy for exercise recovery, mood enhancement. Include diffused light between bathroom and bed areas, to aid in circadian sleep rhythms. Pullman Paris 23 3. Biophilic Design & Our Brands F&B Non-Visual Introduce a microherb and permaculture lab, where people can taste, smell and learn. Visual Connection Live stream content of on-site beehive activity, interspersed with nature imagery (moving water, dynamic landscapes). Forms, Patterns, Materials Tribute natural and local materials within restaurant, while being bold and colourful. Lighting Dramatic sensorial lighting, illuminating the contrast between the theatre of cooking and intimate dining. Pullman 24 Spa & Wellness Lighting Using light therapy to incorporate different light temperatures, promoting a range of wellness results. Forms, Patterns, Materials Floor‒to‒ceiling wood panelling, with visible grain which can be experienced when a window is out of view. Visual Connection Taking in sunlight and natural views with Fit Trail, working out outdoors with playful fitness activities. Water Filling Stations designed to suit needs of guests, from cold water to sparkling with freshly cut, infused fruits. 3. Biophilic Design & Our Brands Outdoor Visual Connection Give outside areas iconic elements. Herb gardens, F&B pop ups, beach house, playgrounds, Fit Trail. Pullman MICE Visual Connection Illuminated digital projections, to create the impression of being “somewhere else, outside, under the trees” aiding in creativity and thought. Circulation Visual Connection Immersive digital nature art, that becomes both a focus and an abstract background, especially in circulation areas that lack natural light. Pullman London St Pancreas 25 3. Biophilic Design & Our Brands Mövenpick Mövenpick Design Brief Movenpick Brand Presentation My Movenpick Marketplace Movenpick Green Globe Report 3. Biophilic Design & Our Brands For additional information view: Lobby Mövenpick Visual Connection Feature a local food artist or a display of curated objects that form an art/ food/drink installation piece. Water Non-Visual Natural daylight should be favoured in all spaces. Lighting in public areas should be designed to enhance the atmosphere. In the Mövenpick Marketplace experience, chefs and mixologists serve and interact with the guests, including group workshops and demonstrations. Forms, Patterns, Materials Use of natural contrasts—Light stone with dark wood, with planting throughout. Guest Rooms Visual Connection Views to outside, natural materials and easy to use technology create tranquil, warm and inviting spaces for guests to enjoy their privacy. Water Lighting Non-Visual Particular attention should be paid to the shower experience. Rain showers complemented by hand held fixtures and effective glass partitions to contain water within the shower. Cultural and organic references should be visible in the materials selection. Lighting is key to create a homely ambience, through bedside lighting, overhead recessed lighting, and unobtrusive desk lamps. Lighting and temperature control must be functional and easy to use. Mövenpick Hobart 27 3. Biophilic Design & Our Brands F&B Mövenpick Non-Visual Gastronomy classes with natural, local ingredients, with recipes unique to each location. Visual Connection Regionally inspired artwork using natural materials. Lighting Low level and integrated lighting is used to add drama in the evening and bring a level of comfort in the day. Spa & Wellness Visual Connection Outdoor swimming pool should overlook a breath-taking landscape or skyline. Indoors pools should benefit from natural daylight, reflective surfaces, and bright, and invigorating colours. Non-Visual Thoughtful sound design that enhances the ambiance. Lighting Delicate lighting completes the experience. Forms, Patterns, Materials Natural materials such as wood, stone, metal, and water, are essential to create the desired atmosphere. All materials should be chosen for their calming or invigorating effect. Mövenpick Melbourne On Spencer 28 3. Biophilic Design & Our Brands Outdoor Visual Connection Tranquil outdoor seated spaces with view to planting and water. Mövenpick Jimbaran Bali MICE Visual Connection Marketplace work areas with natural desire lines for walking and use of natural light, timber and planting. Circulation Visual Connection Creating a premium environment through selection of materials, planting and local timber. Mövenpick 29 3. Biophilic Design & Our Brands Swissôtel Swissôtel Design Brief Swissôtel Spa and Wellness Concept Swissôtel Vitality 3. Biophilic Design & Our Brands For additional information view: Lobby Swissôtel Thermal Democratise spaces that have an engaging view to nature. Lighting Glass bottles to be filled with filtered water from either staff or guest operated water fountains. Forms, Patterns, Materials A Gourmet Grocer is also integrated into the area, with high visibility to fruit and produce within the lobby. Non-Visual Understated luxury in use of natural materials, objects and textures, using genuine materials like wood (Swiss Pine) for flooring and furniture, and natural stone for flooring. Guest Rooms Forms, Patterns, Materials Nature should be a part of the visual design with natural materials, light, vegetation, views, water, shapes—all elements that recall the organic world. Themal Non-Visual Lighting An air purification system with silencer wherever the Air Quality Index exceeds 50. Revitalise the body with soothing baths and invigorating showers; nourish the skin with sustainable bathroom amenities enriched with essential oils from Switzerland. Propose different lighting ambiances through dimmable systems, mimicking the suns intensity at different times of the day. 31 3. Biophilic Design & Our Brands F&B Swissôtel Non-Visual Mix of natural objects on tables, both edible and ornamental, as well as use of plants to encourage scent, taste, and visual stimulation. Visual Connection Contemporary art and high quality craftsmanship take up a central space within interior design. Lighting A strong lighting presence thanks to candles, pendants or other lighting elements. Forms, Patterns, Materials Natural feeling restaurant interiors, local timber, stone, full height windows to bring the outdoors in. Spa & Wellness Forms, Patterns, Materials Authentic materials drawing inspiration from the mountains and valleys of Switzerland—Stone, wood, metal, ice, water. Non-Visual Every experience reflects the rhythm of the mountain: Indigenous sounds from the forest and mountains enhance the ambiance; Natural, authentic scents grounded in the rolling Alpine hills. Visual Connection Live plants and flowers should be prominently featured. These should consider the locale and compliment the functionality of the space. Water Stimulating infused water with a range of flavours including Alpine Spring, Natural Performance, A Zest of Strength, Pure Citrus Breath and Mountain Air are on offer for guests. 32 3. Biophilic Design & Our Brands Outdoor Visual Connection Thoughtful windows to the world, that celebrate environment and can be used as a multi-functional space. MICE Forms, Patterns, Materials In between meetings, guests may take off their shoes and walk on unexpected surfaces that may be daring and revitalise the senses. Circulation Lighting An ambience that encourages well-being, as well as feelings of connectedness, inspiration and curiosity. Swissôtel 33 3. Biophilic Design & Our Brands Sofitel Sofitel Design Brief Sofitel Brand Presentation Sofitel On Stage Sofitel Art Curation Guidelines Sofitel Botanical Guidelines 3. Biophilic Design & Our Brands For additional information view: Lobby Visual Connection Celebrate nature in the sense of arrival, by creating a focal point around striking natural feature. Non-Visual Thermal Lighting Essence de Sofitel—white sandalwood with notes of lemon leaf, bergamot and lily of the valley. This assures guests that they have arrived at a Sofitel hotel. Candle ritual at sunset each day, giving guests a visual connection to the primary element of fire. Natural light to be promoted as much as possible. Light to see, to highlight and communicate, and decorative light bringing dramatic lighting installations. Sofitel 35 Guest Rooms Sofitel Le Scribe Paris Opéra Lighting Opening to provide daylight into the bathroom, allowing natural light and plants into shower area. Forms, Patterns, Materials Mix of French style and luxury with natural materials and neutral tones. Non-Visual Aromatherapy scents, calming essential oils and curative bath salts for bedtime rituals. Visual Connection Promote the bed facing a window view when possible. 3. Biophilic Design & Our Brands F&B Forms, Patterns, Materials Natural timber and textiles provide a warm feel in dining rooms. Non-Visual The beauty and scent of crafted flower arrangements. Visual Connection Nature-inspired artworks and wallpaper. Visual Connection Edible flowers provide a modern finishing touch to traditional French cuisine. Sofitel 36 Spa & Wellness Non-Visual Lighting Experience a breath of fresh air, combining nature with yoga to create powerful, muscle toning energy. Minimize down lights in Spa, instead reinforce relaxation through an under lit atmosphere and maximize daylight. Thermal Carefully oriented pool to maximize direct sun light. Visual Connection Exercise equipment to be placed to a view of nature. 3. Biophilic Design & Our Brands Outdoor Visual Connection Outdoor experiences can be enjoyed in Le Jardin such as stargazing from the Open-Air Gallery or enjoying a nightcap within La Serre and staying On Stage until dawn. MICE Lighting Circulation Visual Connection Maximise use of natural light with warm, natural materials. Where possible the gallerie overlooking the ground floor should be flanked with planted columns. Sofitel 37 3. Biophilic Design & Our Brands Fairmont Fairmont Design Brief Fairmont Spa and Wellness Concept Fairmont Art & Styling Guideline Fairmont Brand Presentation Fairmont Gatherings 3. Biophilic Design & Our Brands For additional information view: Lobby Visual Connection Suspended art installation with reference to nature through local stories and craftsmanship. Forms, Patterns, Materials Only natural materials should be used for signage, including stone/marble, metal, glass. Water Filtered water with drinking vessels made of glass or other environmentally friendly models, such as BRITA® systems. Fairmont 39 Guest Rooms Fairmont Quasar Istanbul Water Chroma-therapy showers, which stimulate the senses, improve stress, and create a more positive state of mind. Forms, Patterns, Materials Natural materials should be used over synthetic, promoting local fabricators and indigenous textiles. Lighting Simple and intuitive lighting control with pre-set dimming system. Motorized window coverings in all bedrooms as part of energy control settings. 3. Biophilic Design & Our Brands F&B Fairmont Visual Connection Combine artwork of local flora and fauna, as well as plants and foliage to enhance the sense of place. Lighting Use lighting to transform the space from lively during the day to intimate and moody at night. Forms, Patterns, Materials Create a sense of place using natural local materials and artifacts. Spa & Wellness Forms, Patterns, Materials Natural materials such as timber combine with unique features such as a wall of glass for guests to look out to nature. Visual Connection Awe inspiring design features created through botanicals, signature artwork, water features or grand lighting displays. Water Non-Visual Drench Showers incorporate light, sound and smell to help clean off toxins, wake up the body, relieve stress and improve blood circulation. Lighting, aroma and music should be incorporated helping to create a unique atmospheric experience. 40 3. Biophilic Design & Our Brands Outdoor Visual Connection Fairmont’s Bee Sustainable program features over 20 honey bee apiaries and more than 20 wild pollinator bee hotels at Fairmont locations worldwide. Many hotels are also known for nurturing on-property herb and vegetable gardens, which contribute to pollinator health. Fairmont Vancouver MICE Visual Connection Circulation Visual Connection Using projection mapping technology to immerse guests in a range of natural environments Colonnades allow natural light into circulation spaces, and take shape from natural forms and materials. Fairmont 41 3. Biophilic Design & Our Brands Raff les Raffles Design Brief Raffles Art & Styling Guideline Raffles Spa and Wellness Concept Raffles Celebrations & Ceremonies 3. Biophilic Design & Our Brands For additional information view: Lobby Raffles Visual Connection Introducing nature within art pieces provides both calm among the chaos and a grand sense of arrival. Forms, Patterns, Materials Natural colours and materials are an effective way to help guests’ feel comfortable, create order and restore balance. Water Non-Visual Natural light should be used where possible to capture naturally uplifting energy and enhance guests feelings of well-being. Filtered signature scents and relaxing nature sounds can create a sensory experience, elevating mood and boosting mental health. Guest Rooms Forms, Patterns, Materials Natural materials—wood, cork, cotton, leather and linen—should be elegant and luxurious, while avoiding extreme contrasting colours and geometric patterns. Visual Connection Feng Shui orientated furniture around a focal point of plants, water, or outdoor view of nature. Lighting Non-Visual Three intuitive lighting scenes in bathrooms: Morning, Evening & Night-light—for the perfect balance of intimate and functional. Tea Chest offers a curated selection of teas to stimulate well-being—for example chamomile for better sleep and lemon balm to ease stress. 43 3. Biophilic Design & Our Brands F&B Raffles Thermal Outdoor terrace to function as an extension of the restaurant and entice guests to explore the Raffles Nature Garden experience. Forms, Patterns, Materials Curated playlists including natural sounds and local instrumentation. Non-Visual Lighting Natural nutrition to support mind and body health, encompassing traditional Indian and Chinese healing, as well as probiotics. Scene setting light technology can transform ambience, mood, and heighten senses—giving a sense of occasion, mystery or relaxation. Spa & Wellness Water Outdoor Zen Gardens allow guests’ to wander, meditate, relax, and have outdoor spa treatments. Include water features, calming foliage, and nature sounds. Forms, Patterns, Materials Light projections and luminous textile panels create a harmonious blend of light and texture—to compliment atmospheres in spa. Non-Visual Nature Sound Therapy treatments, which aid sleep, lower stress, promote energy flow and rejuvenation. Visual Connection Feng Shui planting around the pool area can help reduce excessive Yang energy and noise levels. 44 3. Biophilic Design & Our Brands Outdoor Non-Visual Fruit orchard and medicinal herb garden, giving guests the experience of seeing their food go from plant to plate. MICE Visual Connection Use of Plants and botanical artwork, natural, luxurious materials, combining with practical technology and services. Circulation Visual Connection Guest circulation is connected by the use of the classical portico or loggia which allows for a connection to nature. Raffles 45 3. Biophilic Design & Our Brands Orient Express Orient Express Design Brief Orient Express Brand Presentation Orient Express Style Book Orient Express Spa & Wellness 3. Biophilic Design & Our Brands For additional information view: Lobby Orient Express Visual Connection Incorporate large plants, along with material divides, to create intriguing spaces that are a mix of intimate and social. Non-Visual Water Thermal Nature inspired acoustic treatments, birdsong and water soundscapes. Art Deco inspired spring water stations, with signature OE carafe and glassware. Scheduled release of mist, to enhance an unexpected, mysterious feel and a forest atmosphere. 47 Guest Rooms Water Minimise bathroom divide, letting natural light and plants into shower area, resulting in feeling of bathing outdoors. Forms, Patterns, Materials Handcrafted furniture and textiles, locally-sourced and made from natural materials. Visual Connection Large scale framed paintings of local or orient tinged botanicals. Lighting Multiple layers of blinds or shutters for varying degrees of natural light and privacy. 3. Biophilic Design & Our Brands F&B Orient Express Visual Connection Buffer any views without nature with Large and medium sized plants including edible herbs and natives. Forms, Patterns, Materials Natural stonewear, vases, lamp shades, textiles on walls. Thermal Fire from cooking and mixology celebrated by being visible. Lighting Diffuse window light with frosting where views of nature are not available, taking inspiration from old train carriages. Spa & Wellness Forms, Patterns, Materials Natural materials in exercise areas, with some equipment made of wood and leather (Reminiscent of old gyms and boxing halls). Non–Visual Tea ceremonies within wellness areas, containing blends with different regions, cultures and stories. Visual Connection Incorporate an ornamental stone garden design, promoting peaceful, zen like qualities. Water Ever present sight, sound or feel of water within spa areas. 48 3. Biophilic Design & Our Brands Outdoor Visual Connection Intimate, Ottoman inspired private garden areas, with sight or sound to water, encouraging guests’ to be still, wander, or contemplate. MICE Forms, Patterns, Materials Natural, luxurious and comfortable materials, combining with practical technology and services. Circulation Forms, Patterns, Materials The finest natural materials mixed with other luxurious materials to create an intriguing narrow passage, similar to a train. Orient Express 49 3. Biophilic Design & Our Brands A French limited liability company registered at the Trade and Companies registry RCS PARIS B 602 036 444. 82 rue Henri Farman CS 20077 – 92445 Issy les Moulineaux FRANCE Document by Twoism www.twoism.studio 3. Biophilic Design & Our Brands"}, {"code": "2.01", "title": "室内标 eel parts ......................................................................................4 1.3 Aluminium .....................................................................................4 1.4 Connector technology ....................................................................4 1.5 Acrylic sheet (PMMA) ..................................................................4 1.6 Quality films ...................................................................................4 1.7 Surface technology ........................................................................4 1.8 Electrical installation.....................................................................4 1.9 LED module ...................................................................................5 1.10 LED converter ..............................................................................5 1.11 Static proof ...................................................................................5 1.12 Drainage .......................................................................................5 1.13 Defined Mövenpick CI Colours ....................................................5 2. Products ..........................................................................................6 2.1 Illuminated lettering wf | LB1 – horizontal ....................................7 2.2 Illuminated lettering wf | Sirius – horizontal .................................9 2.3 Illuminated lettering wf | LB1 – vertical ......................................11 2.4 Illuminated lettering wf | Sirius – vertical ...................................13 2.5 Pylon ............................................................................................15 2.6 Film lettering ...............................................................................16 2.7 Flat lettering ...............................................................................17 3. Technical data sheets ...................................................................18 4. Functional drawings ....................................................................35 08.11.2016 | scl-shk-srt Page 3 Page 3 1. Material and Process Specifications 08.11.2016 | scl-shk-srt Page 4 1. Material and Process Specifications 1.1 General information Great value is placed on the quality of the lettering elements: in particular on the material, the processing, the illumination, the surface engineering and the general finish. The materials and components are specified at the time of contract award and must be used by the contractor. Implementation and manufacture of the advertising elements are according to the technical project drawings. 1.2 Steel parts Profile/plates: 1.3 Aluminium Sheet metal: Profile: Quality per S235JR as a minimum, cold formed according to EN10025, to be galvanized Minimum quality EN AW 5005 (Al Mg 1); H14, beige, painted, and able to be anodized (the material thicknesses listed in the documents are minimum dimensions) Goods according to EN AW 6063 (Al Mg Si 0.5), hardness F22 1.4 Connector technology All screw and rivet connection elements are to be made with a diameter up to 12 mm in stainless steel material. 1.5 Acrylic sheet (PMMA) PMMA/GS (acrylic sheet) plastic plates are to be properly tempered according to the manufacturer’s recommendations in order to eliminate quality defects with regard to stress cracks and glass breakage. Bonding of PMMA/GS (acrylic sheet) parts must only be done with two-component adhesive. The opaque (white) PMMA/GS acrylic sheet must always be light transmitting. It must not appear white (opal). 1.6 Quality films Only quality films from a recognised manufacturer that provides a minimum warranty of 5 years on weather resistance for exterior use and that has been approved by Mövenpick may be used. 1.7 Surface technology Steel parts: Aluminium profile: Aluminium sheet: Plastic parts: Gloss grade : Hot-dipped galvanised, according to EN 1461, layer thickness of 60 my Anodised E6 EV1, according to EN 17611, 20 my colourless anodised Chromated, according to DIN 50939, powder coated or stove enamelled with a guarantee of 5 years for UV resistant, with a guarantee of 5 years semi-matt, 30–40% based on Gardner 60° 1.8 Electrical installation The electrical installation of the elements must comply with the CE standards for the European market. The provisions of the RoHs and WEEE are to be observed. For the Swiss market, the products are to be installed in accordance with NIN. 08.11.2016 | scl-shk-srt Page 5 1.9 LED module Tridonic P541E-C Classic 12 V red / white LED modules are to be used. The colour temperature is to be white 6500°K (also see http://tridonicsignage.com/com/en/download/data_sheets/P541_en.pdf). wf | Sirius illuminated lettering – illuminated by LED modules cool white (5700°K) 1.10 LED converter The converter must be in accordance with the CE and minimum IP67 and feature automatic excess temperature protection. The operating temperature must range from –20 degrees C to + 50 degrees C. The secondary voltage is 12 volts. 1.11 Static proof The construction / static calculations of the elements are based on the Eurocode 3 norms. The basis for production is EN1090. 1.12 Drainage Due to condensation build-up the illuminated letters LB1 are to be provided with sufficient drainage holes and be sealed against penetration by insects with perforated plugs. 1.13 Defined Mövenpick CI Colours The following CI colours and materials must be used: – Illuminated lettering front – Illuminated lettering frame – Mövenpick film – front mirror – Bird film – front mirror – Film lettering PMMA GS white opal 072, 24% opacity PMMA GS white opaque, 100% opacity quality red Scotchcal 3M SC 3630-83 film quality gold Scotchcal 3M SC 3630-131 film Quality Scotchcal 3635-70, diffuser film Quality Scotchcal 3M SC 100-720 red film Quality Scotchcal 3M SC 100-54 gold film 08.11.2016 | scl-shk-srt Page 6 Page 6 2. Products 08.11.2016 | scl-shk-srt 2.1 Illumin ing for Hotels & Resorts (2016) 08.11.2016 | scl-shk-srt Page 2 Table of Contents 1. Material and Process Specifications .............................................3 1.1 General information .......................................................................4 1.2 Steel parts ......................................................................................4 1.3 Aluminium .....................................................................................4 1.4 Connector technology ....................................................................4 1.5 Acrylic sheet (PMMA) ..................................................................4 1.6 Quality films ...................................................................................4 1.7 Surface technology ........................................................................4 1.8 Electrical installation.....................................................................4 1.9 LED module ...................................................................................5 1.10 LED converter ..............................................................................5 1.11 Static proof ...................................................................................5 1.12 Drainage .......................................................................................5 1.13 Defined Mövenpick CI Colours ....................................................5 2. Products ..........................................................................................6 2.1 Illuminated lettering wf | LB1 – horizontal ....................................7 2.2 Illuminated lettering wf | Sirius – horizontal .................................9 2.3 Illuminated lettering wf | LB1 – vertical ......................................11 2.4 Illuminated lettering wf | Sirius – vertical ...................................13 2.5 Pylon ............................................................................................15 2.6 Film lettering ...............................................................................16 2.7 Flat lettering ...............................................................................17 3. Technical data sheets ...................................................................18 4. Functional drawings ....................................................................35 08.11.2016 | scl-shk-srt Page 3 Page 3 1. Material and Process Specifications 08.11.2016 | scl-shk-srt Page 4 1. Material and Process Specifications 1.1 General information Great value is placed on the quality of the lettering elements: in particular on the material, the processing, the illumination, the surface engineering and the general finish. The materials and components are specified at the time of contract award and must be used by the contractor. Implementation and manufacture of the advertising elements are according to the technical project drawings. 1.2 Steel parts Profile/plates: 1.3 Aluminium Sheet metal: Profile: Quality per S235JR as a minimum, cold formed according to EN10025, to be galvanized Minimum quality EN AW 5005 (Al Mg 1); H14, beige, painted, and able to be anodized (the material thicknesses listed in the documents are minimum dimensions) Goods according to EN AW 6063 (Al Mg Si 0.5), hardness F22 1.4 Connector technology All screw and rivet connection elements are to be made with a diameter up to 12 mm in stainless steel material. 1.5 Acrylic sheet (PMMA) PMMA/GS (acrylic sheet) plastic plates are to be properly tempered according to the manufacturer’s recommendations in order to eliminate quality defects with regard to stress cracks and glass breakage. Bonding of PMMA/GS (acrylic sheet) parts must only be done with two-component adhesive. The opaque (white) PMMA/GS acrylic sheet must always be light transmitting. It must not appear white (opal). 1.6 Quality films Only quality films from a recognised manufacturer that provides a minimum warranty of 5 years on weather resistance for exterior use and that has been approved by Mövenpick may be used. 1.7 Surface technology Steel parts: Aluminium profile: Aluminium sheet: Plastic parts: Gloss grade : Hot-dipped galvanised, according to EN 1461, layer thickness of 60 my Anodised E6 EV1, according to EN 17611, 20 my colourless anodised Chromated, according to DIN 50939, powder coated or stove enamelled with a guarantee of 5 years for UV resistant, with a guarantee of 5 years semi-matt, 30–40% based on Gardner 60° 1.8 Electrical installation The electrical installation of the elements must comply with the CE standards for the European market. The provisions of the RoHs and WEEE are to be observed. For the Swiss market, the products are to be installed in accordance with NIN. 08.11.2016 | scl-shk-srt Page 5 1.9 LED module Tridonic P541E-C Classic 12 V red / white LED modules are to be used. The colour temperature is to be white 6500°K (also see http://tridonicsignage.com/com/en/download/data_sheets/P541_en.pdf). wf | Sirius illuminated lettering – illuminated by LED modules cool white (5700°K) 1.10 LED converter The converter must be in accordance with the CE and minimum IP67 and feature automatic excess temperature protection. The operating temperature must range from –20 degrees C to + 50 degrees C. The secondary voltage is 12 volts. 1.11 Static proof The construction / static calculations of the elements are based on the Eurocode 3 norms. The basis for production is EN1090. 1.12 Drainage Due to condensation build-up the illuminated letters LB1 are to be provided with sufficient drainage holes and be sealed against penetration by insects with perforated plugs. 1.13 Defined Mövenpick CI Colours The following CI colours and materials must be used: – Illuminated lettering front – Illuminated lettering frame – Mövenpick film – front mirror – Bird film – front mirror – Film lettering PMMA GS white opal 072, 24% opacity PMMA GS white opaque, 100% opacity quality red Scotchcal 3M SC 3630-83 film quality gold Scotchcal 3M SC 3630-131 film Quality Scotchcal 3635-70, diffuser film Quality Scotchcal 3M SC 100-720 red film Quality Scotchcal 3M SC 100-54 gold film 08.11.2016 | scl-shk-srt Page 6 Page 6 2. Products 08.11.2016 | scl-shk-srt 2.1 Illuminated lettering wf | LB1 – horizontal – Long distance signage Page 7 Drawings Sizes «M» 500 mm «M» 700 mm «M» 1’000 mm «M» 1’500 mm «M» 2’000 mm O 1871 0.0.5 O 1871 0.0.7 O 1871 0.0.9 O 1871 0.0.11 O 1871 0.0.13 3’465 x 694 mm Total 4’851 x 971 mm Total 6’930 x 1’387 mm Total Total 10’396 x 2’081 mm Total 13’861 x 2’775 mm Mounting system using 2 cable bars slightly separated on the facade or with chassis as free-standing version LED illumination LED Type Colour Voltage P 541E-C CLASSIC / Tridonic Logo in white 6500°K / red lettering 12 V LED Converter In letters, behind letters, or installed externally Letter housing Front Frame Base Implementation PMMA opal white, fi lms translucent red 3M SC 3630-83 / gold 3M SC 3630-131 PMMA opaque white, not illuminated PMMA opaque white Illuminated lettering made of all plastic PMMA GS as per technical drawing and description, deformed, laser cut, milled, drilled, glued, and with interior reinforcement. CI fi lms cut and fully applied. All logo and lettering parts fully pre-assembled, LED illumination installed and wired ready to connect. Illuminated lettering is to be cleaned and given antistatic treatment. Packaging Pre-assembled illuminated lettering protected with PE fi lm bags and packaged in a crate to protect against shock, vibrations, and damage. 08.11.2016 | scl-shk-srt 2.1 Illuminated lettering wf | LB1 – horizontal – white – Long distance signage The usage of the white Mövenpick logo depends on the façade paint (red and brown shades). Page 8 Drawings Sizes «M» 500 mm «M» 700 mm «M» 1’000 mm «M» 1’500 mm «M» 2’000 mm O 1871 0.0.5 O 1871 0.0.7 O 1871 0.0.9 O 1871 0.0.11 O 1871 0.0.13 3’465 x 694 mm Total 4’851 x 971 mm Total 6’930 x 1’387 mm Total Total rs\\JOZHOU\\Downloads\\1.05 Movenpick Construction and Renovation Standards CRS SCR Oct 2023 V1.2 (1).pdf", "pages": 152, "size_mb": 14.58, "desc": "瑞享建造与翻新标准 CRS/SCR V1.2：涵盖概念原则与通用设计指引——品牌要素、功能规划（Programming）与技术性能；定义风格与舒适度、酒店功能与建筑标准的性能与功能准则，适用于所有新建与翻新项目。", "kw": ["建造标准", "翻新标准", "CRS", "SCR", "技术性能", "功能规划", "建筑标准", "品牌要素", "性能准则", "V1.2", "2023"], "reference": false, "refNote": "", "text": "Version 1.2 – October 2023 Construction and Renovation Standards Preamble This Construction and Renovation Standards (CRS) includes the concept principles and general guidelines for designing Mövenpick hotels: Brand Essentials, Programming Requirements and Technical Performance. Its intention is to describe the essential elements of: — Style and comfort specifications — Hotel functions — Building standards The performance and functional criteria defined in this document must be applied to all new construction or renovation projects and all project ownership models (Franchise, Management, Rental or Ownership). They must also be appended to the corresponding contracts. The architectural scheme and technical choices must be implemented in such a way as to achieve the technical performances set out in these Construction and Renovation Standards. The same applies to any subsequent project change, addition or refurbishment. Approval Process All new building or renovation projects should not proceed without a written brief (or “programmeme”) approved by Accor / Mövenpick. The Standards should also be used in conjunction with various documents within the D&TS library for reference. Click on the  icon or on the highlighted text to follow the link to external documents. This document is to be used together with the following documents: Mövenpick Design Brief  Mövenpick Style Book  Mövenpick Brand Guidelines  Mövenpick Brand Presentation  The Mövenpick preferred list of designers are available to investors, specific to each project. This list contains mainly architects, Interior Designers, Lighting Designers, Landscape Designers, and also, on a case-by-case basis include preferred consultants for MEP, Food & Beverage, Kitchen / Laundry, Acoustics, FLS, Audio Visual, Security / Risk, etc. 2 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Preamble In addition to these guidelines, design teams must also fully comply with the most recent local construction, accessibility and safety regulations for each project. In case of differences between local regulations and the Accor Guidelines, the criteria that is more demanding must be applied. This guide is not to be used on its own for design, construction, development or pre-sale contracts. It must be associated with more detailed headlines and technical requirement. In this context, it must be used in conjunction with the more precise construction characteristics and specifications provided by the architects and designers responsible for the project. Furthermore, the investor or owner must engage architects and designers with the appropriate skills for the project and the ability to demonstrate the qualifications and insurance cover required to fulfil their assignments in accordance with local authority regulations and requirements. The investor or owner must obtain and ensure availability of all the documents and permissions required to operate buildings as hotels in accordance with the local authority regulations and requirements (e.g. Planning permission, licensing for public use, fire safety and health certificates, etc.) Lastly, it is essential that a market analysis is conducted for the location in order to determine the hotel programming and to prepare a detailed scheme that includes a full inventory of the hotel premises and floor areas. 3 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 109 115 117 122 Contents Introduction Introduction How to Use This Guide Mövenpick and Accor Mövenpick Brand Values Mövenpick Brand Character The Mövenpi
