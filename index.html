y / Housekeeping Design Kitchen Design General Project Conditions Differentiation Matrix Project Completion And Handover Commissioning Of Engineering Services Critical Path Matrix Sustainable Design Environmental Compliance Guidelines Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 \"We do ordinary things in an extraordinary way.\" Ueli Prager Founder of Mövenpick Introduction | Programming | Technical The Guide | Mövenpick & Accor | Mövenpick Brand Values | Mövenpick Brand Character | The Mövenpick Guest Introduction Mövenpick strives to be best in class within the premium hospitality segment in terms of the guest experience, service and design. These construction standards help to ensure that Mövenpick’s unique brand character and passions are expressed through each hotel’s distinct architecture and interior design. They also reflect the ambition, important commitments and initiatives of the Accor group. When designing a Mövenpick project, Designers should study the brand aesthetic and original DNA, but also the history and culture of the project’s geographic location to create a 360-design narrative and a definite sense of place. Start with clean and contemporary architectural plans. Create interest, by shifting surfaces inward and outward. Highlight features with powerful colours, as well as contrasting finishes. Tie in the cultural influences with strategically positioned organic relief in unexpected, artistic ways such as floor patterns, balustrades, carpets and textiles. Include uniquely designed and sensory finishes. Generate a warm and natural ambiance that subliminally makes people feel good in the space. Create a bold combination of design and function with contemporary furniture in rich and dynamic materials. Accessories with regionally inspired artwork. Create guestrooms that are functional and intuitively friendly to all guests. Work side by side with F&B consultants and the brand to create restaurant identities that will be the heart and soul of the venue’s success. Whenever possible, align efforts with Mövenpick’s Global Sustainability philosophy. Incorporate low impact, non-toxic, sustainably produced or recycled materials and energy efficient products. Most importantly: allow room for creativity but keep it simple. 5 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical The Guide | Mövenpick & Accor | Mövenpick Brand Values | Mövenpick Brand Character | The Mövenpick Guest How to Use This Guide 1. Mövenpick Construction and Renovation Standards (CRS) constitute a common base for all of the hotels in our network. This guide may be completed to match each market’s specificities 2. The CRS must be used as a basis for all new projects: takeover, renovation or new construction 3. They must also be used as a reference for the follow-up and continuous improvement of client satisfaction 4. In order to provide our guests: — High quality and comfort — Highest service standards — Demanding safety standards — Sustainable responsibility — Optimal reliability and flexibility 5. Hotels and resorts are both addressed within the guide, as each takes own inspiration and distinctive interpretation of its vision 6. While all essentials are outlined in this document, they should be used in conjunction with the project-specific Design Brief document to ensure each project has its own inspiration and distinctive connections to its location 7. Click on the icon  or on the highlighted text to follow the link to external documents which provide more in depth details on specific topics 6 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical The Guide | Mövenpick & Accor | Mövenpick Brand Values | Mövenpick Brand Character | The Mövenpick Guest CLASSIC COLLECTIONS LIFESTYLE RESORTS REGIONAL Y R U X U L A R T L U Y R U X U L I M U M E R P E L A C S D M I Y M O N O C E 7 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical The Guide | Mövenpick & Accor | Mövenpick Brand Values | Mövenpick Brand Character | The Mövenpick Guest Mövenpick Brand Values Respect Generosity Originality Excellence Mövenpick adopts a respectful attitude towards guests, employees, local communities and the environment Mövenpick loves to see its guests happy and satisfied, and makes sure they get everything they need even before they know they need it Mövenpick constantly invents new ways to surprise guests, from a creative twist on a Swiss favourite dish to a considerate personal gesture Mövenpick maintains high-quality hospitality standards at every level with exceptional F&B and welcoming service as well as a leading sustainability position 8 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical The Guide | Mövenpick & Accor | Mövenpick Brand Values | Mövenpick Brand Character | The Mövenpick Guest Mövenpick Brand Character Inventive Genuine Mövenpick's originality lies in it's creative, resourceful and entrepreneurial spirit, constantly enhancing the guest journey with delightful new experiences Mövenpick has always remained true to itself and deeply caring of people. The brand embodies a unique thoughtfulness expressed through small gestures 9 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical The Guide | Mövenpick & Accor | Mövenpick Brand Values | Mövenpick Brand Character | The Mövenpick Guest The Mövenpick Guest 22% Female 78% Male 3% 18 – 24 9% 60+ 9% 54 – 60 13% 24 – 30 51% Leisure 49% Business 13% 48 – 54 19% 30 – 36 45% Europe 16% 42 – 48 18% 36 – 42 29% Middle East 13% Asia Orientation Business or Leisure Age Country of Origin 1% Oceania 4% Africa 8% Americas 78% Male 22% Female 49% Business 51% Leisure 3% 18 – 24 13% 24 – 30 19% 30 – 36 18% 36 – 42 16% 42 – 48 13% 48 – 54 9% 54 – 60 9% 60+ 29% Middle East 13% Asia 8% Americas 4% Africa 1% Oceania 45% Europe 10 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Programming Standards 11 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Introduction This section outlines programming requirements and overall design principles that form a Mövenpick, describing the organisation and key features for the hotel premises. The design approach should be warm, contemporary – but not trendy - providing a modern, timeless feel and a friendly atmosphere. Not minimalist. Local content or traditions should be considered in the design. Clean, contemporary lines, powerful colours with contrasting finishes. Surfaces shifting inwards and outwards. Unexpected artistic touches in floor patterns, balustrades, carpets, textiles and decorative lighting. Regionally inspired artwork. Classic and contemporary furniture, using rich and dynamic materials. Mövenpick hotels offer a genuine, human and warm experience – a natural ambiance that makes people feel content and relaxed. Mövenpick properties should feature the following: — Rich and dynamic materials should combine to ensure design boldness whilst conveying comfort and warmth to reflect the brand DNA and style — Allow for the interior architecture to give priority to space not decoration — Enable seamless and intuitive guest flow from space to space — Furniture is contemporary and of premium quality, yet can showcase playful and surprising elements to reflect the sense of humour of the brand — Where non-natural lighting is required, top quality products that provide efficient lighting and enhance the guest experience should be favoured, whether for multifunctional guestroom lighting or bold public area statement pieces — Art takes centre stage in a hotel interior design — Comply with applicable standards (health, hygiene, environment, regulations, etc.) 12 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Hotel Type & Geographic Criteria There are several possible location types for Mövenpick Hotels and Mövenpick Living: Urban Centres, Urban Resorts, and Resorts of various kinds. As a premium brand, Mövenpick Hotels are in desirable key locations with a focus on positioning for groups, families, corporate-traveler, leisure and MICE business. The brand’s aim is to continue developing in the following locations: Urban Centres — Key urban locations within iconic architecture or iconic landmarks — Often high-rise buildings with locations, commanding excellent views or social connections — Locations with direct restaurant and bar access to gain local neighbouring guests — This might include boutique properties in particular markets Urban Resorts — Locations where resorts are in close proximity to downtown or urban centres — Connection to beach, mountain or golf course access preferred — Medium-rise buildings, commanding excellent views and social connections Resorts — Serenity is the key feature — Remote locations with minimal to no access to urban centres — Connection to beach, mountain or golf course access required — Low to medium-rise buildings (not over 10 levels above ground), commanding excellent views 13 Urban Centres Urban Resorts Resorts Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Economic Criteria When designing and building a Mövenpick property, the underlying premise is to create a successful hotel that delivers an outstanding guest experience, and in turn, meets the economic returns set by the investor (client / owner) and for the Operator (Mövenpick Hotels & Resorts). Key economic criteria for Mövenpick properties: — Smooth and efficient operations — Functional and appealing products and services designed for key ROI strategies — Spaces that leverage ROI opportunities, meet luxury hospitality and brand standards and require minimal maintenance — Layouts that keep guests safe — Areas that allow for flexibility and future growth opportunities — Designs that are of highest quality standards and will not need significant updating for 7 – 10 years It is essential that Mövenpick D&TS and Operations teams are involved and provide input throughout the design process to ensure the above criteria are met. 14 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Art & Style Attention should be given to art and style in all Mövenpick hotels. It is recommended that an art consultant be appointed alongside the interior designer to develop a coherent narrative throughout properties and ensure an appropriate budget. Specific lighting and structural framework must be considered as well. Paintings, photography, wall installations, sculpture, carpets, textiles, wallpaper and glass mosaics can be used harmoniously to create surprising visual and sensory effects. They are also a powerful reminder of the local connection and identity of each hotel and celebrate the cultural history and artistic tradition of a city or a country. Art should be of high quality and should be carefully selected and displayed in the lobby, corridors, meeting rooms, fine dining areas, gardens and other outdoor areas. 15 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Mindful Sustainability Mindful sustainability is one of Mövenpick's brand passions. From the start, Mövenpick has embraced an eco-friendly mindset and today sustainability remains a key component of the brand. The approach to be adopted in Accor projects should be “Reduce, Reuse, Recycle”, in that order, as much as possible. Accor favours the use of locally-available materials. Mövenpick only imposes some fundamental requirements which these techniques must meet: Sustainability principles must be integral to the design approach, showcasing the brand’s commitment to the environment, people and local communities. Green Globe Programme The Green Globe International Standard for Sustainable Tourism is the original standard on which all tourism eco-labels have been based since 1994. Certification is awarded based on compliance with nearly 400 indicators covering sustainable management, socioeconomic, cultural and environmental factors. Mövenpick was named the world’s most sustainable hotel group by Green Globe in 2017. All Mövenpick hotels must be Green Globe certified. greenglobe.com/standard Planet 21 Programme Sustainable development is key for Accor both in terms of respect for the environment and social responsibility. Its Planet 21 programme embodies these commitments and sets ambitious targets. As an Accor brand, Mövenpick is fully committed to Planet 21 and aims to have all Mövenpick hotels achieve Silver status or above. As Mövenpick hotels participate in both Green Globe and Planet 21, where programme criteria overlap, then whichever is the more stringent requirement must be implemented. Planet 21 is structured around key stakeholders (co-workers, clients, partners and communities) and focuses on 2 main design-related areas – buildings and food & beverage. — Stability and strength of the structure — Fire safety — Acoustic comfort — Thermal comfort and energy savings — Durability and ease of maintenance Under the Accor Planet 21 sustainability programme, the group is committed to take practical measures as regards building and refurbishing hotels. Accor Sustainable standards align themselves with international accreditation boards such as BREEAM, HQE, LEED, DNGB, Green Globe, etc. Manufacturers and suppliers must comply fully with the obligations listed in Accor’ “Procurement Policy 21”. Every hotel has to secure the signature of this Procurement Policy 21 by the manufacturers and suppliers with which it deals with. Compliance with all applicable regulations and standards will be ensured, including local authority instructions. Sustainability Principles Wood All wood-based products used in construction or floor surfaces must be certified as sustainable, i.e. sourced from sustainably-managed forests (relevant certifications: FSC - Forest Stewardship Council, or PEFC - Pan European Forest Certification). Examples of wood-based products include timber frames, flooring, furniture, panelling and so on (low or no VOC hard surface flooring). Each of these structuring elements must be fully integrated into any hotel project. Generally speaking, hotel design must take into consideration Accor rules regarding sustainable development. Lighting Lighting must be LED, energy efficient and with replacements easily fitted. 16 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Carpet Requirements During Construction – Site Environment Carpet must be environmentally friendly (GUT certification), guaranteed free from harmful substances, or made from recycled materials (low or no VOC carpet system). The building contractors must implement and comply with a site management procedure to limit the effects of the work on the neighbourhood (a formal procedure that can be monitored). Paint Paint must be environmentally friendly (European Ecolabel, bio-based sources). The VOC content must comply with the 2004/42/EC Directive on paints and coatings (low or no VOC). Asbestos Contractors must implement and comply with the following criteria: — Compliance with the main principles of the ILO (International Labour Organisation) agreements and local regulations — Use of local labour and respect of local customs An asbestos survey of any existing structures has to be carried out by a qualified specialist. Materials not forming part of the existing structure and containing asbestos should be removed from the site and disposed of in an approved disposal facility. — Non-discrimination with regards to sex, race, religion and political affiliation — Reject corporal punishment, psychological and sexual harassment, etc. — Implement a health and safety plan for the work site (including a monitoring process) Integration in the Environment General Integration into the local architecture and environment is a key requirement. The hotel design and construction should take into account the site opportunities and constraints such as locally available materials or renewable energies, energy and water supplies, rain water evacuation and sewage treatment, etc. The building matches local cultural and weather requirements. Biodiversity When the hotel site has existing vegetation, the buildings should be located to take into consideration items to be preserved or relocated. Landscaped areas should be designed to favour local species. Asbestos-containing materials forming part of the existing structures have to be removed or encapsulated according to the qualified specialist’s recommendations. Construction materials should not contain asbestos. The owner, developer or contractor should provide certification to this effect. It is key to specify and install materials which can be recycled at the end of their life. Waste Selective Sorting All Mövenpick hotels must organise selective waste sorting. In order to achieve this, dedicated rooms or areas should be allotted to separate sorting of: empty bottles, organic waste, cardboard, glass, metal waste and tins, paper, used oil, etc. (details to be adapted to local requirements). A waste management and selective sorting procedure must be observed to limit waste and promote recycling (a formal procedure that can be monitored). — Use of de-watering units — Use of composting units — Segregated re-cycling zones (paper, cardboard, glass, aluminium, hazardous waste, etc.) 17 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Water Scarcity Area Energy Consumption When an Accor hotel is to be developed in a location where the Annual Renewable Water Supply per person is qualified as “extreme scarcity” (“Global Water Tool”, www.wbcsd.org/) a complete water resources impact assessment shall be performed by a qualified specialist as well as an economical assessment of all potential technologies / solutions (e.g.. Rain water recycling, grey water recycling, landscaping with low consuming plants, etc.) available to limit water consumption. Guest comfort shall not be impacted. The architecture should be adapted to the local climate and promote passive energy optimisation. The principles of the environmental quality approach should be applied from the start of design, as well as any other installation promoting energy savings such as: — Appropriate orientation of buildings, location and sizing of windows or other glazed areas, sun screens, natural lighting, etc. Pollution An environmental and pollution assessment will be launched on site, by a qualified Design Office before construction. All materials and contaminated or harmful products must be treated or removed from the site (before the beginning of construction). — High-performance thermal insulation, minimised thermal bridges, vestibules on all external doors, etc. — Reinforced thermal insulation should be preferred whenever possible consistent with Nuisance to Neighbours The hotels should be designed to minimise disturbance to neighbouring properties. The effects of construction on natural lighting and wind for neighbouring buildings should be examined by specialists. Plant rooms and air supply and extraction grilles should be designed and located to limit nuisance (noise, smells, visual appearance), and potentially noisy areas (bars, car parks) should be adequately enclosed or fenced. Transportation balanced investment / operation — Use of low E-glazing / high performance glazing — Optimise window to wall ratio — Roof selection (green roof) — Reflectivity of roof Smart Guest Room Technology Pedestrian paths and bicycle paths, in particular to public transport stops, should be included. The hotel car park should include an area dedicated to motorcycle parking. A Guest Room Management System automatically adjusts: — Temperature for unsold, unoccupied rooms and Greenmode Air Pollution — Intuitive and smart lighting not only saves energy but also improves sleep quality (good working light, night light, relax light, master switch next to the bed) Air pollution has a massive impact on our health and guests of today are on the lookout for ways to make the air they breathe much cleaner. Refer to Green Globe Report  To have clean air throughout our hotel would be desirable. IF the Air Quality Index though exceeds 50 an air purification system (with silencer) must be introduced in all guest rooms and suites as well as in all Wellbeing facilities (Spa and Fitness areas). 18 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 General Planning Principles 19 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design General Design & Construction Considerations — Wherever the project is located, Mövenpick Hotels must be designed to meet local requirements for 5-star hospitality ratings — All local cultures and living traditions should be taken into account when planning hotels — Wherever possible, locally sourced materials and decorative items showcasing high quality craftmanship should be used to enhance the design — All sources are to ensure environmental and social safety standards (including child labour) are met wherever possible — All local safety standards and code regulations must be met depending on the project location — All neighbourhood adjacencies should be considered when planning the hotel for construction purposes and long-term functionality — Our hotels should never become a nuisance to the neighbours, but should become a contributing asset to neighbourhoods for social and economic purposes — In resorts, it is of the utmost importance to protect sea life and natural environments that are key to the location, even if they are not protected by local governments — The use of electric buggies and service vehicles are required in all resorts. The planning of each resort should accommodate for these vehicles. (No gas or diesel powered vehicles to be used) — All fabrics, finishes and building materials must adhere to our Planet 21 Commitment for sustainable standards and fire requirements — There must be sufficient facilities for waste sorting in each property, in order for our hotels to limit waste and promote recycling 20 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Masterplan City Hotel The hotel layout is driven by Guest and service flow optimisation, offering a well balanced, functional and aesthetic layout; developing a property that simultaneously meets the needs of the guests and the team members. All services (restaurant, spa, etc.) and rooms are easily accessible from the lobby. Spa Pool Fitness Spa & Sport Heart of House Guest rooms / Suites Heart of House Dedicated Entrance Heart of House Executive Lounge Events & Meeting Mövenpick Gourmet Retail Lobby Living Room Coffee & Wine Lounge All Day Dining Speciality Bar Speciality Restaurant Main Hotel Entrance Dedicated Entrance Dedicated Entrance Dedicated Entrance Dedicated Entrance Heart of House Main arrival / Drop off Dedicated Entrance 21 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Outside Areas 22 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Exteriors All hotel buildings must have the following key zones and standards: — The design of the hotel entrance must inspire guests, creating an uplifting and memorable sense of arrival and departure — Dedicated storage and waste bin zones (free from neighbouring establishments and out of guests view) — Dedicated Heart of House / servicing zones (delivery / loading docks, team member entrances, etc.) that are out of guest view, with separate road access where possible — Dedicated connections to public utility services into the building — Complete isolation from third-party / mixed use establishments in regards to fire and life safety requirements — Complete security mandates for the safety of our guests, applicable to local security risk rating — Complete access to exterior structure lighting schemes and landscape lighting. Exterior lighting should never interfere with comfort of interior guest spaces — In hotels connected to third party establishments such as office complexes or shopping malls: — Sharing FLS emergency signals between hotel and shared complex facility should be coordinated to notify all parties in case of emergency in third party facility — Adequate fire breaks between hotel and third party facilities are required. This includes parking structures — Access to lighting controls must be through the hotel on the actual hotel facilities.Third parties cannot control exterior lighting on hotel structure — Further consideration can be taken to review a “shared services” strategy in mixed use developments; subject to management agreement or facilities management requirements — When suitable, allow for comfortable and inviting smoking areas to be located outside (near the F&B venues when possible), but away from the main hotel entrance 23 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Exterior Signage Signage is a critical feature that marks our hotels in the cityscape or landscape. It is important that the signage compliments the architecture through discreet and graceful scale and proportion. — Large 3-dimensional brand logo (light box) must always be used on buildings — The property logo should be used on the valet stand in a subtle and tasteful manner — Well lit monument or totem signs should be present for hotels with driveway entrances — The Mövenpick brand flag must be included in the flag presentation at the front of each hotel. Please ensure the correct protocol is followed for displaying flags in the destination if national flags are flown — A minimum of three flagpoles are required at the entry. The anodised aluminium poles shall have internal halyards with a custom factory finish. If freestanding, the flagpoles shall not be less than 4.5m (15ft) or exceed 12m (40ft) in height. Verify the distance between the flag poles to ensure the flags will impede in their respective air space Refer to Exterior Signage Manual  24 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Hotel Arrival Adjacency Diagram Please note that this diagram should be referred to where lifestyle and local regulations require a Port Cochere and drop-off area. The hotel arrival should consider the following: — Clearly defined Porte Cochere or Drop-off at Main Entry — Discreet Guest Scanning Room (where required, regional specific according to security profile) — Gracious Main Entrance — Well-positioned valet / bell desk — Concealed luggage scanning room (where required) Service Lift Luggage Holding Room To Arrival Lobby Heart of House Team Member Access Luggage Security Scanning room Main Hotel Entrance Guest Security Scanning room Discreet automatic service door Valet / Bellman Desk Parking & Valet / Driver’s Lounge Porte Cochere Drop-off Separate team member access 25 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Arrival Experience The hotel arrival is critical for the guest experience, as everything relies on this first impression and first connection to the destination. To achieve this, the arrival area should include the following features: — Where possible, gracious driveway or approach to the front entry — A monument sign or totem sign should introduce the arrival experience - either at the front of the driveway or at the front entry — A signature Porte Cochere complimenting the architecture — Architecture should be environmentally and economically sustainable. The hotel building will be harmonious with its surroundings and will respect its local environment. Mövenpick hotels should be recognised as leading local examples of innovative and green architecture. — The design of the hotel building should be visually appealing with inspiring elements, particularly at the entrance and in outdoor areas — Gardens, where present, are to be considered as valuable assets. Respecting the brand design DNA, gardens should be multi-functional spaces with areas where guests can find peace and serenity or where memorable events take place. — Statement entry doors that invite the guest to connect with the location and the Mövenpick experience and the connection to the soul and spirit of the building — Decorative lighting and unique decorative features creating a seamless design between interior and exterior — In inclement weather, the entry / porte cochere should be well covered / protected to bring ultimate comfort to the guests getting in and out of the car — A sound system providing ambient music adds to the overall arrival experience Refer to Mövenpick Design Brief  26 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Main Arrival / Drop-Off Hotel Entrance — Where required, a Porte Cochere structure / covering should be no less than 4.3m — Main entry doors shall be no less than 2.7m (9ft) in height and should open outward — No storefront or office-style doors to be used — A second set of doors at each side of main doors can be provided for secondary egress, where required by code — An airlock vestibule should be provided in locations where interior temperature control is required — In some properties with multiple street entry opportunities, security and access risks should be evaluated to allow our guests full and complete safety within the premises — Aim to have alternative street access to food & beverage venues, rather than having all guests pass through the lobby. Venues will also have lobby access for hotel guests (14ft) high and 12.2m (40ft) wide with three covered driving lanes — Paving at Porte Cochere should be a durable high-end hard surface such as granite (no asphalt). Adequate slope, draining, landscaping and lighting required — Heated paving in porte cocheres for winter climates, where needed — The width of the sidewalk in front of the main entrance shall be minimum of 5m (16ft) wide — Adjoining sidewalks should not be less than 3m (10ft) wide to edge of landscaping or building — One ramp for wheelchair bound guests to be used from Porte Cochere to main entrance if there is a change in ground levels — Minimum of three with the Mövenpick brand flag must be included in the flag presentation at the front of each hotel. Please ensure the correct protocol is followed for displaying flags in the destination if national flags are flown — A unique statement feature – water feature, artwork, fire pots, or whatever is appropriate for a unique arrival experience — Holding station for taxi, limousine, and short-term parking, according to local zoning — Speakers for background music required in Porte Cochere — Valet Stand to be shaded in hot climates and heated in cold climate locations — Elegant planters or decorative features , showcasing local craftsmanship at its best at entrance — Where applicable, benches for guests waiting on valet service — Bollard protection / security protection at driveway in sensitive locations, in accordance with security risk profile. Refer to Networking & Security Standards in the D&TS Library for more information — In resorts, provide adequate spaces for buggy parking with charging stations in close proximity to hotel entrance — Where possible, provide an external space away from main entrances to accommodate smoking 27 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Valet And Self-Park Facilities Guest Luggage Access Where local regulations state that valet parking is required, as part of the guest services, provisions must be made for both short-term and long-term valet parking. The number of car park bays must meet local code requirements. The facilities must be well integrated with the facade, entrance design and architecture — In locations where valet parking is provided with a service fee, a cashiers booth is required for easy guest access (mostly urban hotels where parking spaces are at a premium) — In some hotels, particularly resorts where rental cars are prevalent, self-park may be offered for easy access to the guests. But valet parking is always the primary vehicle control mechanism Luggage will be taken from the guest at the car drop-off via bellman service — All luggage access should be through a discreet automatic service door off of the main entrance and must not come through the main hotel entrance — In some locations, scanning of luggage is required, and this should be done through a discreet service room outside of the building and out of guest’s view. Refer to Networking & Security Standards in the D&TS Library for more information — A luggage store will be just inside the building, with direct access to a service lift to get the bags to the guest’s room without crossing any main public walkways or lobbies — Luggage room shall include shelving, lockable cabinets and hanging rods. Provide telephone, power and data outlets — Car parks should be treated as part of the hotel premises in regards to security, management — In golf resorts, provide space for golf club storage / racks, etc. and maintenance — Car parks should be clean, well-marked with easy to follow signage, pleasant lighting, sound system and CCTV surveillance directly back to hotel security — Guest access from parking zones to hotel should be clearly marked either via stairs or lift into public area zones. Provide guest card key access for security into the building. No parking lifts should lead directly to guest room floors — All lift landing or stair landings should be separated by fire-proof access doors. There is always a fire break between the hotel and parking structures — Provide all necessary emergency exits required in all parking facilities 28 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Service Access To Building All service and loading access into the hotels will be from the rear or side entrance in a discreet location away from public view. Hotel traffic should not cross with service traffic at anytime. These areas shall include the following: All hotels should have a dedicated and discreet team member entrance, typically located at the rear or side of the building, near other servicing entrances. Team Member Access To Building — Service access drives and ramp with a minimum width of 4m — Team member entrance should located near a public pedestrian pathway which allows — A minimum of two service bays with security office, required — Service access for hand trucks to be provided 1.2m (4ft) wide — Overhead clearance for service bay: Minimum of 5m (14ft) high for waste management truck access — Loading Dock: Minimum height from service ramp / drive is 90cm (3ft) to 110cm (3’6ft) — Locate all service bays near a service elevator or service circulation area, preferably close to kitchen dry and cold storage — Waste removal truck bay and recycling segmentation areas required — Repair and maintenance areas (engineering) must be located near the loading dock — Noise transmission from loading dock must be minimised the team member to safely enter the building — Team member should not have to cross through loading facilities or other vehicular access points — The entrance should be well-lit and safe for colleagues to enter and exit at all hours in a safe environment — Team member entrances should be secure with check-in access via smart card (or similar) entry system and CCTV to monitor the colleague’s safety — The Team member entrance should lead directly to the Heart of House service corridor, close to Human Resource office and uniform issue room Refer to Heart of House in the D&TS Library for more information.  29 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Lobby 30 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Lobby Living Room Mövenpick's Lobby Living Room creates a warm, inviting environment to bring people together to work, socialise, or just kick back and relax in a convivial atmosphere. The space includes a retail offering featuring the Mövenpick Gourmet Products alongside locally sourced artisanal items. As the guest enters the lobby they are greeted by Mövenpick's signature fragrance, soft and soothing sounds, atmospheric lighting - all adjusted to the time of day. This provides a warm and genuine welcome and a place where guests can enjoy spending quality time. The entrance gives guests an immediate positive first impression. It should be as welcoming as possible and should make full use of views, space and lighting. The guests should feel a specific sense of location, that they are in a specific place and not just anywhere. 31 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Main Lobby Diagram & Design Requirements The Lobby always serves as the central hub for every Mövenpick property. This diagram represents a generalised flow diagram showing ideal adjacencies. However, each project should have unique layouts conducive to location and building requirements. Space sizes depend on the size of the hotel and architectural allowances Public Restrooms Public Restrooms Lift Lift Lift Coffee & Wine Lounge Mövenpick Gourmet Retail Reception Concierge S Heart of House Speciality Bar Dedicated Entrance Dedicated Entrance All Day Dining Restaurant Mövenpick Signature Fragrance Arrival Greenery ie. green wall Local ethnic artwork Background music Speciality Restaurant (optional) Dedicated Entrance Main Hotel Entrance 32 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Lobby Lounge Experience Inspired by Swiss and European town squares, Mövenpick transforms the lobby into the main hub of the hotel, connecting people with modern, inviting spaces and distinctive food and drink experiences. This comfortable, well-designed lobby living room concept connects with the needs of today’s travellers and showcases our Mövenpick Coffee & Wine lounge, plus Mövenpick Chocolate and Mövenpick Ice Cream retail. The lobby is designed as a lounge, in a warm and contemporary style providing a modern, timeless feel and a friendly atmosphere. The design should be uncomplicated, but not minimalist, to animate and bring to life our passion for food and drink. Relaxed and comfortable seating is arranged harmoniously throughout the space. Mövenpick’s commitment to sustainability is evident to guests from the moment of arrival. The lobby should feature greenery (for example green wall). It is important to reflect local influence in the design to create a true sense of place. Connectivity is key and both Wi-Fi and discreet device charging points should be available everywhere. The design of the lobby shall be accented by a focal feature and / or signature view opportunity. It shall take advantages of high ceilings, large windows, natural light and large spaces to help establish the property as an upscale destination. Local ethnic artworks, designs, features should be designed for, to create that sense of place of the country. Selection of Lobby finish materials shall take into account the need to achieve a balance between sound absorptive and reflective surfaces and match the guest visual experience with appropriate room acoustics. Provide low-level background music through concealed speakers and dimmable light fixtures. 33 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Arrival Mövenpick Coffee & Wine Lounge Lobby shall be spacious with plenty of holding areas and circulation space to handle busy times, limited arrival and departure schedules, large groups, seasonal luggage while still creating a sense of a premium living room environment. The Coffee and Wine Lounge at Mövenpick offers more than just a collection of products, but an immersive and interactive experience that engages guests with both beverages; combining seamlessly integrated technology, intelligent design, and an artisanal touch. — Arrival Lobby should be spacious with plenty of holding areas and circulation space to handle high traffic volume in peak season or large group access at one time. Arrival lobbies should have a clear ceiling height of two levels where possible — Provide design concept for walk-off mats for inclement weather. These should be custom in detail and not look like off-the-shelf products. Every detail should be designed into the guest experience — Provide space for an umbrella stand to service guest’s use in inclement weather — Provide background music and biophilia to be provided within the environment — Each property requires the brand scent to be piped into the A/C units to enhance the sensory experience Refer to Coffee and Wine Lounge — Soft sounds and atmospheric lighting, adjusted to the time of the day — Helpful team members are in tune with guests’ needs and moods — The lobby is a place where guests come to Register & Inform, (Net)work & Surf, Savour & Meet, Entertain & Chat Selection of lobby finish materials shall take into account the need to achieve a balance between sound absorptive and reflective surfaces and match the guest visual experience with appropriate room acoustics. Room finishes shall be low-emitting with GREENGUARD® certification, where applicable. Finish selection criteria shall include post consumer recycled content. 34 Mövenpick Construction and Renovation Standards | Version 1.2 – October 2023 Introduction | Programming | Technical Introduction | General Principles | Outside Areas | Lobby | Food & Drink | Guest Rooms | Events & Meetings | Spa & Wellness | Leisure | Family | Inclusive Design Front Desk & Concierge Service The design of the Front Desk will reflect the architectural style of the building and the interior design of lobby. Ideally, the Front Desk shall be within visual proximity to the guest elevators and concierge. The Reception is a welcoming connection and that should always include the following: — A separate area marked location off the arrival and main lobby — Visual proximity to the guest elevators and concierge — The design of the Front Desk may be freestanding units with one or two stations per unit or a continuous counter depending on the interior design concept — The desks / pods are semi automated and are assisted by Mövenpick team member at all times — The desks / pods either seated or standing, depending on the location and cultural requirements: — Provide enclosed trash and recycle bins under the counters. A guest monitor shall be provided by incorporating it into the counter design (privacy issue). Provide ergonomic standing mats behind computer stations for team members. Ensure colour and material compliment the interior design concept — Provide accessible locations for house phones in the lobby and adjacent to the Front Desk. — All joinery shall be FSC certified and Urea Formaldehyde Free The Concierge will be separate from the Reception and following many of the same requirements as the reception. — The Concierge provides a unique purpose in being the connecting point for all guest services following check-in. The Concierge should be located near the reception, but in a distinct and more accessible location — The Concierge desk can also be seated or standing, depending on the location: — In urban hotels, reception desks / pods are standing desks for quick, efficient check-in or — Urban Hotels – Standing check-out — In resort locations, the reception desks could be seated to help the guest relax and enjoy their arrival experience — The desk will be manned 24 hours a day and serves as a major control point between the exterior and interior of the hotel. A door shall be designed for access to the adjacent front offices; minimise visibility into back office to be concealed when door is open — P const app = document.getElementById('app');
const chipsEl = document.getElementById('chips');
const countEl = document.getElementById('count');
const footEl = document.getElementById('foot');
const qEl = document.getElementById('q');

let activeCat = 'all';

// build category chips
const chips = [{key:'all', zh:'全部', en:''}, ...DATA.categories];
chipsEl.innerHTML = chips.map(c =>
  `<span class="chip${c.key==='all'?' active':''}" data-cat="${c.key}">${c.zh}${c.en?' · '+c.en:''}</span>`
).join('');
chipsEl.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click',()=>{
    chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    ch.classList.add('active');
    activeCat = ch.dataset.cat;
    render();
  });
});

function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function hl(text,q){
  text = esc(text);
  if(!q) return text;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return text;
  return text.slice(0,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
}
function fileHref(path){
  if(!path) return '';
  const p = path.replace(/\\/g,'/');
  return 'file:///'+encodeURI(p);
}

function matches(r,q){
  if(!q) return true;
  const hay = [r.title,r.en,r.desc,(r.kw||[]).join(' '),r.cat,r.brand,r.text].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function render(){
  const q = qEl.value.trim();
  let shown = 0;
  const html = DATA.categories.map(cat=>{
    const list = DATA.records.filter(r=>r.cat===cat.key && (activeCat==='all'||activeCat===cat.key) && matches(r,q));
    if(!list.length) return '';
    shown += list.length;
    const cards = list.map(r=>{
      const ref = r.reference;
      const tags = `<span class="tag${ref?' ref':''}">${esc(r.brand)}</span>`
        + (r.version?`<span class="tag">${esc(r.version)}</span>`:'')
        + (r.date?`<span class="tag">${esc(r.date)}</span>`:'');
      const kw = (r.kw||[]).slice(0,12).map(k=>`<span>${esc(k)}</span>`).join('');
      const refnote = ref?`<div class="refnote">📌 参考说明：${hl(r.refNote,q)}</div>`:'';
      const href = fileHref(r.path);
      const open = href?`<a class="open" href="${href}" target="_blank" rel="noopener">打开原文件 ↗</a>`:'';
      return `<div class="card${ref?' ref':''}">
        <div class="card-top">
          <span class="code">${esc(r.code||'')}</span>
          <div>
            <p class="title">${hl(r.title,q)}</p>
            ${r.en?`<p class="en">${hl(r.en,q)}</p>`:''}
          </div>
        </div>
        <div class="tags">${tags}</div>
        <div class="desc">${hl(r.desc,q)}</div>
        ${kw?`<div class="kw">${kw}</div>`:''}
        ${refnote}
        <div class="meta">
          <span>页数 ${r.pages??'—'}</span>
          <span>${r.size_mb?r.size_mb+' MB':'—'}</span>
          ${open}
        </div>
      </div>`;
    }).join('');
    return `<section class="cat">
      <div class="cat-head"><span class="zh">${esc(cat.zh)}</span><span class="en">${esc(cat.en)}</span><span class="n">${list.length} 份</span></div>
      <div class="grid">${cards}</div>
    </section>`;
  }).join('');

  app.innerHTML = html || `<div class="empty">没有匹配的文档，试试别的关键词。</div>`;
  countEl.textContent = `显示 ${shown} / ${DATA.records.length} 份`;
  footEl.textContent = `瑞享 Mövenpick 设计标准分类看板 · 生成于 ${DATA.generated||''} · 共 ${DATA.records.length} 份文档`;
}

qEl.addEventListener('input', render);
render();
</script>
