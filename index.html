te individuality and charm. Our tone is characterful, reflecting the diverse personalities that make up our brand. We infuse our communication with a playful and spirited flair, ensuring that every message is as unique and memorable as our culinary creations. This adds a touch of personality that sets Mövenpick apart in a crowded market. Caring Mövenpick's caring tone is rooted in genuine concern for our customers and the world around us. We communicate with empathy, understanding, and a commitment to making a positive impact. Whether expressing gratitude to our customers or discussing our sustainability initiatives, our tone is always considerate, showing that we genuinely care about the well-being of individuals and the planet. Engaging Mövenpick's tone is engaging, capturing attention and sparking a sense of curiosity. We use language that invites our audience to be part of the conversation, encouraging active participation. Whether through delightful storytelling or interactive content, our tone is dynamic and captivating, ensuring that every interaction with Mövenpick is a memorable and enjoyable experience. 2 7 COMMUNICATION DESIGN Brand photography LIVED MOMENTS PLAYFUL SURPRISES NOURISHING DETAILS SENSE OF ESCAPE CAPTURED WHISPERS FOUND TEXTURES I K C P N E V Ö M K O O B D N A R B 2 8 I K C P N E V Ö M K O O B D N A R B CONTENT Table of contents 01 Brand Introduction 02 Brand Audience 03 Brand Foundations 04 Brand Experience 05 Spatial Design Ethos 06 Communication Design 2 9 07 Marketing MÖVENPICK LIVING ISTANBUL WEST, TURKEY I K C P N E V Ö M K O O B D N A R B 3 0 MARKETING Brand channels New MÖVENPICK.COM Brand new website launched in 2023 to build brand awareness, perception and conversion. Mövenpick.com provides inspirational content for its users driving Web Direct conversion. Mövenpick.com scores extremely well on organic search, due to the brand’s mandatory SEO programme to which hotels contribute. CRM OPTIN ALL & BRANDS 138 094 OPTIN BRAND NOT ALL 2 oning food culture for global positive change, lead the premium segment as a food & drink first hotel brand. Brand Heritage “We simply do ordinary things in an extraordinary way.” Competition Overview Brand Muse To the Food Culturalist, food is a fundamental facet to their identity. Beyond fueling their days, it is a catalyst for inspiring moments of connection, creativity & change. Brand Purpose Destination inspired hotels where food culture brings human connection Brand Character A generous & creative host who thrives on bringing people together to enrich their experiences. Their curiosity is contagious & there is always an extra seat at their table. Brand Experience Cultivating Connection Nourishing bonds, elevating moments Food for Good Uniting palates, inspiring lasting impacts Discovering Together Connecting families, creating inspirations"}, {"code": "1.1.01", "title": "瑞享设计纲要（总纲）", "en": "Mövenpick Design Brief", "cat": "cat_brand", "version": "V1.0", "date": "2025-01", "brand": "Mövenpick 瑞享", "file": "1.1.01 Mövenpick Design Brief Jan 2025 (1).pdf", "path": "C:\\Users\\JOZHOU\\Downloads\\1.1.01 Mövenpick Design Brief Jan 2025 (1).pdf", "pages": 74, "size_mb": 17.58, "desc": "2025 年 1 月版瑞享设计纲要总纲，面向所有参与瑞享物业创建的团队。定义「以美食文化连接人际的目的地灵感酒店」定位，指导项目对齐品牌设计基因。", "kw": ["设计纲要", "Design Brief", "目的地灵感", "美食文化", "品牌定位", "设计基因", "总纲", "2025"], "reference": false, "refNote": "", "text": "JANUARY 2025 Design Brief DESIGN BRIEFMÖVENPICK WHO IS THIS DOCUMENT FOR? This document is for anyone involved in the creation of a Mövenpick property. Designers, project managers, developers, hotel owners and investors, we encourage you to immerse yourself in the Mövenpick brand. This document is here to help align your project with Mövenpick’s design DNA – to inspire you within the framework of our philosophy. Destination inspired hotels where food culture brings human connections. 2 All rights reserved. No part of this document may be reproduced, stored in a retrieval system or transmitted, in any form or by any means, without the prior permission in writing from ACCOR. DESIGN BRIEFMÖVENPICK CONTENTS 01 BRAND OVERVIEW 02 DESIGN STRATEGY 03 DESIGN IN PRACTICE Understanding the Mövenpick Brand: getting familiar Getting familiar with our foundational design DNA: Applying the Design Philosophy in practice: what are with our underlying Brand Strategy, our purpose, understanding the core Brand Concept that at the the key areas where our philosophy can impact the passions and positioning. heart of all Mövenpick hotels. design of our hotels. P.04 P.07 P.13 04 BUILDING SCENARIOS 05 HOTEL ZONES 06 CASE STUDIES Understanding the different types of Mövenpick hotels. Getting familiar with the different areas within A selection of our hotels around the globe, showcasing Mövenpick hotels: what are the key considerations for how the Mövenpick design DNA can inspire and be each zone and what are the opportunities. interpreted for each unique location. P.18 P.25 P.69 3 DESIGN BRIEFMÖVENPICK 01 BRAND OVERVIEW 4 Brand Heritage Brand Summary P.05 P.06 MÖVENPICKDESIGN BRIEF BRAND OVERVIEW Brand Heritage “We simply do ordinary things in an extraordinary way.” This ethos rings as true to Mövenpick today as it did when Ueli Prager opened the first Mövenpick restaurant in Zurich in 1948. Believing that everyone should be able to enjoy a taste of the good life, he made high quality food and drink available and affordable to a much broader group of people, through ingenious innovation (such as à la carte dishes and fine wines by the glass). Mövenpick became synonymous with a new definition of fine dining infused with a sense of fun and adventure and without the pretension. Today, this ground-breaking and innovative approach to food translates to a premium international hotel brand, with culinary excellence and human connection at its heart. Embracing characterful hospitality that fosters genuine human connections, Mövenpick curates inviting food and drink experiences for guests across all occasions—be it business, leisure, or family gatherings. 5 DESIGN BRIEFMÖVENPICK BRAND OVERVIEW Brand Summary 6 Brand Heritage Brand Purpose Brand Experience “We simply do ordinary things in an Destination inspired hotels where food extraordinary way.” culture brings human connection. Brand Ambition Brand Character Championing food culture for global positive change, lead the premium segment as a food & drink first hotel brand. Curious, Characterful & Generous Brand Muse The Culture Seeker views culture as a gateway to connection, creativity, and contribution. Through food, art, traditions, and local encounters, they embrace the richness of each destination with kindness, A generous & creative host who thrives on bringing people together to enrich their experiences. Their curiosity is contagious and there is always an extra seat at their table. Brand Culture using travel and culinary experiences as We make moments. catalysts for greater good. Cultivating Connection Nourishing bonds, elevating moments. Transforming business and social moments into memorable experiences, breaking barriers and fostering genuine human connections. Whether in business meetings, events or social occasions, we amplify rituals, enabling guests to delight in shared moments and cultivate lasting relationships. Food for Good Uniting palates, inspiring lasting impact. Mövenpick, renowned for its culinary legacy, crafts enticing food and drink encounters catering to diverse palates. We envision food as a catalyst for positive social impact, shaping a community and planet for the better. Discover Together Connecting families, creating inspirations. Creative spaces for families to be together is at the heart of our experience. By providing the right balance of breathing space and active family experiences, our multi- generational programmes promise exciting moments for both family bonding and personal inspiration. MÖVENPICKDESIGN BRIEF 02 DESIGN STRATEGY 7 Design Philosophy Design Pillars P.08 P.09 MÖVENPICKDESIGN BRIEF DESIGN STRATEGY Brand Philosophy We are anchoring the brand back in its roots and evolving the product and experience to be focused on using food as platform for connection, creativity and change. When designing a Mövenpick project, designers should study the brand aesthetic and original DNA, but also the history and culture of the project’s geographic location to create a 360-design narrative and a definite sense of place. 8 DESIGN BRIEFMÖVENPICK DESIGN STRATEGY Design Pillars These principles will help create spaces that are not only functional but also deeply aligned with your experiential goals, fostering a sense of connection, community, and discovery. Cultivating Connection Food for Good Discover Together Interactive Convivial Explorative Create a welcoming environment where guests can connect meaningfully through thoughtfully designed social spaces and collaborative experiences with a local flavour. Promote a sense of well-being and environmental stewardship through communal tables, open kitchens and green spaces. Encourage guests to connect with each other and the origins of their food. Evoke a sense of wonder, encourage curiosity and enable guests to lead their own journey of discovery. 9 DESIGN BRIEFMÖVENPICK DESIGN STRATEGY Interactive Design Principles Create a welcoming environment where guests can connect meaningfully through thoughtfully designed social spaces and collaborative experiences with a local flavour. Open Floor Plans Communal Spaces Integrated Technology Hand-crafted Flexible Furniture The use of open layouts to create fluid spaces, allowing guests to easily interact. Include lounges, conversation pits, or shared workspaces that encourage guests to gather and engage. Implement interactive technology, such as touch-screens or smart boards, to enhance connectivity and collaborative experiences. Handmade materials and objects that layer in texture and add an element of storytelling alongside contemporary pieces. Incorporate movable and modular furniture that can be reconfigured to support different types of interactions and activities. 10 DESIGN BRIEFMÖVENPICK DESIGN STRATEGY Convivial Design Principles Promote a sense of well-being and environmental stewardship through communal tables, open kitchens and green spaces. Encourage guests to connect with each other and the origins of their food. Large Dining Tables Open Kitchens Natural Materials Comfortable Seating Warm Lighting Use expansive tables that accommodate groups and foster a sense of togetherness during meals. Design kitchens that are open to dining areas, allowing for interaction and participation in food preparation. Use natural materials like wood and stone to add warmth and authenticity to dining spaces. Choose comfortable, welcoming seating arrangements that invite guests to linger and converse. Utilize warm, ambient lighting to create a cosy and inviting environment 11 DESIGN BRIEFMÖVENPICK DESIGN STRATEGY Explorative Design Principles Evoke a sense of wonder, encourage curiosity and enable guests to lead their own journey of discovery. Dynamic Layouts Interactive Elements Multi-functional Areas Diverse Textures & Colours Nature Inspired & Integrated Create spaces with varied and intriguing pathways that invite exploration and movement. Incorporate interactive art installations, displays, or features that engage the senses and spark curiosity. Design versatile spaces that can be used for a variety of activities, from learning and playing to relaxing and socializing. Use a rich palette of textures and colours to create visually stimulating environments drawn from the local culture of each region. Include elements of nature, such as indoor gardens, water features, or natural light, to enhance the sense of discovery and connection to the environment. 12 DESIGN BRIEFMÖVENPICK 03 DESIGN IN PRACTICE Materials Furniture Lighting Signage P.14 P.15 P.16 P.17 13 MÖVENPICKDESIGN BRIEF DESIGN IN PRACTICE Materials The hotel’s material design emphasizes playful yet high-quality details, creating a sense of charm and sophistication throughout the space. Warm, textured materials are carefully chosen to evoke comfort and richness, inviting guests to engage with their surroundings. Every touchpoint reflects a commitment to craftsmanship, with thoughtfully curated finishes and accents that showcase artistry and attention to detail. This approach ensures the hotel feels both inviting and meticulously designed, blending creativity with timeless quality. Playful Textured Craft 14 DESIGN BRIEFMÖVENPICK DESIGN IN PRACTICE Furniture Emphasizing detailed joinery and craftsmanship and combining function with artistry, showcasing refined connections, intricate accents, and bespoke flourishes. Thoughtful materials and textures create timeless pieces that enhance the hotel’s character and elevate guest experiences. Detail Flourish Character 15 DESIGN BRIEFMÖVENPICK DESIGN IN PRACTICE Lighting The lighting approach blends feature illumination to highlight key spaces with low-level intimate lights for a warm, elegant glow. Textured lighting adds depth and warmth, creating a luxurious yet inviting atmosphere that harmonizes function with style. Statement Low Level Textures 16 DESIGN BRIEFMÖVENPICK Lorem ipsum odor amet, consectetuer adipiscing elit. DESIGN IN PRACTICE Signage Language, Typography & Iconography Exterior Signage Interior Signage 101-109 LOBBY ВЕСТИБЮЛЬ 110-118 Lifts ЛИФТ 17 TAHLIA JEDDAHDESIGN BRIEFMÖVENPICK 04 BUILDING SCENARIOS 18 Building Typologies Key Touchpoints P.19 P.24 MÖVENPICKDESIGN BRIEF BUILDING SCENARIOS Building Typologies There four different building types that the design principles need to adapt to: • Historic Estates • Modern Havens • Playful Escapes • Seductive Hideaways Each of these have their own parameters that influence design execution. Whilst each building scenario is unique to each site the following pages are a guide for the key attributes of these typologies. An efficient operating model with a lower capital outlay makes Mövenpick a star brand for both conversions & new build. Characterful hotels with all the signature hallmarks guests expect from a Mövenpick. 19 Mövenpick Hotel Hanoi Centre Mövenpick Hotel Basel Mövenpick Resort Al Marjan Mövenpick Resort Kuredhivaru Maldives HISTORIC ESTATES MODERN HAVENS PLAYFUL ESCAPES SEDUCTIVE HIDEAWAYS DESIGN BRIEFMÖVENPICK BUILDING SCENARIOS Historic Estates Heritage properties at Mövenpick embody our commitment to creating unforgettable moments by blending history with modern luxury. These unique locations offer guests an enriching experience, allowing them to explore and immerse themselves in the cultural and historical essence of the destination. Designed to foster interaction, conviviality, and exploration, our heritage properties ensure that every stay is a memorable journey through time, filled with cherished moments and personal discoveries. Design Style Design Principles Experience Drivers Unique, Enriching, Immersive, Cultural, A heritage location may limit integration of • Local Immersion Authentic, Memorable, Convivial, Explorative the more explorative and interactive elements, • Historical Roots therefore lean to executing design through • F&B Programming heightening other design principle elements. (see Matrix) Mövenpick Hotel Hanoi Centre Vietnam Mövenpick Hotel Hamburg Germany Mövenpick Grand Hotel Wroclaw Poland Mövenpick Hotel Budapest Centrum Hungary Mövenpick Mondello Palace Hotel Palermo Italy 20 DESIGN BRIEFMÖVENPICK BUILDING SCENARIOS Modern Havens Mövenpick’s modern “Glass House” city centre hotels exemplify contemporary elegance and urban sophistication. These properties feature sleek, transparent architecture that blends seamlessly with the vibrant cityscape, offering guests panoramic views and an immersive urban experience. Designed with cutting-edge technology and minimalist aesthetics, these hotels provide stylish, comfortable spaces that encourage interaction, conviviality, and exploration, ensuring that every stay is a dynamic and memorable urban retreat. Design Style Design Principles Experience Drivers Contemporary, Elegant, Sophisticated, Sleek, Whilst the more contemporary, urban buildings • Cultural Connection Immersive, Minimalist, Dynamic should allow for open plan and convivial design • Events / Programming principles, sympathetic integration of warmer • F&B Programming palettes & natural materials are key to align to an overarching interior brand aesthetic. (see Matrix) Mövenpick Hotel Basel Switzerland Mövenpick Hotel Melbourne on Spencer Australia Mövenpick Living Istanbul Camlivadi Turkey Mövenpick Hotel Tallinn Estonia Mövenpick Hotel & Apartments Ghala Muscat Oman 21 DESIGN BRIEFMÖVENPICK BUILDING SCENARIOS Playful Escapes Mövenpick’s family-friendly properties are thoughtfully designed to cater to the needs and desires of multi- generational guests of all ages. These hotels feature vibrant, welcoming spaces that foster togetherness and create opportunities for family bonding. With amenities such as child-friendly zones, engaging activities, and safe, comfortable environments, our family-friendly properties ensure that every family member has a memorable and enjoyable stay, filled with enriching and fun moments. Design Style Design Principles Experience Drivers Vibrant, Playful, Welcoming, Engaging, Properties particularly focused on multi- • Family Facilities Versatile, Interactive, Comfortable, Safe generational leisure travel should elevate • Events / Programming convivial and interactive elements to engage • Spa / Well-being and delight the guest. (see Matrix) • F&B Programming Mövenpick Balaland Resort Lake Balaton Hungary Mövenpick Resort & Spa Jimbaran Bali Indonesia Mövenpick Resort Al Marjan Island United Arab Emirates Mövenpick Resort Cam Ranh Bay Vietnam Mövenpick Waterpark Resort & Spa Soma Bay Egypt 22 DESIGN BRIEFMÖVENPICK BUILDING SCENARIOS Seductive Hideaways Mövenpick resort properties are designed to provide a perfect blend of relaxation and adventure, set in stunning natural landscapes. These resorts emphasize open, inviting spaces that encourage guests to connect with their surroundings and each other. With a focus on comfort, elegance, and local charm, our resorts offer a serene escape where every detail is crafted to create memorable and enriching moments, ensuring that guests leave with cherished experiences and a sense of rejuvenation. Design Style Design Principles Experience Drivers Relaxing, Adventurous, Stunning, Inviting, In properties where the focus is to retreat and • Spa / Well-being Comfortable, Serene, Enriching, Rejuvenating unwind, the layout should lean more to explorative • F&B Programming than explicitly open, creating more intimate convivial moments and leaning to a space for relaxation and escape. (see Matrix) Mövenpick Resort El Quseir Egypt Mövenpick Resort & Spa Dead Sea Jordan Mövenpick Resort Waverly Phu Quoc Vietnam Mövenpick Resort Petra Jordan Mövenpick BDMS Wellness Resort Bangkok Thailand 23 DESIGN BRIEFMÖVENPICK BUILDING SCENARIOS Key Touchpoints MARKET-INSPIRED LOBBY STAY Reception & Concierge Standard Guestrooms Eat & Drink Family & Connecting Rooms Interactive Stations Co-Working Spaces Lounge Areas Retail Executive Room / Suite Smart Room (Accessible Room) Executive Lounge Transition Areas LEISURE & WELL-BEING Fitness Swimming Pool Spa Outdoor Spaces & Gardens Optional Leisure Experiences HEART OF HOUSE Talent Café & Lounge Changing Rooms Office Spaces ARRIVAL Porte Cochere Arrival Entrance Bicycle Parking FOOD & BEVERAGE FAMILY EXPERIENCE Specialty Restaurant Family Entertainment Zone Specialty Bar Concept Pool / Beach Cafés Family Pantry MEETING & EVENTS Events Foyer Meeting Rooms Inspiration Hub Ballroom Outdoors / Gardens 24 DESIGN BRIEFMÖVENPICK Mövenpick Moscow Taganskaya 25 05 HOTEL ZONES Arrival Market-Inspired Lobby Food & Beverage Stay Family Experience Leisure & Well-Being Meetings & Events Heart of House P.27 P.31 P.39 P.43 P.50 P.53 P.59 P.65 MÖVENPICKDESIGN BRIEF Mövenpick Hotel Mansour Eddahbi Marrakech HOTEL ZONES Introduction At Mövenpick, we believe life’s most cherished memories are made up of unforgettable moments shared with loved ones. Our goal is to create experiences that bring people together and leave lasting impressions. We offer enriching stays designed to be enjoyed by all - whether on business, as a family or as part of a group. Our hotel spaces are thoughtfully crafted to be interactive, convivial, and explorative, ensuring every moment spent with us is welcoming, inclusive, and truly memorable. 26 DESIGN BRIEFMÖVENPICK HOTEL ZONES Arrival 27 MÖVENPICKDESIGN BRIEF HOTEL ZONES Arrival Porte Cochere Arrival Entrance Bicycle Parking The Porte Cochere should make an inviting and practical statement as the first touchpoint of Mövenpick’s trademark design, balancing form and function. The entrance will showcase the Mövenpick signage above rotating or stationary doors, with a hotel logo plaque beside the entryway. Generous space for traffic flow and luggage movement is essential, along with thoughtful weather-proofing measures to protect guests and minimize drafts in the lobby. 28 DESIGN BRIEFMÖVENPICK HOTEL ZONES Arrival Porte Cochere Arrival Entrance Bicycle Parking The Arrival Entrance is designed to evoke a memorable sense of arrival—airy and spacious, with subtle references to our iconic bird favicon. This space speaks to Mövenpick’s ethos of generosity, welcoming guests into an atmosphere that feels both grand and grounded. 29 DESIGN BRIEFMÖVENPICK HOTEL ZONES Arrival Porte Cochere Arrival Entrance Bicycle Parking Bicycle Parking will be integrated beside the Porte Cochere, providing easy accessibility without blocking entryways. This feature will be seamlessly woven into the aesthetic, enhancing the arrival experience by serving guests who visit by bicycle. 30 DESIGN BRIEFMÖVENPICK HOTEL ZONES Market-Inspired Lobby 31 MÖVENPICKDESIGN BRIEF HOTEL ZONES Market Inspired Lobby Concept A lobby concept built around the idea of a ‘marketplace’. Where everything before the guest lift and check-in revolves around a premium food and beverage experience. The guests should feel a specific sense of location, that they are in a specific place and not just anywhere. Relaxed and comfortable, inspired, yet never pretentious. Mövenpick’s commitment to sustainability is evident to guests from the moment of arrival and should feature greenery while reflecting local influence in the design. Connectivity is key and both Wi-Fi and discreet device charging points should be easily accessible. For more information refer to Mövenpick’s Market Inspired Lobby Concept Style Guide available on the Accor D&TS Library. 32 Seven experiential touch-points are key to making this concept cohesive and true to the vision. Focus on the experience and curation of the guest journey: Reception & Concierge Eat & Drink Interactive Stations Co-Working Spaces Lounge Areas Retail DESIGN BRIEFMÖVENPICK HOTEL ZONES Market-Inspired Lobby Reception & Concierge Eat & Drink Interactive Stations Co-Working Spaces Lounge Areas Retail Guests are welcomed at pod-style counters, featuring adjacent seating areas and regionally inspired decorative elements which creates a warm, personalized greeting. Textured materials, framed views, and inviting furniture establish a comfortable yet sophisticated environment. 33 DESIGN BRIEFMÖVENPICK HOTEL ZONES Market-Inspired Lobby Reception & Concierge Eat & Drink Interactive Stations Co-Working Spaces Lounge Areas Retail Inspired by the lively atmosphere of a bustling market, the Eat & Drink area in the lobby features multi-use counters offering a variety of food and beverage options throughout the day. Guests can start their morning with locally roasted coffee and fresh pastries, grab a quick bite on the go, or unwind over a light meal. With an inviting selection of artisanal snacks, afternoon tea, and refreshing beverages, this space blends relaxed comfort with refined flavors, making it the perfect spot for any moment of the day. 34 DESIGN BRIEFMÖVENPICK HOTEL ZONES Market-Inspired Lobby Reception & Concierge Eat & Drink Interactive Stations Co-Working Spaces Lounge Areas Retail Interactive Stations will allow guests to discover local flavors through hands-on culinary experiences and cater to multigenerational families, corporate groups, and special gatherings, making each visit memorable and educational. The same counters can be utilized for multiple guest interactions, facilitating engagement with chefs and mixologists, cooking classes and tastings, and Mövenpick’s signature Chocolate Hour. 35 DESIGN BRIEFMÖVENPICK HOTEL ZONES Market-Inspired Lobby Reception & Concierge Eat & Drink Interactive Stations Co-Working Spaces Lounge Areas Retail Our Co-working Spaces offer a productive environment within the lively market- inspired lobby, where guests can work comfortably while enjoying food and drink options. These spaces encourage collaboration and innovation, seamlessly blending with the ambiance of the lobby. 36 DESIGN BRIEFMÖVENPICK HOTEL ZONES Market-Inspired Lobby Reception & Concierge Eat & Drink Interactive Stations Co-Working Spaces Lounge Areas Retail The Lounge Areas are designed to provide guests with a cozy and engaging marketplace atmosphere. With diverse seating types, rounded features, plush materials, and thoughtful lighting, the lounges invite relaxation and socialization, fostering a vibrant and communal vibe. 37 DESIGN BRIEFMÖVENPICK HOTEL ZONES Market-Inspired Lobby Reception & Concierge Eat & Drink Interactive Stations Co-Working Spaces Lounge Areas Retail The Retail component offers a curated selection of local goods and artisanal products, presenting guests with an elevated shopping experience. Mövenpick ice cream activations and seasonal retail offerings add a touch of delight, creating a unique and memorable sense of place. 38 DESIGN BRIEFMÖVENPICK HOTEL ZONES Food & Beverage 39 MÖVENPICKDESIGN BRIEF HOTEL ZONES Food & Beverage Specialty Restaurant Specialty Bar Concept Pool / Beach Cafés Where appropriate to the market a speciality restaurant may be designed with an active show kitchen. Effective product merchandising is encouraged by incorporating features such as wine racks and careful selection of furnishings, crockery and décor. 40 DESIGN BRIEFMÖVENPICK HOTEL ZONES Food & Beverage Specialty Restaurant Specialty Bar Concept Pool / Beach Cafés The Specialty Bar will be an engaging social hub, offering guests a taste of Mövenpick’s flair through signature drinks, regional ingredients, and warm, characterful hospitality, all in an atmosphere that feels both sophisticated and inclusive. 41 DESIGN BRIEFMÖVENPICK HOTEL ZONES Food & Beverage Specialty Restaurant Specialty Bar Concept Pool / Beach Cafés Pool & Beach Cafés should embody the relaxed, inviting essence of a beachside retreat, with seating that encourages guests to linger, enjoy fresh cuisine, and savor local flavors in an open, breezy setting. 42 DESIGN BRIEFMÖVENPICK HOTEL ZONES Stay 43 MÖVENPICKDESIGN BRIEF HOTEL ZONES Stay Standard Guestrooms Family & Connecting Rooms Executive Room / Suite Smart Room (Accessible Room) Executive Lounge Transition Areas Rooms should be designed with generosity in mind, with ample space for belongings and practical storage solutions. Full length mirrors and an invigorating walk-in rain shower with complimentary shower amenities. It’s the small gestures that are thoughtful and caring. 44 DESIGN BRIEFMÖVENPICK HOTEL ZONES Stay Standard Guestrooms Family & Connecting Rooms Executive Room / Suite Smart Room (Accessible Room) Executive Lounge Transition Areas Family & Connecting Rooms are designed as a “base camp” for multigenerational families, providing designated spaces for all ages to settle in comfortably. Thoughtfully arranged with activity areas and amenities tailored to children, the rooms ensure a seamless and enjoyable stay for every family member. 45 DESIGN BRIEFMÖVENPICK HOTEL ZONES Stay Standard Guestrooms Family & Connecting Rooms Executive Room / Suite Smart Room (Accessible Room) Executive Lounge Transition Areas Executive Rooms & Suites will offer guests elevated comfort and elegance with thoughtful touches—integrating refined materials, intuitive design, and exceptional Mövenpick amenities—creating a serene retreat for business and leisure travelers alike. 46 DESIGN BRIEFMÖVENPICK HOTEL ZONES Stay Standard Guestrooms Standard Guestrooms Family & Connecting Rooms Family & Connecting Rooms Executive Room / Suite Executive Room / Suite Smart Room (Accessible Room) Smart Room (Accessible Room) Executive Lounge Executive Lounge Transition Areas Transition Areas The Mövenpick Smart Room reimagines traditional accessible accommodations with an inclusive design philosophy that blends innovative functionality, intuitive comfort, and a vibrant sense of place. 47 DESIGN BRIEFMÖVENPICK HOTEL ZONES Stay Standard Guestrooms Family & Connecting Rooms Executive Room / Suite Smart Room (Accessible Room) Executive Lounge Transition Areas For hotels with a high proportion of business clients, an executive lounge may be provided. The atmosphere of the space should be warm, comfortable and inviting, offering a peaceful and quiet environment. 48 DESIGN BRIEFMÖVENPICK HOTEL ZONES Stay Standard Guestrooms Family & Connecting Rooms Executive Room / Suite Smart Room (Accessible Room) Executive Lounge Transition Areas Transition Areas will feature clear, brand- aligned signage, guiding guests smoothly from one space to the next. These areas must feel light and welcoming, ensuring ease of navigation and a consistent experience. 49 DESIGN BRIEFMÖVENPICK HOTEL ZONES Family Experience 50 MÖVENPICKDESIGN BRIEF HOTEL ZONES Family Experience Family Entertainment Zone Family Pantry A dedicated area for amusement and entertainment will be available for children to enjoy themselves in a safe and stimulating environment, while parents can relax elsewhere in the hotel. Furniture and accessories should be playful, yet functional, designed with a child’s perspective in mind, while accommodating for mature generations as well. 51 DESIGN BRIEFMÖVENPICK HOTEL ZONES Family Experience Family Entertainment Zone Family Pantry The Family Pantry is a freely accessible space designed to make family travel seamless. Located on select floors and accessible via room key cards, it offers essential appliances, grab-and-go refreshments, craft supplies, and infant necessities. A curated selection of games and books provides cozy, family-friendly activities for unwinding together. 52 DESIGN BRIEFMÖVENPICK HOTEL ZONES Leisure & Well-being 53 MÖVENPICKDESIGN BRIEF HOTEL ZONES Leisure & Well-being Fitness Swimming Pool Spa Outdoor Spaces & Gardens Optional Leisure Experiences The fitness area embraces a harmonious blend of fluid shapes and energizing designs, inviting guests into a space that promotes strength and well-being. 54 DESIGN BRIEFMÖVENPICK HOTEL ZONES Leisure & Well-being Fitness Swimming Pool Spa Outdoor Spaces & Gardens Optional Leisure Experiences Swimming Pool areas are designed to cater to all ages, with distinct zones for lap swimming, family play, and relaxation. Spaces will flow seamlessly, allowing all guests to enjoy the water in a way that suits their preference. 55 DESIGN BRIEFMÖVENPICK HOTEL ZONES Leisure & Well-being Fitness Swimming Pool Spa Outdoor Spaces & Gardens Optional Leisure Experiences Thoughtfully designed spa, sauna, hammam and treatment rooms promote relexation and rejuvenation, enhanced by natural views wherever possible 56 DESIGN BRIEFMÖVENPICK HOTEL ZONES Leisure & Well-being Fitness Swimming Pool Spa Outdoor Spaces & Gardens Optional Leisure Experiences Outdoor Spaces & Gardens should offer beauty and functionality for all ages, with areas for active engagement and paths lined with manicured greenery, creating a harmonious setting that encourages exploration and interaction. 57 DESIGN BRIEFMÖVENPICK HOTEL ZONES Leisure & Well-being Fitness Swimming Pool Spa Outdoor Spaces & Gardens Optional Leisure Experiences Optional Leisure Experiences like indoor climbing, yoga, or a waterpark can add playful energy to the guest experience, allowing families and active guests to explore exciting, dynamic activities within the Mövenpick environment. 58 DESIGN BRIEFMÖVENPICK HOTEL ZONES Meetings & Events 59 MÖVENPICKDESIGN BRIEF HOTEL ZONES Meeting & Events Events Foyer Meeting Rooms Inspiration Hub Ballroom Outdoors / Gardens The Meeting & Events Foyer should be a versatile space with a warm Mövenpick touch, allowing for social mingling or quiet preparation before events. Its design should transition effortlessly between corporate and celebratory functions. 60 DESIGN BRIEFMÖVENPICK"}, {"code": "1.1.02", "title": "瑞享 Living 设计简报", "en": "Mövenpick Living Design Brief", "cat": "cat_brand", "version": "V3.0", "date": "2021-11", "brand": "Mövenpick 瑞享", "file": "1.1.02 Mövenpick Living Design Brief Nov 2021 V3.0.pdf", "path": "C:\\Users\\JOZHOU\\Downloads\\1.1.02 Mövenpick Living Design Brief Nov 2021 V3.0.pdf", "pages": 49, "size_mb": 2.91, "desc": "Living 产品线（长住/服务式公寓）设计简报：物业类型定义、设计目标、品牌概览、风格灵感、设计手法、设计聚焦（材料/FF&E/照明/技术/色彩/艺术）、标志性空间、可持续卓越与生态设计。", "kw": ["Living", "长住", "服务式公寓", "设计聚焦", "FF&E", "照明", "可持续", "生态设计", "材料", "色彩", "艺术", "V3.0"], "reference": false, "refNote": "", "text": "Living Design Brief V3.0 November 2021 Summary 03 Definition of property types 04 Objectives of the design brief 1. Brand overview 2. Style inspiration 3. Design approach 4. Design focus 5. Iconic spaces 6. Appendix 46 Operational Recommendations 47 Reference Documents 48 Manual Disclaimer 16 Materials 17 FF&E 18 Lighting 19 Technology 20 Colour 21 Art 22 Compliance Requirements 23 Sustainable Excellence 24 Eco-Friendly Alternatives 25 Eco-Design Method 26 Eco-Design Strategy 27 28 Key Principles of Eco-Design Ergonomics for Health & Well-being 31 Main Areas 32 Architecture 33 my Mövenpick marketplace (mmm) 34 Arrival 35 The Library 36 Play Space 37 Clutter Free Meetings 38 Circulations 39 Apartments 41 Bedroom 42 Bathroom 43 Smart Room 44 Fitness & Well-being Definition of property types OWNER LINK TO HOTEL HOTEL SERVICES PRODUCTS 3 s t n e m t r a p A Apartments Hotel HOTEL EXTENDED STAY RESIDENCE Acquired by investors and rent for short or long stay Acquired by individual purchasers Stand alone hotel Stand alone or co-located Co-located (most of the time) Can benefit from hotel services as hotel guests Benefits from hotel services as external guests (à la carte) Hotel public area Guestroom Shared living areas, only for guests or accessible to all (depending on brand) Apartment incl. kitchen Apartment incl. kitchen and other apartment facilities < HOME > Objectives of the design brief In retaining brand identity yet assuring the individuality and uniqueness of each property, this document aims to establish a framework to guide the design teams and partners through the different phases of each Mövenpick Living project. We explain the brand design DNA and showcase the main Mövenpick Living design identifiers and elements. 4 Grand Plaza Mövenpick Media City Dubai < HOME > 1. Brand overview 5 < HOME > 1 BRAND OVERVIEW Mövenpick brand origins Vision We believe true hospitality is about turning small gestures into heartwarming moments Ambition Be the hotel brand that truly cares, combining a commitment to excellence with a genuine, unpretentious approach Roots Founded in 1948 by Ueli Prager, Mövenpick was a pioneer on the Swiss restaurant scene and evolved into a premium international hotel brand, with inventive culinary excellence at its heart 6 Purpose Enable our guests to savour the flavour of life, balancing small indulgences with what’s good for them – and good for the world < HOME > 1 BRAND OVERVIEW Mövenpick brand passions Food & Drink Food & drink has been at the heart of the Mövenpick brand for more than 70 years. We feature a rich and inventive culinary offering, treating guests with whatever they are in the mood for, balancing both healthy and indulgent options. Heartfelt Service Mövenpick hospitality is about turning small gestures into heartwarming moments – doing ordinary things in an extraordinary way. We place a strong emphasis on service, anticipating guests’ needs and creating special moments for each and everyone. Mindful Sustainability From the start, Mövenpick has embraced an eco-friendly mindset and today sustainability remains a key component of the brand. We take a holistic approach to sustainability that benefits all, mindful of people and the environment. 7 < HOME > Mövenpick Living is for people who savour the flavour of life, balancing life’s little pleasures with a healthy attitude Mövenpick Living makes you feel contentand relaxed, and thoughtful and caring service transforms small gestures into heartwarming moments 8 < HOME > 1 BRAND OVERVIEW Why Mövenpick living? – Take care of yourself at our health and well-being facilities but also enjoy little indulgent treats like chocolate, ice cream or a glass of wine. – Enjoy the human touch of Mövenpick Living’s thoughtful and caring service, appreciating its attention to even the smallest of gestures. – Make your journey smooth and easy – the Mövenpick Living experience is uncomplicated and intuitive. – Swiss and local signature dishes include healthy – and sustainable – dining options, ensuring what is good for you is also good for the planet 9 < HOME > 2. Style inspiration 10 < HOME > A COLOUR UPLIFTING A TEXTURE SMOOTH A SCENT MEADOW A FIGURE YOURSELF A DRINK INDULGENCE A MUSIC MELODIC AN OBJECT / A TREND A ROOM A CAR A STORY A COUNTRY / A PLACE AN ARTWORK GENUINE WITH A VIEW CONVERTIBLE ANTHOLOGY WHERE THE HEART IS SPONTANEOUS A MOMENT AN ANIMAL HEARTWARMING ON THE WING A DISH FRESH A FLOWER FRAGRANT A MONUMENT A LANDSCAPE SOUVENIR ALPINE 11 < HOME > 2 STYLE INSPIRATION Design ambition \"We do ordinary things in an extraordinary way.\" Ueli Prager, founder of Mövenpick When designing a Mövenpick Living project, Designers should study the brand aesthetic and original DNA, but also the history and culture of the project’s geographic location to create a 360-design narrative and a definite sense of place. Start with clean and contemporary architectural plans. Create interest, by shifting surfaces inward and outward. Highlight features with powerful colours, as well as contrasting finishes. Tie in the cultural influences with strategically positioned organic relief in unexpected, artistic ways such as floor patterns, balustrades, carpets and textiles. Include uniquely designed and sensory finishes. Generate a warm and natural ambiance that subliminally makes people feel good in the space. Create a bold combination of design and function with contemporary furniture in rich and dynamic materials and accessories with regionally inspired artwork. Create guestrooms that are functional and intuitively friendly to all guests. Work side by side with F&B consultants and the brand to create restaurant identities that will be the heart and soul of the venue’s success. Whenever possible, align efforts with Mövenpick Living’s Global Sustainability philosophy. Incorporate low impact, non-toxic, sustainably produced or recycled materials and energy efficient products. Most importantly, allow room for creativity but keep it simple. For more information refer to Mövenpick Style Book available on the Accor D&TS Library 12 < HOME > 3. Design approach 13 < HOME > 3 DESIGN APPROACH Style Contemporary, warm, inviting, timeless and approachable. Generally, the design should be warm, contemporary – but not trendy - providing a modern, timeless feel and a friendly atmosphere. Not minimalist. Local content or traditions should be considered in the design. It needs to be discreet. The overall concept should be a bold combination of design and function using modern furniture together with rich textures and dynamic materials. 14 < HOME > 4. Design focus – Materials – FF&E – Lighting – Technology – Colour – Art – Compliance Requirements – Sustainable Excellence – Eco-Friendly Alternatives – Eco-Design Method – Eco-Design Strategy – Key Principles of Eco-Design – Ergonomics for Health & Well-being 15 < HOME > 4 DESIGN FOCUS Materials Combine rich and dynamic materials to ensure the design is bold whilst conveying comfort and warmth to reflect the brand DNA and style. Choosing a mix of materials and contrasting finishes is highly recommended, for example, wooden flooring and contemporary tiles, stone and glass, marble and metal. This same approach should be applied to both indoor and outdoor spaces. Cultural and organic references should be visible in the materials selection. Sustainably produced or recycled materials should be favoured to be compliant with the brand’s sustainable approach. 16 < HOME > 4 DESIGN FOCUS FF&E Furniture is contemporary and of premium quality, yet can showcase playful and surprising elements to reflect the sense of humour of the brand. Mövenpick Living FF&E design is simple and intuitive, appropriate in its use of materials, handling and construction. The “less is more” approach includes playful, colourful and poetic aspects, which create eye-catching and charming designs for comfortable living and working areas. The brand’s sustainable approach should be reflected in the use of natural materials such as solid wood and sustainably produced local furnishings. Special attention should be paid to FF&E recycling and elements should be selected that have a potential second life. 17 < HOME > 4 DESIGN FOCUS Lighting Natural daylight should be favoured, be it in the lobby, meeting rooms, guestrooms and bathrooms, restaurants and bars, fitness and wellness areas. Where non-natural lighting is required, top quality products that provide efficient lighting and enhance the guest experience should be favoured, whether for multi-functional guestroom lighting or bold public area statement pieces. A good lighting constellation - whether it is designed to aid orientation, facilitate communication or promote a sense of well-being - plays a key role in shaping the way we assess any experience. A dimmable combination of atmospheric, decorative floor lamps and ceiling lighting is a must. Depending on the time of the day and weather outside, the mood and ambiance can be changed with a pre-set switch to guarantee consistency. For example, a different arrival moods are applied in the morning and evening. 18 < HOME > 4 DESIGN FOCUS Technology 100% Wi-Fi coverage should be provided throughout the hotel, including in all public areas and exterior spaces. High speed internet and easily accessible charging points for portable devices must be available in all public areas and guestrooms. Media technology must be state-of-the-art in meeting rooms, including electronic display and audio systems. Lighting and temperature controls must be functional and easy to use and lighting in public areas and guestrooms should be designed to enhance the atmosphere. Guestrooms should feature flat TV screens minimum 50” (55” minimum in suites). 19 < HOME > 4 DESIGN FOCUS Colour Design should be enhanced and features should be highlighted with powerful and timeless colours. Colours are warm to match with the brand’s DNA and style. Avoid pop colours, as well as acid or too momentary trend palettes. 20 < HOME > 4 DESIGN FOCUS Art Art takes centre stage in a hotels interior design. Paintings, photography, wall installations, sculpture, carpets, textiles, wallpaper and glass mosaics can be used harmoniously to create surprising visual and sensory effects. They are also a powerful reminder of the local connection and identity of each hotel and celebrate the cultural, history and artistic tradition of a city or country. Art should be of high quality and should be carefully selected and displayed in the lobby, corridors, meeting rooms, fine dining areas, gardens and other outdoor spaces. 21 < HOME > 4 DESIGN FOCUS Compliance requirements Each design project has to be compliant with: – Local Requirements Risk Prevention – Sustainable Development/Green Globe Vriteria – “Responsible Luxury” & Indigenous Design – Energy, water and waste consumption and costs recommendations – Equality & accessibility: The hotel must meet all local disability requirements and any brand specific requirements – Accor Fire Safety Policy – Acoustic Comfort – Building Technical Services – Brand Identity Trademarks and Logos – Colleague and Guest Policy – Up to date hygiene, maintenance, safety regulation. 22 Mövenpick Bangkok Sukhumvit < HOME > 4 DESIGN FOCUS Sustainable excellence At Mövenpick Living, we believe in living life well and caring for the people and the world around us. That’s why, through our commitment to sustainable management, we look for new ways and initiatives to make a difference - environmentally, economically, and socially. To us, there’s more to being sustainable than simply lip service. It is a commitment. One that we make every single day thanks to our sustainable management approach. After all, we believe that the future of the world and the future of hospitality are the same. Our initiatives, such as our commitment to global elimination of single-use plastics, not only help us reduce our environmental impact but also help us find new ways to enhance the guest experience by providing alternatives, such as incorporating water filtration stations into hotel and resort public areas and providing guests with Mövenpick branded sustainable water bottles to carry with them in and out of the hotel. As part of Accor’s sustainability programme, we innovate and work with our colleagues, partners and communities to make a positive impact on the world. For more information refer to; – Accor Plastic Operational Guide – Accor Sustainability In Action – Accor Eco-Design Rating Tool available on the Accor D&TS Library. 23 < HOME > 4 DESIGN FOCUS Eco-Friendly alternatives Accor has committed to eliminating all single use plastic from the guest journey, by 2022. Focus on eliminating single use plastic water bottles Mövenpick Living brand standards are now changing to reflect the mandatory use of eco-friendly products. Single-use plastic water bottles will be replaced by reusable or returnable glass bottles to be filled with tap or filtered water from either staff or guest operated water fountains. Where infrastructure can not accommodate plumbed water fountains or local water is not safe to consume, mineral water can be provided in pre-filled glass bottles or recyclable and biodegradable cardboard cartons made with very little, or preferably no plastic film. Aluminium cans have the largest environmental impact and should be avoided. Care should be taken to ensure that any proposed alternatives in these instances do not have a larger negative impact on the planet than those being replaced, such as containers without FSC or PEFC labels and products which have the least damaging effects on the environment are preferred. Assistance sourcing alternative products will be provided by our global and regional procurement teams. Each alternative, including the visual identity, should be validated by the Mövenpick brand team. Integration of water fountains should be planned at initial design stages for all new build hotels. Existing buildings can easily accommodate water fountains into current infrastructure by considering placement in areas with established water sources such as F&B, Spa, Fitness and Pool or near restrooms. Placement should also consider access to electrical sources for powered water systems if required. Raised flooring and suspended ceilings can be added to help conceal additional piping where necessary. For more information refer to Appendix. 24 < HOME > 4 DESIGN FOCUS Eco-Design method Mövenpick Living is committed to environmental protection with a focus on sustainable design and construction. As part of this commitment, we have established a set of mandatory standards that aim to build positive eco-friendly approach to the design process. Eco-design is a method that integrates environmental protection criteria into the design process, from the creation to the end of life. Mövenpick Living design must apply its method from the very beginning of each project, for all areas and products. Our aim is to create the best product and/or space, regarding its use, expected quality, and lifespan, while minimising its negative impacts on the environment. For example, it means favouring mobile furniture to carpentry, easier to reuse and recycle, or always favouring environmental-friendly, local materials. “ Our business is dependent on preserving and conserving the environments, cultures and communities in which we operate. Guests will find evidence of our commitment in the meaning ful details found within our bold, inspired design and genuine craftsmanship”. Mövenpick Brand Team 25 < HOME > 4 DESIGN FOCUS Eco-Design strategy Mandatory actions to implement within Mövenpick Living design. Good Practice Priorities 2021-2022 Practices to be Avoided Wood and products derived from wood certified FSC or PEFC. Oversized packaging not adapted to the size of the product which increases volumes transported. >20% of the materials (by weight) traced, certified and eco-labeled (GOTS, BCI, FSC, PEFC, GRS, GOLS, cradle to cradle). Products which cannot be maintained, repaired and refurbished. All textiles labelled Oeko-Tex® or equivalent. E1 compliant formaldehyde emission in wood derived products. Multi-materials packaging which cannot facilitate easy recycling. Products which cannot be sourced in regional area (=Hub) and require plane transport. Water or bio-based stains, paints, varnishes and oils. PVC materials in products. 26 < HOME > 4 DESIGN FOCUS Key Principles of eco-design Mandatory principles that must be applied in all Mövenpick Living design projects. Products Materials Suppliers 6. Limit the use of metal in furniture, Favour suppliers who: 10. Limit and value production loss. 11. Limit the use of energy for production, and if possible, use renewable energy. 12. Use eco-friendly transport such as co-trucking and eco-driving and implement a CO2 charter to reduce their carbon emissions. avoiding chrome finishes (except for bathroom equipment) and galvanized steel. Stainless steel is preferred but only if it is justified in its use by extending the objects lifespan or protecting frequently used mechanisms. 7. Always select materials with a view to extending the lifespan of the object. For example, plastic is not necessarily worse than metal if it prolongs the objects use. 8. Favour wood or materials derived from wood and plywood, using only water-based and natural glues. 9. Avoid materials that are not easily recycled such as PVC edges, fiberboards and inert materials that cannot be dismantled. 1. Always favour mobile furniture over carpentry, avoiding objects that are difficult to reuse and recycle. 2. Select solid furniture with an extended lifespan which is easy to clean, maintain, dismantle and reuse. 3. Limit the number of different materials in any one product, favouring mono-material objects to facilitate easy recycling. 4. Favour furniture with limited covering. 5. Electrical products must have an A+ energy efficiency rating as a minimum. LED is mandatory. 27 < HOME > 4 DESIGN FOCUS Ergonomics for Health & Well-being 1/2 Principles to facilitate accessible cleaning for our housekeeping colleagues and create the healthiest, most comfortable room for our guests. Layout Materials Less furniture and objects to move and clean. Curtains 1cm above floor to avoid lifting to vacuum. Washbasin countertop width 70cm or more, where possible, to allow enough space for guest’s belongings. Smooth materials and rounded edges that reduce dust collection. Anti-stain finishing on surfaces. Floor textiles in light colours or plain patterns that easily show marks or stains. Washbasin or shower tray in dark colours that reveal traces of limescale. Shelves easily accessible for both guests and housekeeping colleagues with top shelf height in a wardrobe less than 1m65cm from floor. If above 1m65cm, shelf should be made in tube or grid to avoid dust, and at a maximum height of 1m80cm to easily see objects. Heavy furniture that is difficult to move. Shower tray less than 90x100cm, with entry space less than 65cm. Narrow circulation spaces around objects, for example, less than 60cm clearance around each bed. Gaps between furniture/joinery that cannot be properly cleaned. 28 < HOME > 4 DESIGN FOCUS Ergonomics for Health & Well-being 2/2 Principles to facilitate accessible cleaning for our housekeeping colleagues and create the healthiest, most comfortable room for our guests. FF&E Power sockets between 40cm and 1m20cm from floor for easy access for both guests and housekeeping colleagues. Shower toiletries at back of shower or in wall niche that impedes easy cleaning. Power sockets at easily accessible heights for fixed devices such as TV, phone or minibar. Shelves that are too high (above 1m65cm) or too low (under sink). Power socket for vacuum at easily accessible height that prevents housekeeping staff from stooping. Mirrors that are too high or wide and require specialist cleaning tools. Power sockets with child safety shutters. Shower screens that are too high or wide and require specialist cleaning tools. Bed with adjustable height, where possible, to facilitate easy linen changes. Furniture and objects that are too low to facilitate easy cleaning, for example, minibar on the floor. Washbasin and countertop width above 70cm, where possible, to allow enough space for guest’s belongings. Wardrobe without doors and easily accessible shelves. 29 < HOME > 5. Iconic spaces – Main Areas – Architecture – my Mövenpick marketplace (mmm) – Arrival – The Library – Play Space – Clutter Free Meetings – Circulations – Apartments – Bedroom – Bathroom – Smart Room – Fitness & Well-being 30 < HOME > 5 ICONIC SPACES Main Areas STAND-ALONE CO-LOCATED (with another Mövenpick) Environmentally Sustainable Design Environmentally Sustainable Design my Mövenpick marketplace (lobby living concept) my Mövenpick marketplace (lobby concept) MANDATORY OPTIONAL/ DEPENDENT ON MARKET Apartments Fitness & Well-Being Circulation The Library Play Space Outdoor Areas 31 Apartments All other areas shared with co-located property < HOME > 5 ICONIC SPACES Architecture outdoor areas Architecture should be environmentally and economically sustainable. The hotel building will be harmonious with its surroundings and will respect its local environment. Mövenpick hotels should be recognised as leading local examples of innovative and green architecture. The design of the hotel building should be visually appealing with inspiring elements, particularly at the entrance and in outdoor areas. Gardens, where present, are to be considered as valuable assets. Respecting the brand design DNA, gardens should be multi-functional spaces with areas where guests can find peace and serenity or where memorable events take place. 32 Mövenpick Hotel & Spa Bangalore < HOME > 5 ICONIC SPACES my Mövenpick marketplace (mmm) A lobby concept built around the idea of a ‘marketplace’. Where everything before the guest lift and check-in revolves around a premium food and beverage experience. The guests should feel a specific sense of location, that they are in a specific place and not just anywhere. Relaxed and comfortable, inspired, yet never pretentious. This is Mövenpick Living. Mövenpick Living’s commitment to sustainability is evident to guests from the moment of arrival and should feature greenery, such as a living green wall. It is important to reflect local influence in the design. Connectivity is key and both Wi-Fi and discreet device charging points should be available everywhere. Seven experiential touch-points are key to making this concept cohesive and true to the vision. Focus on the experience and curation of the guest journey: – Welcome – Eat – Drink – Shop – Relax – Learn – Work For more information refer to my Mövenpick marketplace Concept & Style Guide available on the Accor D&TS Library. 33 < HOME > 5 ICONIC SPACES Arrival welcome Arrival at Mövenpick Living is immediately welcoming, with its residentially inspired design putting guests at ease, making it feel more like home than hotel, with a focus on the experience and curating the guest journey. The entrance gives a positive first impression, dynamic and engaging. It should be as welcoming as possible and make full use of views, sight lines space and lighting. At Mövenpick Living the overriding philosophy is to make the experience smooth and efficient. Augmented technology enables tablet assisted and mobile check-in/out. The arrival experience is curated by the Residence Manager and the Mövenpick Living team. Together, they serve as hosts and expert guides to the city or resort where guests will make Mövenpick Living their home. 34 < HOME > 5 ICONIC SPACES The Library The Library is a quieter, more reflective zone for those who need to get something done or perhaps simply wish to immerse themselves in a book. The Library is again residential – informed by the den or office of a private home, yet unpretentious and accessible. The Library can be a nook or corner space, subtly delineated by design so as to feel both integrated with the coffee and wine Lounge, and Mövenpick Market – and yet separate and distinct. 35 < HOME > 5 ICONIC SPACES Play Space Exclusively designed for Mövenpick Living residents, the Play Space is usually by the Lobby or Fitness area. It’s where residents unwind and kick back with friends, colleagues and families. There are big screens for big games and cinema favorites, plus billiards or a football table. It’s an extension of a private apartment – and the ultimate entertainment room. Programming varies by market. In business locations, small private meeting rooms are incorporated alongside areas enabling residents to work in a relaxed setting. Resorts offer amenities for families. Shared kitchens and private screening rooms are optional. 36 < HOME > 5 ICONIC SPACES Clutter Free Meetings Clutter free meetings combines clean and contemporary meeting room design with interactive technologies demanded by today’s clients. In our meeting spaces you’ll also find The Inspiration Hub - an out of the ordinary meeting room for out of the ordinary meetings. Street food is an innovative and immersive healthy food and drink concept specifically designed for clutter free meetings. The Brain Station is a go-to refreshment destination to enjoy a shared break out experience. 37 < HOME > 5 ICONIC SPACES Circulations Circulation at Mövenpick Living is designed to handle busy times, limited arrival and departure schedules and seasonal, extended stay luggage, while still creating a sense of an approachable, premium environment. Wayfinding is thoughtfully considered through lighting and design, enabling visitors to quickly find their bearings and navigate comfortably as though they were at home. Water fountains should be located on each level, accessible for guests to refill a glass or reusable bottle, in keeping with Mövenpick Living's generous nature and respect for the environment. Mövenpick Marrakech 38 Mövenpick Heritage Hotel, Sentosa Island, Singapore < HOME > 5 ICONIC SPACES Apartments sense of home Whether staying for a night or two, or several months – guests of Mövenpick Living are seeking a sense of home. Our apartments are designed to put guests at ease, enabling families to stay together and allowing business travelers to forgot that they are on the road. APARTMENT FEATURES Full Kitchen/ Kitchen Wall* *Kitchen wall in studios Home Office/ Workspace Lock-off/ Interconnecting Facility Iron & Ironing Board Dishwasher Kettle & Tea Set/ Coffee Machine Washer/Dryer Apple TV (or equivalent) 39 REQUIRED OPTIONAL Mövenpick Bangkok Ekkamai Mövenpick Phu Quoc < HOME > 5 ICONIC SPACES Apartments layout Example - 1 bedroom apartment. APARTMENT TYPE MIX GLOBAL SIZE GLOBAL M2 MIX EUROPE SIZE GLOBAL M2 Guestroom 25% max 30 10% 25 Studio 45% 38 75% 30 1 Bedroom 35% 57 15% 45 2 Bedroom 15% 77 - - 40 Balcony (optional in urban layouts) Relax/Work/Dine/ Kitchen Bedroom Arrival Wardrobe/ Grooming Closet (optional) Bathroom Wardrobe/ Grooming < HOME > 5 ICONIC SPACES Bedroom atmosphere Mövenpick Living guestrooms and suites provide our guests with a tranquil warm and inviting space to enjoy their privacy. The contemporary interior provides a high level of comfort, with a clear focus on quality, thoughtful design elements and functionality. The design should be uncomplicated, but not minimalist. furnishings The use of built in furnishings should be minimised in favour of free standing furniture pieces, which will infuse a more residential feel to the spaces and allow for increased layout flexibility. Large smart TVs which can be as easily viewed from comfortable sofas and/or lounge chairs – to which small mobile side tables can be paired for snacking or working - together with high quality beds and headboards in soft touch contract grade fabrics, all form part of the essentials of a Mövenpick Living guestroom. Decorative wall and designer floor lamps can help highlight calm corners and hard floors can be further dressed with rugs (maybe adding a regional touch), keeping an eye on always using suitable flooring materials for the location and climate of the property. Black out curtains and sheers can help add a touch of colour to the room. lighting & temperature Lighting is key to create a homely ambience. Lighting should also be functional including bedside lighting, overhead recessed lighting, and unobtrusive desk lamps. Lighting and temperature control must be functional and easy to use. Mövenpick Resort Cam Ranh Bay 41 Mövenpick Hotel Malabata Tanger < HOME > 5 ICONIC SPACES Bathroom Guest bathrooms should provide a space where the guest feels refreshed and invigorated. Special attention is to be given to the layout of bathroom to ensure optimal use of space and guest comfort. The design should be functional, uncomplicated, and generous. Surfaces should provide ample space for guests to place items brought from home. Particular attention should be paid to the shower experience. Rain showers complemented by hand held fixtures and effective glass partitions to contain water within the shower. Lighting is also a key element in bathrooms. It should functional to enable make-up and shaving and provide a pleasant atmosphere. Indirect room lighting, dimmable lights and back-lit surfaces should be considered. 42 Mövenpick Mansour Eddahbi Marrackech < HOME > 5 ICONIC SPACES Smart Room Smart Room is an innovative concept using the principles of inclusive design for all to transform under utilised, standard accessible rooms into beautifully designed, universal Smart Rooms that enhance comfort and well-being whilst removing segmentation between able-bodied, reduced mobility and sensory impaired guests. From the wheelchair user who requires wider doors and reliable flooring, the family who are looking for additional space, the visually impaired guest who requires easy access to a larger print room service menu to the elderly traveller who prefers a walk-in shower. Smart Room is intelligently designed with efficient use of space and thoughtfully considered materials to give guests peace of mind that their individual needs are taken care of whilst they are immersed within the full Mövenpick brand experience. An inspired set of key features help to optimise the look and feel of Smart Room, including stylish, ergonomic integrated support bars, adjustable fixtures, accessible furniture and intuitive, interactive technology, creating a unique universal guest experience, seamlessly blending accessible functionality with the warm, contemporary style and authentic craftsmanship synonymous with Mövenpick. For more information refer to Accor Smart Room Guidelines available on the Accor D&TS Library. 43 < HOME > 5 ICONIC SPACES Fitness & Well-being Mövenpick Living is where wellness meets hospitality. This unique approach positions Mövenpick hotels as premier spa and wellness destinations in their markets. A true home away from home enables residents to maintain their good habits – no paused exercise regimes while they travel near and far. Fitness at Mövenpick Living is designed to sustain a healthy lifestyle, and ensure travel without compromise. 44 < HOME > 6. Appendix – Operational Recommendations – Reference Documents – Manual Disclaimer 45 < HOME > 6 APPENDIX Operational recommendations To be specified with suppliers/technical services by each hotel based on requirements. MEETING AREA & BREAK SPACE RESTAURANT & BAR GUESTROOMS & SUITES SPA/FITNESS LOBBY VENDING MACHINE & TAKEAWAY Filtered Water in Pre-fill Reusable Glass Bottles or Mineral Water in Returnable Glass Bottles Filtered Water in Pre-fill Reusable Glass Bottles or Mineral Water in Returnable Glass Bottles Filtered or Tap Water (if good quality) through Self Service Fountain or Filtered or Tap Water through Faucet Carton Brick Filtered or Tap Water (if good quality) through Self Service Fountain or Mineral Water in Returnable Glass Bottles or Filtered Water in Pre-fill Reusable Glass Bottles Carton Brick to be considered ONLY for regions where tap water is not drinkable Mineral Water in Reusable Glass Bottles Mandotary Optional To be washed in Hotel on return 46 < HOME > 6 APPENDIX Reference documents – Mövenpick Style Book – Mövenpick Brand Presentation – Accor Smart Room Guidelines – Accor Plastic Operational Guidelines – my Mövenpick marketplace Concept & Style Guide – Accor Planet 21 Guidelines – Sustainable Design Guidelines – Environmental Compliance Guidelines 47 < HOME > – give notice of any breach or non-compliance with the obligations imposed by this Confidentiality Undertaking,and provide all possible assistance to mitigate the effects of such breach or non-compliance. Considering the disclosure of this information, you also undertake not to use the Confidential Information for the requirements of a business and/ or of an individual or legal entity that is a competitor of Accor. And in the event that you, for any reason, choose not to operate or cease to operate an Accor’s establishment, you undertake to immediately destroy all copies of the present document that you may have made. You finally acknowledge that the disclosure of any Confidential Information contained in the present document is in breach of this undertaking and will give rise to legal proceeding with payment of potential damages. ACCOR SA A French limited liability company registered at the Trade and Companies registry RCS PARIS B 602 036 444. 82 rue Henri Farman CS 20077 – 92445 Issy les Moulineaux FRANCE 6 APPENDIX Manual disclaimer The present document was developed to explain the brand’s vision and its design strategy. The visuals used to illustrate the brand’s strategy are either Accor’s visuals or “aspirational”visuals. The images,photographs and/or drawings used in this document must not be directly used, reproduced, displayed or adapted. Accor intends to condition the disclosure of this document to the present confidentiality undertaking. By accessing this document, you undertake to: – hold and maintain the strictest confidentiality regarding the content of the present document,considered as confidential information, such as, in particular, images, photographs, designs, drawings, information, data; – not use, sell, transcribe, transfer, publish, disclose, copy, display, reproduce, or otherwise deal with the documentary material included in this document in any manner whatsoever or in any form whatsoever,either partially or fully, and; – not disclose the present document content or any portion thereof, to any other third party, other than to employees or authorized subcontractors who need to know the content of this documentation for the strict purposes of implementing or evaluating the Operational Brand standards (collectively, “Representatives”), provided that such Representatives have been informed in advance of the confidential nature of this documentation and instructed to comply with the same confidentiality obligations as those undertaken in this undertaking without any condition, limitation or restriction whatsoever; 48 < HOME > Thanks"}, {"code": "1.1.03", "title": "瑞享 Resort Residences 设计简报", "en": "Mövenpick Resort Residences Design Brief", "cat": "cat_brand", "version": "V2.0", "date": "2022-12", "brand": "Mövenpick 瑞享", "file": "1.1.03 Movenpick Resort Residences Design Brief Dec 2022 V2.0.pdf", "path": "C:\\Users\\JOZHOU\\Downloads\\1.1.03 Movenpick Resort Residences Design Brief Dec 2022 V2.0.pdf", "pages": 97, "size_mb": null, "desc": "度假住宅（Resort Residences）设计简报：度假型住宅的产品定位、品牌概览、设计手法、设计聚焦、标志性空间与可持续要求。面向度假目的地住宅产品开发。", "kw": ["Resort Residences", "度假住宅", "设计简报", "产品定位", "设计聚焦", "标志性空间", "可持续", "V2.0"], "reference": false, "refNote": "", "text": "度假住宅（Resort Residences）设计简报：度假型住宅的产品定位、品牌概览、设计手法、设计聚焦、标志性空间与可持续要求。面向度假目的地住宅产品开发。 Resort Residences 度假住宅 设计简报 产品定位 设计聚焦 标志性空间 可持续 V2.0"}, {"code": "1.1.04", "title": "瑞享 Urban Residences 设计标准", "en": "Mövenpick Urban Residences Design Brief", "cat": "cat_brand", "version": "V2.0", "date": "2022-12", "brand": "Mövenpick 瑞享", "file": "1.1.04 Movenpick Urban Residences Design Brief Dec 2022 V2.0.pdf", "path": "C:\\Users\\JOZHOU\\Downloads\\1.1.04 Movenpick Urban Residences Design Brief Dec 2022 V2.0.pdf", "pages": 96, "size_mb": 22.32, "desc": "城市住宅（Urban Residences）设计标准：品牌概览、设计手法、设计聚焦（艺术/材料/FF&E/照明/标识寻路/技术/色彩/外部围挡/可持续）、建筑（平面/面积/外立面/到达大堂/走廊）、住户酒廊/会所与可持续。", "kw": ["Urban Residences", "城市住宅", "设计标准", "外立面", "到达大堂", "标识寻路", "围挡", "会所", "面积", "平面", "V2.0"], "reference": false, "refNote": "", "text": "Urban Residences Design Standards V1.0 December 2022 1 < HOME > Summary 03 Objectives of the design brief 04 Mövenpick residences defined 01. Brand overview 02. Design approach 03. Design focus 14 15 16 17 18 19 20 Art 21 22 Materials FF&E Lighting Signage & wayfinding Technology Colour External hoarding Sustainability 05. Architecture 33 Adjacencies diagram 34 Indicative Layout 36 Area sizes 37 Exterior & facade 38 Arrival lobby 40 Corridors & circulations 06. Residents lounge/clubhouse 42 Adjacencies diagram 43 Overview Welcome My Mövenpick Marketplace 44 46 Retail 48 50 52 Bar 54 Organic garden Lounge Library 04. Services 30 31 Core services À la carte services 2 The Event room 56 58 Playground 07. Fitness & Spa 61 Adjacencies diagram 62 Overview Gym 63 Pool 65 Thermal experience 67 Treatment rooms 69 08. Apartments 72 Overview 73 Studio 75 One bedroom 77 Two bedroom 79 Three bedroom 09. Sales gallery 82 Adjacencies diagram 83 Indicative layout 84 Overview 85 86 87 Zone 1: welcome Zone 2: unveiling Zone 3: reveal 10. Operations 89 Heart of house 90 Lobby services 91 Residents parking 11. Appendix 93 Operational recommendations 94 Reference documents Manual disclaimer 95 < HOME > Objectives of the design brief This design book provides a practical and inspirational guide for design teams during the conceptualisation phase of a Mövenpick Residences. It is an invaluable tool in understanding the brand’s design philosophy, and the key design considerations, which help celebrate each hotel’s own unique spirit. They are created to be a design framework, focused on standard requirements for consistency. It should be flexible enough to allow every designer to bring their own unique vision to life within the Mövenpick design philosophy. 3 < HOME > Mövenpick Residences defined The Place To Savour Life. We know small gestures can make all the difference. So, we do ordinary things in an extraordinary way – a philosophy key to our brand success from the start. With a Swiss heritage dating back to the 1940s, The Mövenpick brand offers a unique blend of contemporary city and resort hotels across the world. A rich legacy, with no compromise on quality or authenticity, which is reflected in Mövenpick Residences. A beautiful collection of exquisite private residences and penthouses situated in some of the world’s most exciting and memorable locations. In a Mövenpick private home, residents enjoy privacy and exclusivity, paired with the remarkable services and amenities that has become the hallmark of the Mövenpick brand. Combining elegance, innovation and an extensive residential service offering, the Mövenpick Residences portfolio includes some of the most outstanding apartments, villas and chalets found anywhere in the world. Expansive floor plans are designed for entertaining, remote working, seamless living and highlighting our original and vibrant designs. Created to celebrate the moments in life, they offer a distinctively modern lifestyle, a full suite of hospitality services available 24/7, and the same five-star standards in service and amenities so familiar in our resorts and hotels. 4 < HOME > 1. Brand overview 5 5 < HOME > < HOME > 1 BRAND OVERVIEW Mövenpick identity Roots Founded in 1948 by Ueli Prager, Mövenpick was a pioneer on the Swiss restaurant scene and evolved into a premium international hotel brand, with inventive culinary excellence at its heart. Vision We believe true hospitality is about turning small gestures into heartwarming moments. Promise Enable our guests to savour the flavour of life, balancing small indulgences with what’s good for them – and good for the world. Ambition Be the hotel brand that truly cares, combining a commitment to excellence with a genuine, unpretentious approach. 6 < HOME > Residences that care for people and the planet, where owners can savour life in an easy-going environment. Brand values – Respect: Mövenpick adopts a respectful attitude towards owners, employees, local communities and the environment. – Originality: Mövenpick constantly invents new ways to surprise owners, from a creative twist on a Swiss favourite dish to a considerate personal gesture. – Generosity: Mövenpick loves to see its owners happy and satisfied, and makes sure they get everything they need before they even know they need it. – Excellence: Mövenpick maintains high-quality hospitality standards at every level with exceptional F&B and welcoming service as well as a leading sustainability position. Brand character – Inventive: Mövenpick’s inventiveness lies in its resourceful and entrepreneurial spirit, constantly enhancing the residential journey by creating new experiences to savour. – Genuine: Mövenpick has always remained true to itself and deeply caring of people. The brand embodies a unique thoughtfulness expressed through small gestures. Emotional benefits – Content – Relaxed 7 < HOME > 2. Design approach 8 8 8 < HOME > < HOME > < HOME > A COLOUR UPLIFTING A TEXTURE SMOOTH A SCENT MEADOW A FIGURE YOURSELF A DRINK INDULGENCE A MUSIC MELODIC AN OBJECT / A TREND A ROOM A CAR A STORY A COUNTRY / A PLACE AN ARTWORK GENUINE WITH A VIEW CONVERTIBLE ANTHOLOGY WHERE THE HEART IS SPONTANEOUS A MOMENT AN ANIMAL HEARTWARMING ON THE WING A DISH FRESH A FLOWER FRAGRANT A MONUMENT A LANDSCAPE SOUVENIR ALPINE 9 < HOME > 2 DESIGN APPROACH Design ambition \"We do ordinary things in an extraordinary way.\" Ueli Prager, founder of Mövenpick When designing a Mövenpick project, Designers should study the brand aesthetic and original DNA, as well as the history and culture of the project’s geographic location. This helps create a 360-design narrative and a definite sense of place. Start with clean and contemporary architectural plans. Create interest, by shifting surfaces inward and outward. Highlight features with powerful colours, as well as contrasting finishes. Tie in the cultural influences with strategically positioned organic relief in unexpected, artistic ways such as floor patterns, balustrades, carpets and textiles. Include uniquely designed and sensory finishes. Look to generate a warm and natural atmosphere that effortlessly makes people feel good in the space. Create a bold combination of design and function with contemporary furniture in rich and dynamic materials and accessories with regionally inspired artwork. Create guestrooms that are functional and intuitively friendly to all guests. Work side by side with F&B consultants and the brand to create restaurant identities that will be the heart and soul of the venue’s success. And whenever possible, align efforts with Mövenpick’s Global Sustainability philosophy. Incorporate low impact, non-toxic, sustainably produced, or recycled materials and energy efficient products. Most importantly, allow room for creativity but keep it simple. For more information refer to Mövenpick Style Book available on the Accor D&TS Library 10 < HOME > 2 DESIGN APPROACH Mövenpick residences Mövenpick Residences will usually be co-located with a Mövenpick Hotel. They are carefully set apart to reinforce the exclusivity of a private residence, but discretely integrated to ensure owners enjoy a rich service offering and private access to the hotel facilities. They are reflective of the local architecture and heritage, while the interiors have all the stunning design, uplifting ambience and attentive service you would expect from Mövenpick – a truly extraordinary setting for a private home. Each property is managed and operated by Mövenpick and designed and built to their exacting brand standards. They are designed specifically to meet local market needs and the offering provided at each property will reflect this. Depending upon location, some amenities and services will be accessed at an adjoining hotel and some exclusive to owners. 11 < HOME > 2 DESIGN APPROACH Style A timeless style, beyond trend. Generally, the design should be warm, contemporary – but not trendy - providing a modern, timeless feel and a friendly atmosphere. Not minimalist. Local content or traditions should be considered in the design. It needs to be discreet. The overall concept should be a bold combination of design and function using modern furniture together with rich textures and dynamic materials. 12 < HOME > 3. Design focus – Materials – FF&E – Lighting – Signage & wayfinding – Technology – Colour – Art – External hoarding – Sustainability 13 13 < HOME > < HOME > 3 DESIGN FOCUS Materials Style should never supersede comfort. All shared spaces should combine rich and dynamic materials to ensure the design is bold whilst conveying comfort and warmth to reflect the brand DNA. Always look to choose premium quality, authentic materials to enhance that experience and style. Choosing a mix of materials and contrasting finishes. Aim to strike a balance of colour, brightness, and textures of material to produce that unique and interesting look and feel. For example, wooden flooring and contemporary tiles, stone and glass, marble and metal. This same approach should be applied to both indoor and outdoor spaces. It is important that 20% of materials and products used is manufactured within five hundred miles of the project site. Textiles, wall coverings, window treatments, signage, accessories, and artwork must have some of the brands rapidly renewable attributes including, natural materials harvested on a 10-year or less rotation, such as bamboo and wool. These should be biodegradable or part of the manufacturer’s take-back program. Cultural and organic references should be visible in the materials selection. A guided choice materials package will be curated as a purchasable option for owners who do not wish to furnish the residence themselves. This should be undertaken by an interior designer in line with the Mövenpick brand identity. 14 < HOME > 3 DESIGN FOCUS FF&E Mövenpick FF&E design is simple and intuitive, appropriate in its use of materials, handling and construction. Designers should u
